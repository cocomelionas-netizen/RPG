<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Endless Road">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Endless Road</title>
<style>
  :root {
    --bg: #14121c;
    --panel: #1f1c2b;
    --panel2: #2a2639;
    --line: #3a3550;
    --text: #e9e6f2;
    --muted: #9d97b3;
    --accent: #f2c94c;
    --good: #6fd27a;
    --bad: #e86a6a;
    --xp: #6aa8ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  html, body { overscroll-behavior: none; }
  #view, button, nav, #goal, header { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body.modal-open { overflow: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
    padding-top: max(10px, env(safe-area-inset-top));
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
  #mute, #gfx { padding: 2px 8px; min-height: 0; font-size: 16px; line-height: 1.2; }
  #gfx { font-size: 12px; font-weight: 700; margin-left: 6px; }
  #acct { padding: 2px 10px; min-height: 0; font-size: 13px; line-height: 1.4; margin-right: 6px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .stat { color: var(--muted); display: inline-block; }
  header .stat b { color: var(--text); }
  #gold b { color: var(--accent); }
  #renown b { color: #d9c0ff; }
  .ach { border: 1px solid transparent; }
  .ach.done { border-color: #6b5a24; background: #2e2a1c; }
  .ach:not(.done) { opacity: .62; }
  .ach .bonus { color: var(--good); font-size: 12px; }
  .bonuses { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 12px 16px; }
  #view {
    position: relative; width: 100%; aspect-ratio: 3 / 1; overflow: hidden;
    border-radius: 10px; border: 1px solid var(--line); background: #000;
  }
  #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #scene3d { display: none; }
  #view.g3 #scene3d { display: block; }
  #stage { position: relative; }
  #goal {
    margin-top: 8px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    background: #2b2540; border: 1px solid #4a3f6e; display: flex; gap: 8px; align-items: center;
  }
  #goal b { color: var(--accent); white-space: nowrap; }
  #ticker { display: none; }
  #toast {
    position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); z-index: 3; pointer-events: none;
    padding: 8px 16px; border-radius: 12px; background: rgba(20, 16, 32, 0.88); border: 1px solid #6b5a24;
    color: var(--accent); font-weight: 800; font-size: 18px; text-align: center; max-width: 92%;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5); animation: toastIn 0.25s ease-out;
  }
  @keyframes toastIn { from { transform: translate(-50%, -50%) scale(1.25); opacity: 0; } }
  @media (max-width: 700px) { #toast { font-size: 15px; top: 30%; } }
  nav.tabs button.locked, .chips button.lockd, .acticons button.lockd { opacity: .42; filter: grayscale(.8); }
  .soon { margin-bottom: 10px; } .soon div { padding: 3px 0; }
  nav.tabs button.alert { position: relative; }
  nav.tabs button.alert::after {
    content: ''; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent);
  }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 12px; margin-top: 12px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
  nav.tabs button { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 6px; }
  #tab-content { padding: 12px; min-height: 260px; }
  button {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #5a5378; background: #332e46; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.sel { border-color: var(--accent); background: #3a3320; }
  h3 { margin: 14px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  h3:first-child { margin-top: 0; }
  .acts, .zones { display: grid; gap: 8px; }
  .acts { grid-template-columns: repeat(3, 1fr); }
  .zones { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .act, .zone { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 10px; }
  .act .big { font-size: 22px; }
  .zone .boss { color: var(--accent); }
  #scene { touch-action: manipulation; }
  small, .muted { color: var(--muted); font-size: 12px; }
  .info { background: var(--panel2); border-radius: 8px; padding: 10px; margin-top: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .item { background: var(--panel2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .item .top { display: flex; align-items: center; gap: 8px; }
  .item .ic { font-size: 20px; width: 26px; text-align: center; }
  .item .nm { flex: 1; }
  .item .ct { font-weight: 700; }
  .item .btns { display: flex; gap: 4px; flex-wrap: wrap; }
  .item .btns button { padding: 3px 8px; font-size: 12px; }
  .tier { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .bar { height: 8px; background: #0e0c14; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--xp); }
  .bar.hp > i { background: var(--good); }
  .skill { background: var(--panel2); border-radius: 8px; padding: 10px; }
  .skill .top { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .skill .lv { font-weight: 700; color: var(--accent); }
  aside .card { padding: 12px; margin-bottom: 12px; }
  .eq { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  .eq button { padding: 2px 8px; font-size: 12px; }
  .logtabs { display: flex; gap: 6px; margin-bottom: 8px; }
  .logtabs button { padding: 3px 10px; min-height: 0; font-size: 13px; }
  #pm-new { background: var(--accent); color: #000; border-radius: 8px; padding: 0 5px; font-size: 11px; margin-left: 2px; }
  .msgs { max-height: 260px; min-height: 100px; overflow-y: auto; overscroll-behavior: contain; font-size: 13px; display: flex; flex-direction: column; gap: 4px; margin-top: 8px; word-break: break-word; }
  .friend { display: flex; align-items: center; gap: 6px; }
  .friend .nm { flex: 1; min-width: 0; }
  .friend button { padding: 2px 6px; min-height: 0; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex: none; }
  .dot.on { background: #3fe03f; box-shadow: 0 0 6px #3fe03f; }
  .code { font: 700 22px/1.4 ui-monospace, monospace; letter-spacing: 2px; text-align: center; background: var(--bg); border: 1px dashed var(--accent); border-radius: 8px; padding: 10px; }
  #chat-new { background: var(--accent); color: #000; border-radius: 8px; padding: 0 5px; font-size: 11px; margin-left: 2px; }
  #chatlist { max-height: 260px; min-height: 120px; overflow-y: auto; overscroll-behavior: contain; font-size: 13px; display: flex; flex-direction: column; gap: 3px; word-break: break-word; }
  .chatbar { display: flex; gap: 6px; margin-top: 8px; }
  .chatbar input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .fld select { font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .item.faded { opacity: .6; }
  #log { max-height: 260px; overflow-y: auto; overscroll-behavior: contain; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
  #log div { padding: 2px 0; border-bottom: 1px dashed #2c283b; }
  .lg-good { color: var(--good); }
  .lg-bad { color: var(--bad); }
  .lg-gold { color: var(--accent); }
  .lg-xp { color: var(--xp); }
  .have { color: var(--good); } .need { color: var(--bad); }
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  #modal[hidden] { display: none; }
  #modal .card { max-width: 440px; width: 100%; padding: 18px; max-height: 80vh; max-height: 80dvh; overflow-y: auto; overscroll-behavior: contain; }
  #modal textarea { width: 100%; min-height: 110px; font: 12px/1.4 ui-monospace, monospace; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 16px; }
  .stats span { display: flex; justify-content: space-between; gap: 8px; }
  .stats b { font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips.sub { margin: 0 0 12px; }
  .chips button small { display: block; font-size: 11px; }
  .osrs { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; margin-top: 8px; }
  .opanel { background: #3e3529; border: 2px solid #1d1813; box-shadow: inset 0 0 0 1px #5d503c; border-radius: 6px; padding: 10px; flex: 1 1 250px; }
  .opanel.inv { flex: 2 1 300px; }
  .opanel h3 { color: #ff981f; margin: 0 0 10px; font-size: 14px; text-shadow: 1px 1px 0 #000; }
  .opanel h3 small { color: #c8b48a; font-weight: 400; text-shadow: none; }
  .opanel .muted { color: #b8a684; }
  .doll { display: grid; grid-template-columns: repeat(3, 52px); gap: 6px 16px; justify-content: center; margin: 0 auto 12px; }
  .doll.sm { grid-template-columns: repeat(3, 42px); gap: 4px 12px; margin: 4px auto 8px; }
  .slot { position: relative; width: 52px; height: 52px; min-height: 0; padding: 0; border-radius: 4px; background: #2b2520;
    border: 1px solid #16120d; box-shadow: inset 0 0 0 1px #4d4232; display: flex; align-items: center; justify-content: center; }
  .doll.sm .slot { width: 42px; height: 42px; }
  .slot:hover { box-shadow: inset 0 0 0 1px #ff981f; }
  .slot .si { font-size: 28px; line-height: 1; filter: drop-shadow(1px 2px 0 rgba(0,0,0,.7)); }
  .doll.sm .slot .si { font-size: 22px; }
  .slot .si.ph { opacity: .2; filter: grayscale(1); }
  .slot .sn { position: absolute; top: 2px; left: 3px; font: 700 12px/1 system-ui, sans-serif; color: #ffff00; text-shadow: 1px 1px 0 #000; }
  .slot .sn.w { color: #fff; } .slot .sn.g { color: #00ff80; }
  .slot.up::after { content: '▲'; position: absolute; right: 3px; bottom: 2px; font-size: 10px; color: #3fe03f; text-shadow: 1px 1px 0 #000; }
  .invgrid { display: grid; grid-template-columns: repeat(auto-fill, 52px); gap: 6px; justify-content: center; }
  .eqstats { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: 12.5px; color: #ffcf8a; }
  .eqstats b { color: #fff; text-align: right; }
  .imenu .ihead { display: flex; gap: 12px; align-items: center; }
  .imenu .big { font-size: 38px; }
  .imenu .opts { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .imenu .opts button { text-align: left; }
  .uqs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .uq { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #2f2a44; color: var(--muted); }
  .uq.got { background: #2e4a2a; color: #c8f0b8; }
  .item.boss { box-shadow: inset 0 0 0 1px #6b5a24; }
  .tag.m { background: #3a3014; color: #f2c94c; }
  .fld { display: grid; gap: 4px; margin: 8px 0; font-size: 13px; color: var(--muted); }
  .fld input { font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  table.hs { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  table.hs th { text-align: left; color: #ff981f; font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  table.hs td { padding: 5px 6px; border-bottom: 1px solid #26223a; }
  table.hs tr.me td { background: #2e2a1c; }
  .info.wild { background: #2a1414; border: 1px solid #6a2a2a; margin-bottom: 10px; }
  .info.wild p { margin: 6px 0; }
  .info.wild .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
  .info.wild button small { display: block; font-size: 11px; color: var(--muted); }
  .bar.pool > i { background: #c99a2e; }
  .mpool { margin-top: 8px; display: grid; gap: 4px; }
  .mpool button { justify-self: start; padding: 3px 10px; font-size: 12px; }
  .steps { list-style: none; padding: 0; margin: 8px 0 12px; font-size: 13px; }
  .mlist { display: grid; gap: 6px; }
  .mrow { display: flex; align-items: center; gap: 8px; background: var(--panel2); border-radius: 8px; padding: 6px 8px; }
  .mrow.lock { opacity: .5; }
  .mrow .ic { font-size: 22px; } .mrow .nm { flex: 1; } .mrow .bar { margin-top: 4px; height: 6px; }
  .mrow button { display: flex; flex-direction: column; align-items: center; padding: 3px 8px; font-size: 12px; min-height: 0; }
  .spellbook { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; margin-top: 8px; }
  .spell { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 1px; padding: 6px 8px; border-left: 3px solid var(--c); }
  .spell small { font-size: 11px; color: var(--muted); }
  .spell.cur { box-shadow: 0 0 0 1px var(--c); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: #2f2a44; color: var(--muted); }
  .tag.good { background: #1f3a24; color: var(--good); } .tag.bad { background: #3f2024; color: var(--bad); }
  .quest { border: 1px solid transparent; }
  .quest.ready { border-color: #6b5a24; }
  .quest .bar { margin-top: 3px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  /* world map */
  .map { position: relative; width: 100%; aspect-ratio: 3 / 2; border-radius: 10px; overflow: hidden; background: #0b2a3d; border: 1px solid var(--line); }
  .map canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .loc {
    position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: 0; padding: 0; min-height: 0; z-index: 1;
  }
  .loc:hover:not(:disabled), button.loc.sel { background: none; border: 0; }
  .loc .pin {
    position: relative; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 21px;
    background: rgba(20, 18, 28, 0.82); border: 2px solid #c9b27a; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.55);
  }
  .loc .nm {
    font-size: 11.5px; font-weight: 700; color: #fff; white-space: nowrap; padding: 1px 6px; border-radius: 6px;
    background: rgba(10, 14, 22, 0.6); text-shadow: 0 1px 2px #000;
  }
  .loc.sel .pin { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(242, 201, 76, 0.35), 0 3px 8px rgba(0, 0, 0, 0.55); }
  .loc.locked .pin { filter: grayscale(1); opacity: 0.75; }
  .loc .me { position: absolute; right: -10px; top: -10px; font-size: 15px; font-style: normal; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .loc .me { animation: none; } }
  .locpanel { margin-top: 10px; }
  .locpanel .locname { font-size: 16px; }
  .acticons { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin: 10px 0; }
  .acticons button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; }
  .acticons .big { font-size: 24px; }
  .acticons button.doing { border-color: var(--good); }
  .item.on { border: 1px solid var(--good); }
  .drops { letter-spacing: 2px; }
  .check input { width: 18px; height: 18px; }
  #modal h2 { margin: 0 0 10px; font-size: 18px; }
  #modal ul { padding-left: 18px; margin: 6px 0 14px; }
  /* phone + touch rules last so they override the base styles */
  /* the game is played in portrait on phones: ask to rotate back when a phone is turned sideways */
  #rotate { display: none; }
  @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
    #rotate {
      display: flex; position: fixed; inset: 0; z-index: 20; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: var(--bg); color: var(--text); text-align: center; padding: 24px;
    }
    #rotate .big { font-size: 54px; animation: tilt 1.6s ease-in-out infinite; }
    @keyframes tilt { 50% { transform: rotate(-90deg); } }
    body { overflow: hidden; }
  }
  @media (max-width: 700px) {
    .map { aspect-ratio: 1 / 1; }
    .acticons { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .acticons button { padding: 6px 2px; font-size: 11px; min-height: 0; }
    .acticons .big { font-size: 20px; }
    .acticons small { font-size: 10px; }
    .loc .pin { width: 36px; height: 36px; font-size: 18px; }
    .loc .nm { font-size: 10.5px; }
    header { padding-block: max(8px, env(safe-area-inset-top)) 8px; gap: 4px 12px; font-size: 13px; }
    header h1 { font-size: 16px; width: 100%; }
    #acct { margin-left: auto; }
    .wrap { padding: 0 0 calc(76px + env(safe-area-inset-bottom)); }
    #stage {
      position: sticky; top: 0; z-index: 5; background: var(--bg);
      padding: 8px max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left));
      padding-top: max(8px, env(safe-area-inset-top));
    }
    #view { border-radius: 8px; }
    #goal { margin-top: 6px; font-size: 13px; padding: 6px 10px; }
    #ticker {
      display: block; margin-top: 4px; font-size: 12.5px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px;
    }
    /* thumb-reachable tab bar */
    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; flex-wrap: nowrap; gap: 2px;
      padding: 4px max(6px, env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
      background: var(--panel); border-top: 1px solid var(--line); border-bottom: 0;
    }
    nav.tabs button {
      flex: 1 1 0; min-width: 0; flex-direction: column; gap: 1px; padding: 5px 0; min-height: 50px;
      background: transparent; border-color: transparent;
    }
    nav.tabs button.sel { background: #2e2a1c; border-color: #6b5a24; }
    nav.tabs .ti { font-size: 19px; line-height: 1.1; }
    nav.tabs .tl { font-size: 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    small, .muted { font-size: 13px; }
    main { padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); margin-top: 6px; }
    #tab-content { padding: 10px; }
    .acts { grid-template-columns: 1fr 1fr; }
    .zones { grid-template-columns: 1fr 1fr; }
    #log { max-height: 160px; }
  }
  @media (pointer: coarse) {
    button { min-height: 40px; padding: 8px 12px; }
    .item .btns button { padding: 6px 10px; font-size: 13px; }
    .eq button { padding: 4px 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>🗺️ Endless Road <button id="acct" data-a="acct" aria-label="Account">👤 Log in</button><button id="mute" data-a="mute" aria-label="Toggle sound">🔊</button><button id="gfx" data-a="gfx" aria-label="Switch between 3D and 2D graphics" hidden>3D</button></h1>
  <span class="stat" id="gold">Gold: <b>0</b></span>
  <span class="stat" id="cmb">Combat level: <b>1</b></span>
  <span class="stat" id="dist">Distance: <b>0 m</b></span>
  <span class="stat" id="renown" hidden>Renown: <b>0</b></span>
</header>
<div class="wrap">
  <div id="stage">

// RuneScape/Melvor style XP curve
const XP_TABLE = [0, 0];
{ let pts = 0; for (let l = 1; l < 99; l++) { pts += Math.floor(l + 300 * Math.pow(2, l / 7)); XP_TABLE[l + 1] = Math.floor(pts / 4); } }
function levelFromXp(xp) { let l = 1; while (l < 99 && xp >= XP_TABLE[l + 1]) l++; return l; }

  defItem('staff' + t,  { name: STAFF_N[t], icon: '🪄', tier: t, value: [12, 30, 60, 120, 240][t], slot: 'weapon', wtype: 'magic', power: [2, 5, 9, 14, 20][t], req: GATHER_REQ[t], type: 'Equipment' });

for (let m = 0; m < 6; m++) {
  const mn = METALS[m], color = METAL_COLORS[m];
  defItem('bar' + m, { name: mn + ' Bar', icon: '🧱', color, tier: m, value: [8, 12, 30, 60, 120, 260][m], type: 'Bars' });
  defItem('arrow' + m, { name: mn + ' Arrows', icon: '➶', color, tier: m, value: [1, 2, 3, 5, 8, 14][m], power: [1, 3, 5, 8, 12, 16][m], type: 'Ammo' });
  RECIPES.push({ out: 'bar' + m, req: BARS[m].lvl, xp: BARS[m].xp, mats: BARS[m].mats, station: 'furnace', time: 2.0 });
  for (const k of SMITH_ITEMS) {
    const id = k.key === 'sword' ? 'sword' + m : k.key === 'platebody' ? 'armor' + m : k.key + m;   // keep old save ids where they exist
    // worth a little more than the bars that went in; multi-item recipes (arrowtips) split that value
    const barV = ITEMS['bar' + m].value, value = k.n ? Math.max(1, Math.round(barV * 1.2 * k.bars / k.n)) : Math.round(barV * k.bars * 1.1);
    const it = { name: `${mn} ${k.name}`, icon: k.icon, color, tier: m, metal: m, kind: k.key, value, type: k.slot ? 'Equipment' : 'Resources' };
    if (k.slot) Object.assign(it, { slot: k.slot, req: METAL_EQUIP[m] });
    if (k.slot === 'weapon') Object.assign(it, { wtype: 'melee', power: Math.round(METAL_POWER[m] * k.pw), speed: k.speed, twoHanded: !!k.twoHanded });
    if (k.arm) it.armor = Math.max(1, Math.round(METAL_ARMOUR[m] * k.arm));
    defItem(id, it);
    RECIPES.push({ out: id, n: k.n, req: Math.min(99, METAL_LVL[m] + k.off), xp: BAR_XP[m] * k.bars, mats: { ['bar' + m]: k.bars }, station: 'anvil', metal: m });
  }
}
// endgame set made from Dragon drops and rune bars
defItem('sword6', { name: 'Dragon Scimitar', icon: '🗡️', color: METAL_COLORS[6], tier: 6, metal: 6, kind: 'scimitar', dragon: true, value: 900, slot: 'weapon', wtype: 'melee', power: 40, speed: 1.8, req: 60, type: 'Equipment' });

RECIPES.push({ out: 'armor6', req: 92, xp: 600, mats: { bar5: 3, scale: 3 }, station: 'anvil', metal: 6 });

defItem('whip',   { name: 'Abyssal Whip', icon: '🪢', unique: true, color: '#b46bff', value: 2500, slot: 'weapon', wtype: 'melee', power: 38, speed: 1.6, req: 70, type: 'Equipment' });

function applySave(data) {

/* ================= GAME LOGIC ================= */

let W = 960, HX = 230, FS = 1;   // view width, hero x and font scale change on phones
const H = 320, GY = 262, WALK = 230;

function spawnEntity() {
  // fixed distance so pacing (and offline progress) is the same on every screen size
  const x = R.worldX + Math.max(790, W - HX + 60) + Math.random() * 140;
  const act = S.activity;
  if (act === 'combat') {
    // Auto Slayer walks to the task's area and only fights the task monster
    const auto = S.autoSlayer && S.task && zoneOpen(S.task.zone);
    if (auto && S.zone !== S.task.zone) S.zone = S.task.zone;
    if (ZONES[S.zone].wboss && !zoneOpen(S.zone)) S.zone = bestZone();
    const z = ZONES[S.zone];
    if (z.wboss) {
      const id = WB_BOSSES[(WB.st && WB.st.kind) || 0], d = ENEMIES[id];
      R.ent = { kind: 'enemy', id, food: 0, d, hp: d.hp, maxHp: d.hp, atk: d.atk, def: d.def, atkT: d.speed * 0.7, x,
        stop: (d.shape === 'dragon' ? 130 : 55 + 25 * d.size) + (wtype() !== 'melee' ? 60 : 0), hit: 0, lunge: 0, pend: 0, style: d.styles[0], swap: randi(3, 5) };
      return;
    }
    const lair = S.ctarget && S.ctarget === z.boss && bossOpen(bossOf(z.boss));
    const id = auto ? S.task.id : lair || (S.ctarget && z.enemies.includes(S.ctarget)) ? S.ctarget : z.enemies[Math.floor(Math.random() * z.enemies.length)];
    const pk = z.wild && (S.ctarget === 'pvp' || Math.random() < PK_CHANCE);
    const d = pk ? makePker() : ENEMIES[id];
    // archers and mages keep their distance
    const stop = (d.shape === 'dragon' ? 130 : d.shape === 'flyer' ? 70 : 55 + 25 * d.size) + (wtype() !== 'melee' ? 60 : 0);
    R.ent = { kind: 'enemy', id: pk ? 'pker' : id, food: d.food || 0, d, hp: d.hp, maxHp: d.hp, atk: d.atk, def: d.def, atkT: d.speed * 0.7, x, stop, hit: 0, lunge: 0, pend: 0, style: d.styles ? d.styles[0] : d.type, swap: randi(3, 5) };
  } else if (act === 'thieving') {

    if (!ZONES[S.zone].course || !courseOpen(ZONES[S.zone].course)) S.zone = bestCourse().zone;
    spawnObstacle(x);
  } else if (act === 'farming') {
    const pk = farmTarget();
    R.ent = { kind: 'patch', skill: 'farming', pk, acts: 3, t: 0, x, stop: 70, hit: 0, swung: false, blocked: false };
  } else if (CRAFTING.has(act)) {
    const kind = act === 'smithing' ? craftRecipe('smithing').station : { cooking: 'fire', fletching: 'bench', runecrafting: 'altar', firemaking: 'pyre', herblore: 'cauldron', construction: 'sawbench', summoning: 'obelisk' }[act];
    R.ent = { kind, skill: act, crafts: STATION_CRAFTS, t: 0, x, stop: 62, hit: 0, swung: false, blocked: false };
  } else {
    const ess = act === 'mining' && S.gsel.mining === -2 && !!ZONES[S.zone].ess;
    if (!ess && chosenTier(act) < 0) S.zone = bestLocFor(act);   // nothing here the hero can gather yet
    const tier = ess ? 0 : Math.max(0, chosenTier(act));
    const yields = randi(3, 6);
    const kind = act === 'woodcutting' ? 'tree' : act === 'mining' ? 'rock' : 'pond';
    const stop = kind === 'pond' ? 135 : kind === 'tree' ? 58 : 62;
    R.ent = { kind, skill: act, tier, ess, yields, maxYields: yields, t: 0, x, stop, hit: 0, swung: false };

}

/* ===== Road events: tap them before they scroll away ===== */
// put the find just past whatever the hero will stop at, but never further than the right edge of the screen
function spawnEvent(ent) {

}
function evScreen(ev) {

}
function collectEvent(ev) {

function startAct() {
  R.atkT = playerSpeed() * 0.35; R.pendingHit = 0;
}

function tick(dt) {
  time += dt;
  homeTick(dt); wbTick(dt);
  if (inWild() && !S.wild.in) { S.wild.in = true; log('☠️ You enter the Revenant Caves. Loot stays in your looting bag until you leave – die here and you lose it, and most of your gear.', 'lg-bad'); }
  else if (!inWild() && S.wild.in) bankWild('You left the caves');
  if (R.phase === 'walk') {
    const w = walkSpeed() * (S.activity === 'agility' ? 1.6 : 1);
    R.worldX += w * dt;
    S.dist += w * dt / 40;
    S.hp = Math.min(maxHp(), S.hp + maxHp() * 0.005 * dt);
    if (!R.ent) spawnEntity();
    if (R.ent.x - R.worldX <= R.ent.stop) {
      R.phase = 'act'; startAct();
      if (R.ent.d && R.ent.d.boss) { showBanner(`👑 BOSS: ${R.ent.d.name}`); sfx('boss'); }
      if (R.ent.d && R.ent.d.pker && !R.ent.d.real) {
        log(`☠️ ${R.ent.d.name} (level ${R.ent.d.lvl}) attacks you!`, 'lg-bad'); showBanner(`☠️ PKer: ${R.ent.d.name} (level ${R.ent.d.lvl})`); sfx('boss');
        if (S.wild.flee && S.ctarget !== 'pvp') tryEscape(`You ran from ${R.ent.d.name}`, R.ent);
      }
    }
  } else if (R.phase === 'act' && !R.ent) R.phase = 'walk';
  else if (R.phase === 'act') {
    const k = R.ent.kind;
    if (k === 'enemy') { if (R.ent.replay) replayTick(dt); else combatTick(dt); } else if (k === 'npc') thieveTick(dt); else if (k === 'patch') farmTick(dt); else if (k === 'obstacle') agiTick(dt); else if (CRAFTING.has(R.ent.skill)) craftTick(dt); else gatherTick(dt);
  } else if (R.phase === 'dead') {
    R.deadT -= dt;
    if (R.deadT <= 0) {
      S.hp = maxHp(); R.phase = 'walk'; R.ent = null;
      // don't let an idle hero die over and over (and bleed gold) in a zone that is too hard
      if (S.activity === 'combat' && S.zone > 0 && (foodCount() === 0 || R.deathStreak >= 3)) {
        S.zone = S.zone < MAIN_ZONES ? S.zone - 1 : bestZone();
        R.deathStreak = 0; S.autoSlayer = false;
        log(`🏃 You retreat to ${ZONES[S.zone].name} to recover.`, 'lg-bad');
      } else log('You get back up and continue on.');
    }
  } else if (R.phase === 'done') {
    R.doneT -= dt;
    if (R.doneT <= 0) { R.ent = null; R.phase = 'walk'; }
  }
  if (R.buff > 0) R.buff -= dt;
  if (R.rested > 0) R.rested -= dt;
  if (S.bonfire && (S.bonfire.left -= dt) <= 0) { S.bonfire = null; log('🔥 Your bonfire has burned out.'); }
  for (const ev of R.events) ev.age += dt;
  R.events = R.events.filter(ev => ev.age < 25 && ev.x - R.worldX + HX > -60);
  if (!SIM) updateVisuals(dt);
}

function combatTick(dt) {
  const e = R.ent;
  R.atkT -= dt; e.atkT -= dt;
  if (R.atkT <= 0) {
    R.atkT += playerSpeed();
    const mode = attackMode();
    // work the hit out before using up ammo, so the last arrow still counts
    const spell = mode === 'magic' ? curSpell() : null;
    R.shot = { mode, maxHit: playerMaxHit(), chance: playerHitChance(e), color: spell ? spell.color : null, weak: !!spell && spell.el === e.d.weak };
    // revenant weapons burn ether for +50% damage and accuracy in the caves
    if (inWild() && weaponItem() && weaponItem().ether && has('ether')) { take('ether'); R.shot.maxHit = Math.floor(R.shot.maxHit * 1.5); R.shot.chance = Math.min(0.97, R.shot.chance * 1.5); }
    if (mode === 'ranged' && !noAmmo()) take(bestArrow());
    if (mode === 'magic') castRunes(spell);
    if (mode === 'unarmed' && !R.ammoWarn) { R.ammoWarn = true; log(`⚠️ Out of ${wtype() === 'ranged' ? 'arrows' : 'runes'} – fighting with fists!`, 'lg-bad'); }
    if (mode !== 'unarmed') R.ammoWarn = false;
    const p = activePrayer();
    if (p) {
      // prayer points drain once every three attacks
      R.prayN = (R.prayN || 0) + 1;
      if (R.prayN % 3) { /* free swing */ } else if (S.pp >= p.cost) S.pp -= p.cost;
      else { S.prayer = null; log('🙏 Out of prayer points – prayer stopped. Bury bones to restore them.', 'lg-bad'); }
    }
    R.swing = 1;
    R.pendingHit = mode === 'ranged' ? 0.28 : mode === 'magic' ? 0.34 : 0.12;
    if (mode === 'ranged' || mode === 'magic') {
      shoot(HX + 18, GY - 48, entScreenX(e), GY - entHeight(e) * 0.55, mode === 'ranged' ? 'arrow' : 'orb', R.shot.color || '#fff', R.pendingHit);
      sfx(mode === 'ranged' ? 'bow' : 'zap');
    }
  }
  // damage lands when the swing or projectile connects, not when it starts
  if (R.pendingHit > 0) { R.pendingHit -= dt; if (R.pendingHit <= 0) playerHit(e, R.shot); }
  if (e.hp <= 0) { killEnemy(e); return; }
  if (e.atkT <= 0) {
    bossMechanics(e);
    e.atkT += e.d.speed * (e.enraged ? 0.7 : 1);
    e.lunge = 1;
    const ranged = etype(e) !== 'melee' && !(e.d.breath && etype(e) === 'magic');
    e.pend = ranged ? 0.3 : 0.1;
    if (ranged) {
      const ex = entScreenX(e), ey = GY - entHeight(e) * 0.6;
      shoot(ex - 10, ey, HX + 6, GY - 44, etype(e) === 'ranged' ? 'arrow' : 'orb', e.d.orb || '#c58bff', e.pend);
    }
  }

    e.food--; const h = Math.round(e.maxHp * 0.3); e.hp = Math.min(e.maxHp, e.hp + h);

  // out of food and nearly dead: try to teleport out before a death costs the gear
  if (inWild() && S.hp > 0 && S.hp < maxHp() * 0.25 && foodCount() === 0 && !e.escapeTried && tryEscape('Low on health', e)) return;
  if (S.hp <= 0) die();
}

function bossMechanics(e) {
  const d = e.d;
  if (d.styles && --e.swap <= 0) {
    e.style = d.styles[(d.styles.indexOf(e.style) + 1) % d.styles.length];
    e.swap = randi(3, 5);
    floatText(entScreenX(e), GY - entHeight(e) - 40, `${TYPE_ICON[e.style]} ${TYPE_NAME[e.style]}!`, '#ffe27a', 1.3, 1.1);
  }
  if (d.enrage && !e.enraged && e.hp < e.maxHp * 0.3) {
    e.enraged = true;
    floatText(entScreenX(e), GY - entHeight(e) - 60, '😡 Enraged!', '#ff7a5a', 1.6, 1.2);
    log(`😡 ${d.name} is enraged and attacks faster!`, 'lg-bad');
  }
  // the hero swaps to the matching protection prayer when it knows it, like flicking prayers in OSRS
  const p = activePrayer();
  if (p && p.protect && p.protect !== etype(e)) {
    const want = PRAYERS.find(x => x.protect === etype(e));
    if (want && LV.prayer >= want.lvl) S.prayer = want.id;
  }
}

function enemyHit(e) {
  if (Math.random() >= enemyHitChance(e)) { hitsplat(HX, GY - 42, 0, 'miss', true); return; }
  const tri = triangle(e);
  const raw = 1 + Math.floor(Math.random() * e.d.maxHit);
  let mult = (1 - damageReduction()) * (tri > 0 ? 0.85 : tri < 0 ? 1.15 : 1) * (pray('protect') === etype(e) ? 0.5 : 1);
  if (etype(e) === 'magic') mult *= 1 - potB('ward');
  if (inWild() && e.d.ghost && S.equip.hands === 'bracelet' && has('ether')) { take('ether'); mult *= 0.5; }
  const dmg = Math.max(1, Math.round(raw * mult));
  S.hp -= dmg;
  addXp('defence', dmg * 0.5);
  hitsplat(HX, GY - 42, dmg, 'hit', true);
  burst(HX + 4, GY - 40, '#c22', 5);
  R.heroHit = 1; sfx('hurt');
  R.shake = Math.max(R.shake, e.d.boss ? 8 : 3);
}

function combatXp(dmg) {
  const xp = dmg * 4;
  switch (styleOf()) {
    case 'strength': addXp('strength', xp); break;
    case 'defence': addXp('defence', xp); break;
    case 'accurate': case 'rapid': addXp('ranged', xp); break;
    case 'longrange': addXp('ranged', xp / 2); addXp('defence', xp / 2); break;
    case 'standard': addXp('magic', xp); break;
    case 'defensive': addXp('magic', xp / 2); addXp('defence', xp / 2); break;
    default: addXp('attack', xp);
  }
  addXp('hitpoints', dmg * 1.33);
}

function playerHit(e, shot) {
  const ex = entScreenX(e), ey = GY - entHeight(e) * (e.d.shape === 'flyer' ? 0.7 : 0.5);
  if (Math.random() >= shot.chance) { hitsplat(ex, ey, 0, 'miss'); return; }
  const roll = 1 + Math.floor(Math.random() * shot.maxHit);
  const crit = roll >= Math.max(3, shot.maxHit * 0.9);
  const tri = triangle(e);
  const mult = (tri > 0 ? 1.2 : tri < 0 ? 0.85 : 1) * (onTask(e) ? 1 + amu('slay') : 1) * (shot.weak ? WEAK_BONUS : 1) * (1 - (e.d.dr || 0));
  const dmg = Math.min(e.hp, Math.max(1, Math.round(roll * mult)));
  e.hp -= dmg; e.hit = 1;
  if (e.d.world && !SIM) WB.pend += dmg;
  combatXp(dmg);

function burnChance(t) { return Math.max(0, 0.35 - (LV.cooking - GATHER_REQ[t]) * 0.02) * (1 - mLv('cooking', 'fish' + t) / 99) * (room('kitchen') >= 2 ? 0.75 : 1); }

}
function cookOnce(t) {

function stealChance(n) { return clamp((100 + 40 + LV.thieving * 1.5) / (100 + n.perception) + mLv('thieving', n.id) * 0.001 + famB('steal'), 0.1, 0.97); }

/* ===== Mastery (Melvor): every tree, ore, fish, recipe and target levels up on its own ===== */
const MASTERY_SKILLS = ['woodcutting', 'mining', 'fishing', 'thieving', 'smithing', 'cooking', 'fletching', 'runecrafting', 'firemaking'];
const POOL_STEPS = [[0.1, '+5% skill XP'], [0.25, '5% faster actions'], [0.5, '+5% chance to double (or save materials)'], [0.95, '+25% Mastery XP and another +5% skill XP']];
function masteryItems(skill) {
  const t5 = f => [0, 1, 2, 3, 4].map(f);

  if (skill === 'cooking') return t5(t => ({ key: 'fish' + t, item: 'cooked' + t, req: GATHER_REQ[t] }));
  if (skill === 'firemaking') return t5(t => ({ key: 'log' + t, item: 'log' + t, req: GATHER_REQ[t] }));
  if (skill === 'thieving') return Object.values(NPCS).map(n => ({ key: n.id, name: n.name, icon: '🥷', req: n.lvl }));

}
function mState(skill) { return S.mastery[skill] || (S.mastery[skill] = { xp: {}, pool: 0 }); }
function mXp(skill, key) { return (S.mastery[skill] && S.mastery[skill].xp[key]) || 0; }

function mLv(skill, key) { return levelFromXp(mXp(skill, key) * 10); }

function craftTick(dt) {
  const e = R.ent, skill = e.skill, cooking = skill === 'cooking', fm = skill === 'firemaking';
  const r = cooking || fm ? null : CRAFT[skill].recipes[S.csel[skill]];
  const can = cooking ? cookTarget() >= 0 : fm ? fmTarget() >= 0 : canCraft(skill, S.csel[skill]);
  e.reason = r && LV[skill] < r.req ? `Needs ${SKILLS[skill].name} ${r.req}` : fm ? 'No logs' : 'No materials';
  if (!can && !e.blocked) log(cooking ? '⚠️ No fish left to cook.' : fm ? '⚠️ No logs left to burn.' : `⚠️ Out of materials for ${SKILLS[skill].name}.`, 'lg-bad');
  e.blocked = !can;
  if (!can) {
    // don't idle at an empty station all night: go back to what the hero was doing before
    e.blockT = (e.blockT || 0) + dt;
    if (e.blockT > 3) {
      if (queueBlocked()) return;
      const back = S.prevAct || 'combat';
      log(`↩️ Nothing left for ${SKILLS[skill].name} – back to ${back}.`);
      if (S.prevZone !== undefined && locOpen(S.prevZone)) S.zone = S.prevZone;
      setActivity(back);
    }
    return;
  }
  const need = stationTime(e), ex = entScreenX(e);
  e.t += dt;
  if (!cooking && !fm && !e.swung && e.t >= need / 2) { e.swung = true; R.swing = 1; e.hit = 0.6; burst(ex - 6, GY - 46, CRAFT[skill].spark, 4); }
  if (e.t >= need) {
    e.t -= need; e.swung = false; e.hit = 1;
    if (fm) {
      const t = fmTarget(); burnOnce(t);
      burst(ex, GY - 30, '#ffb347', 10);
      floatText(ex, GY - 100, `🔥 ${LOG_N[t]}`, '#ffd27a');
    } else if (cooking) {
      const res = cookOnce(cookTarget()); rollSkillPet('cooking');
      burst(ex, GY - 40, res === 'burnt' ? '#444444' : '#ffb347', 6);
      floatText(ex, GY - 100, res === 'burnt' ? 'Burnt!' : '+1 🍽️', res === 'burnt' ? '#ff8a5a' : '#ffffff');
    } else {
      R.swing = 1;
      const [out, n] = craftOnce(skill, S.csel[skill]); rollSkillPet(skill);
      burst(ex - 6, GY - 46, CRAFT[skill].spark, 8); sfx(skill === 'runecrafting' ? 'magic' : 'clink');
      floatText(ex, GY - 100, `+${n} ${ITEMS[out].icon}`, '#ffffff');
    }
    if (--e.crafts <= 0) { R.phase = 'done'; R.doneT = 0.6; e.dying = true; }
  }
}

function reqSkill(it) {

}

  if (!take(id)) return;

  S.equip[it.slot] = id;
  // a 2h sword needs both hands, and a shield pushes the 2h out

function isUpgrade(id) {

  if (!cur) return it.slot !== 'amulet' && it.slot !== 'ring' && (it.slot !== 'weapon' || it.wtype === 'melee');
  const c = ITEMS[cur];
  if (it.slot === 'weapon') return c.wtype === it.wtype && weaponDps(c) < weaponDps(it);

const PATCH_N = [null, { allot: 2, herb: 2, tree: 0 }, { allot: 3, herb: 3, tree: 1 }, { allot: 4, herb: 4, tree: 2 }];
const PATCH_NAME = { allot: 'Allotment', herb: 'Herb patch', tree: 'Tree patch' };
function patchKeys() {
  const n = PATCH_N[room('garden')], out = [];

}
function patch(k) { return S.home.p[k] || (S.home.p[k] = { s: null, t: 0 }); }
const patchKind = k => k.replace(/\d+$/, '');
function growTime(sd) { return sd.time * (room('shed') >= 3 ? 0.85 : 1); }
function growFrac(p) { return p.s ? clamp((S.home.ft - p.t) / growTime(SEED_BY[p.s]), 0, 1) : 0; }

function bestSeed(kind) {
  const sel = S.home.sel[kind], ok = id => has(id) && SEED_BY[id] && SEED_BY[id].kind === kind && LV.farming >= SEED_BY[id].lvl;
  if (sel && ok(sel)) return sel;
  const list = SEEDS.filter(s => ok(s.id));
  return list.length ? list[list.length - 1].id : null;
}
function plant(k, id) {
  const sd = SEED_BY[id];
  if (!sd || sd.kind !== patchKind(k) || LV.farming < sd.lvl || patch(k).s || !take(id)) return false;
  Object.assign(patch(k), { s: id, t: S.home.ft });
  addXp('farming', sd.px); S.stats.planted++;
 
  return true;
}
function harvest(k) {
  const p = patch(k), sd = SEED_BY[p.s];
  if (!sd || growFrac(p) < 1) return null;
  const n = randi(sd.n[0], sd.n[1]) + Math.floor(LV.farming / 25) + (room('shed') >= 2 ? 1 : 0);
  give(sd.out, n);
  addXp('farming', sd.kind === 'tree' ? sd.check : sd.hx * n);
  if (Math.random() < 0.15) give(sd.id);

}
// which patch the hero walks to next: ready ones, then empty ones with seeds, then tend the growing ones
function farmTarget() {

  let k = ks.find(k => patch(k).s && growFrac(patch(k)) >= 1) || ks.find(k => !patch(k).s && bestSeed(patchKind(k)));
  if (!k) { const g = ks.filter(k => patch(k).s); if (g.length) k = g[(R.farmI = (R.farmI || 0) + 1) % g.length]; }
  return k || null;
}
function farmTick(dt) {
  const e = R.ent;
  if (!e.pk) {
    if (!e.blocked) log('⚠️ No patches to work: build a 🌱 Garden at home and get seeds.', 'lg-bad');
    e.blocked = true; e.reason = 'No patches';

  if (e.t < need) return;
  e.t -= need; e.swung = false; R.swing = 1; e.hit = 1;

function taskPool(k) {

  const bz = bestZone(), en = ZONES[bz].enemies.filter(id => !ENEMIES[id].boss);
  opts.push({ t: 'kill', id: en[randi(0, en.length - 1)], n: 40 * k });

  if (isOpen('fletching')) opts.push({ t: 'fletch', n: 30 * k });
  if (isOpen('firemaking')) opts.push({ t: 'burn', n: 60 * k });
  if (room('garden')) opts.push({ t: 'harvest', n: 30 * k });

  const D = S.daily, x = (kind === 'w' ? D.wtasks : D.tasks)[k];

}
function claimLogin() {
  const D = S.daily;

  const g = Math.min(7, D.streak) * (50 + totalLevel());

  if (D.streak % 7 === 0) { give('clue_hard'); give('lamp', 2); }
  log(`🔥 Login streak day ${D.streak}: +${fmt(g)} gold${D.streak % 7 === 0 ? ', a hard clue and 2 XP Lamps' : ''}`, 'lg-gold');
  showBanner(`🔥 Day ${D.streak} streak: +${fmt(g)} gold`); sfx('chest');
}
function htmlDaily() {
  dailyCheck();

    const pr = dTaskProg(x), done = pr >= x.o.n;
    return `<div class="item quest ${done && !x.c ? 'ready' : ''}"><div class="top"><span class="ic">${x.c ? '✅' : done ? '🎁' : '📅'}</span><span class="nm"><b>${objText(x.o)}</b><br>

/* ================= OFFLINE ================= */

function snapshot() {
  return { skills: { ...S.skills }, lv: { ...LV }, inv: { ...S.inv }, gold: S.gold, kills: S.kills, deaths: S.deaths, bosses: [...S.bosses], ach: { ...S.ach } };
}
function simulate(sec) {
  sec = Math.min(sec, offlineCap());
  SIM = true;
  const step = 0.2;
  for (let t = 0; t < sec; t += step) tick(step);
  SIM = false;
  floaters = []; particles = []; coins = []; projs = [];
  checkAch();
  R.shake = R.freeze = R.ring = 0; R.banner = null; R.events = [];
  return sec;
}
function showOfflineSummary(sec, before) {
  const lines = [];
  for (const k in SKILLS) {
    const d = S.skills[k] - before.skills[k];
    if (d >= 1) lines.push(`${SKILLS[k].icon} ${SKILLS[k].name}: +${fmt(d)} XP` + (LV[k] > before.lv[k] ? ` <b>(${before.lv[k]} → ${LV[k]})</b>` : ''));
  }
  const ids = new Set([...Object.keys(S.inv), ...Object.keys(before.inv)]);
  for (const id of ids) {
    const d = (S.inv[id] || 0) - (before.inv[id] || 0);
    if (d) lines.push(`${ITEMS[id].icon} ${ITEMS[id].name}: <span class="${d > 0 ? 'have' : 'need'}">${d > 0 ? '+' : ''}${d}</span>`);
  }
  if (S.gold !== before.gold) lines.push(`🪙 Gold: ${S.gold > before.gold ? '+' : '−'}${fmt(Math.abs(S.gold - before.gold))}`);
  if (S.deaths !== before.deaths) lines.push(`💀 Deaths: ${S.deaths - before.deaths}`);
  S.bosses.forEach((b, i) => { if (b && !before.bosses[i]) lines.push(`👑 Defeated ${ENEMIES[ZONES[i].boss].name}!`); });
  for (const a of ACH) if (S.ach[a.id] && !before.ach[a.id]) lines.push(`🏆 Achievement: ${a.name}`);
  if (S.kills !== before.kills) lines.push(`⚔️ Enemies defeated: ${S.kills - before.kills}`);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60);
  openModal(`<h2>Welcome back!</h2>
    <p class="muted">While you were away (${h ? h + 'h ' : ''}${m}m), your hero kept travelling:</p>
    ${R.rested > 0 ? `<p>😴 Well rested: <b>+50% XP</b> for the next ${Math.ceil(R.rested / 60)} minutes.</p>` : ''}
    <ul>${lines.map(l => `<li>${l}</li>`).join('') || '<li>Nothing much happened.</li>'}</ul>
    <button data-a="close">Continue</button>`);
}
function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;

}

/* ================= SOUND (synthesized, no files) ================= */
let actx = null;
const sfxLast = {};
function unlockAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
}
function tone(freq, dur, type = 'square', vol = 0.12, slide = 0, delay = 0) {
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfx(kind) {
  if (SIM || S.muted || !actx || actx.state !== 'running') return;
  const now = performance.now();
  if (now - (sfxLast[kind] || 0) < 60) return;
  sfxLast[kind] = now;
  switch (kind) {
    case 'hit': tone(190, 0.08, 'square', 0.07, 0.4); break;
    case 'crit': tone(420, 0.12, 'sawtooth', 0.08, 0.3); tone(160, 0.12, 'square', 0.06, 0.5, 0.02); break;
    case 'hurt': tone(130, 0.14, 'sawtooth', 0.07, 0.5); break;
    case 'coin': tone(988, 0.07, 'square', 0.05); tone(1319, 0.1, 'square', 0.05, 0, 0.07); break;
    case 'gather': tone(330, 0.05, 'triangle', 0.08, 0.6); break;
    case 'clink': tone(1400, 0.08, 'triangle', 0.07); tone(2100, 0.06, 'triangle', 0.04, 0, 0.02); break;
    case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'triangle', 0.09, 0, i * 0.08)); break;
    case 'chest': [784, 988, 1319].forEach((f, i) => tone(f, 0.1, 'square', 0.05, 0, i * 0.06)); break;
    case 'magic': [660, 880, 1175, 1568].forEach((f, i) => tone(f, 0.2, 'sine', 0.07, 0, i * 0.05)); break;
    case 'boss': tone(98, 0.6, 'sawtooth', 0.09, 0.7); tone(147, 0.6, 'sawtooth', 0.05, 0.7, 0.05); break;
    case 'bow': tone(520, 0.07, 'triangle', 0.06, 0.4); break;
    case 'zap': tone(880, 0.18, 'sine', 0.06, 0.3); tone(1320, 0.12, 'sine', 0.03, 0.5, 0.03); break;
  }
}

/* ================= RENDERING ================= */

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  // phones get a narrower, zoomed-in view so the hero and text stay readable
  const narrow = window.innerWidth < 700;
  W = narrow ? 560 : 960; HX = narrow ? 140 : 230; FS = narrow ? 1.55 : 1;
  document.getElementById('view').style.aspectRatio = `${W} / ${H}`;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (typeof G3 !== 'undefined' && G3.ok) G3.resize();
}

const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => clamp(Math.round(c + amt * 255), 0, 255);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function rr(x, y, w, h, r, c) {
  ctx.fillStyle = c; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  ctx.fill();
}
function circle(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
function ellipse(x, y, rx, ry, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); ctx.fill(); }
function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
function limb(px, py, w, h, a, c) { ctx.save(); ctx.translate(px, py); ctx.rotate(a); rr(-w / 2, 0, w, h, w / 2, c); ctx.restore(); }

function entScreenX(e) { return e.x - R.worldX + HX; }
function entHeight(e) {
  const d = e.d;
  if (!d) return 100;
  return { blob: 50, quad: 50, flyer: 110, humanoid: 80, dragon: 170 }[d.shape] * (d.shape === 'dragon' ? 1 : d.size);
}

function ridge(f, color, base, amp, freq, seed, peaky) {
  const off = R.worldX * f;
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W + 8; x += 8) {
    const wx = x + off;
    let n = Math.sin(wx * freq + seed) * 0.6 + Math.sin(wx * freq * 2.3 + seed * 2) * 0.3 + Math.sin(wx * freq * 5.1 + seed * 3) * 0.1;
    if (peaky) n = 1 - Math.abs(n) * 2;
    ctx.lineTo(x, base - amp * (0.5 + 0.5 * n));
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

function drawBackground(z) {
  const th = z.home ? Object.assign({}, z.th, { decor: 'house' }) : z.th;
  const g = ctx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  if (th.sun) {
    const sx = W - 170;
    const sg = ctx.createRadialGradient(sx, 70, 5, sx, 70, 90);
    sg.addColorStop(0, th.sun); sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(sx - 100, 0, 200, 170);
    circle(sx, 70, 26, th.sun);
  }
  if (th.cave) {
    // distant crystals
    for (let i = 0; i < 14; i++) {
      const x = ((hash(i) * 1400 - R.worldX * 0.05) % 1400 + 1400) % 1400 - 200;
      circle(x, 60 + hash(i + 50) * 120, 2 + hash(i + 9) * 2, `rgba(180,140,255,${0.25 + 0.25 * Math.sin(time * 2 + i)})`);
    }
  }
  ridge(0.08, th.far, GY - 110, 110, 0.0035, 1.7, th.snow);
  if (th.snow) {
    ctx.save(); ctx.globalAlpha = 0.7; ridge(0.08, '#ffffff', GY - 165, 50, 0.0035, 1.7, true); ctx.restore();
  }
  ridge(0.22, th.mid, GY - 40, 70, 0.006, 4.2, false);

  // near decorations
  const f = 0.55, off = R.worldX * f, sp = 95;
  const start = Math.floor(off / sp) - 2;
  for (let i = start; i < start + W / sp + 4; i++) {
    const r = hash(i);
    if (r < 0.4) continue;
    const x = i * sp - off + r * 50, s = 0.6 + hash(i + 7) * 0.7, c = th.near;
    const by = GY + 4;
    if (th.decor === 'tree') { rr(x - 4 * s, by - 50 * s, 8 * s, 50 * s, 2, c); circle(x, by - 60 * s, 24 * s, c); circle(x - 14 * s, by - 48 * s, 16 * s, c); circle(x + 14 * s, by - 50 * s, 16 * s, c); }
    else if (th.decor === 'pine') { for (let k = 0; k < 3; k++) poly([x - (26 - k * 6) * s, by - (20 + k * 26) * s, x + (26 - k * 6) * s, by - (20 + k * 26) * s, x, by - (60 + k * 28) * s], c); rr(x - 4 * s, by - 22 * s, 8 * s, 22 * s, 1, c); }
    else if (th.decor === 'stalag' || th.decor === 'wild') poly([x - 16 * s, by, x + 16 * s, by, x + 2 * s, by - 70 * s], c);
    else if (th.decor === 'rock') { poly([x - 34 * s, by, x - 20 * s, by - 30 * s, x + 6 * s, by - 42 * s, x + 30 * s, by - 18 * s, x + 36 * s, by], c); poly([x - 8 * s, by - 36 * s, x + 6 * s, by - 42 * s, x + 20 * s, by - 29 * s], '#f4f8fc'); }
    else if (th.decor === 'house') {
      rr(x - 18 * s, by - 30 * s, 36 * s, 30 * s, 2, shade(c, 0.12));
      poly([x - 24 * s, by - 28 * s, x, by - 50 * s, x + 24 * s, by - 28 * s], ['#b5533c', '#8a4a32', '#6f7a3a'][i & 1 ? 1 : (i % 3 === 0 ? 2 : 0)]);
      rr(x - 5 * s, by - 16 * s, 10 * s, 16 * s, 1, shade(c, -0.15));
      rr(x + 8 * s, by - 24 * s, 6 * s, 6 * s, 1, '#ffe8a0');
    }
    else if (th.decor === 'dead') {
      rr(x - 3 * s, by - 70 * s, 6 * s, 70 * s, 2, c);
      ctx.strokeStyle = c; ctx.lineWidth = 3 * s;
      ctx.beginPath(); ctx.moveTo(x, by - 50 * s); ctx.lineTo(x - 22 * s, by - 72 * s); ctx.moveTo(x, by - 60 * s); ctx.lineTo(x + 18 * s, by - 84 * s); ctx.lineTo(x + 26 * s, by - 80 * s); ctx.stroke();
    }
    else if (th.decor === 'crystal') {
      poly([x - 10 * s, by, x - 2 * s, by - 60 * s, x + 6 * s, by], c);
      poly([x + 2 * s, by, x + 12 * s, by - 38 * s, x + 18 * s, by], shade(c, 0.08));
      ctx.save(); ctx.globalAlpha = 0.5 + 0.3 * Math.sin(time * 2 + i); poly([x - 6 * s, by - 10 * s, x - 2 * s, by - 52 * s, x + 1 * s, by - 10 * s], '#7fe0f0'); ctx.restore();
    }
    else if (th.decor === 'spike') { poly([x - 12 * s, by, x + 12 * s, by, x - 4 * s, by - 80 * s], c); poly([x + 6 * s, by, x + 24 * s, by, x + 18 * s, by - 45 * s], c); }
  }

  if (th.cave) {
    // ceiling with stalactites
    ctx.fillStyle = th.near; ctx.beginPath(); ctx.moveTo(0, 0);
    const o2 = R.worldX * 0.7;
    for (let x = 0; x <= W + 10; x += 10) {
      const wx = x + o2, k = Math.floor(wx / 30);
      const spike = hash(k) > 0.6 ? (1 - Math.abs((wx % 30) / 15 - 1)) * 50 * hash(k + 3) : 0;
      ctx.lineTo(x, 22 + Math.sin(wx * 0.01) * 8 + spike);
    }
    ctx.lineTo(W, 0); ctx.closePath(); ctx.fill();
  }

  // ground
  ctx.fillStyle = th.ground; ctx.fillRect(0, GY, W, H - GY);
  ctx.fillStyle = th.dirt; ctx.fillRect(0, GY + 14, W, H - GY - 14);
  const go = R.worldX;
  for (let i = Math.floor(go / 36) - 1; i < Math.floor(go / 36) + W / 36 + 2; i++) {
    const x = i * 36 - go;
    ctx.fillStyle = shade(th.dirt.length === 7 ? th.dirt : '#333333', -0.06);
    ctx.fillRect(x + hash(i) * 20, GY + 24 + hash(i + 1) * 30, 6 + hash(i + 2) * 8, 3);
    if (!th.cave && !th.lava && hash(i + 5) > 0.5) {
      ctx.fillStyle = th.snow ? '#ffffff' : shade(th.ground, 0.08);
      poly([x, GY + 2, x + 4, GY - 6, x + 8, GY + 2], ctx.fillStyle);
    }
    if (th.lava && hash(i + 3) > 0.7) {
      ctx.fillStyle = `rgba(255,${120 + 60 * Math.sin(time * 3 + i)},40,0.8)`;
      ctx.fillRect(x, GY + 16 + hash(i + 4) * 30, 14 + hash(i) * 14, 3);
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fillRect(0, GY + 12, W, 3);

  drawWeather(th);
}

function drawWeather(th) {
  if (th.snow) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (let i = 0; i < 50; i++) {
      const x = ((hash(i) * W - time * 30 - R.worldX * 0.3) % W + W) % W;
      const y = ((hash(i + 99) * H + time * (25 + hash(i) * 25)) % H);
      ctx.fillRect(x, y, 2, 2);
    }
  }
  if (th.lava) {
    for (let i = 0; i < 25; i++) {
      const y = H - ((hash(i + 5) * H + time * (30 + hash(i) * 30)) % H);
      const x = ((hash(i) * W - R.worldX * 0.4) % W + W) % W + Math.sin(time + i) * 10;
      circle(x, y, 1.5, `rgba(255,170,60,${y / H})`);
    }
  }
}

/* --- hero --- */
function heroTool() {
  const a = S.activity;
  if (a === 'combat') {
    const w = S.equip.weapon ? ITEMS[S.equip.weapon] : null;
    const blade = w ? w.color || TIER_COLORS[w.tier] || '#c0c4cc' : '#8a6a4a';
    if (wtype() === 'ranged') return () => drawBow(w && w.tier !== undefined ? TIER_COLORS[w.tier] : '#8a6a4a', R.swing < 0.5);
    if (wtype() === 'magic') { const sp = curSpell(); return () => drawStaff(sp ? sp.color : '#888'); }
    if (!w) return null;
    const kind = w.kind || 'sword';
    // blade length and shape follow the weapon type
    const len = { dagger: 16, sword: 28, scimitar: 28, '2h': 44 }[kind] || 30, wide = kind === '2h' ? 3.6 : 2.5;
    return () => {
      rr(-1.5, 15, 3, kind === '2h' ? 12 : 8, 1, '#5a3a22');
      rr(-6, 22 + (kind === '2h' ? 4 : 0), 12, 3, 1, '#c9a43a');
      const y0 = 25 + (kind === '2h' ? 4 : 0);
      ctx.fillStyle = blade; ctx.beginPath(); ctx.moveTo(-wide, y0); ctx.lineTo(wide, y0);
      if (kind === 'scimitar') { ctx.quadraticCurveTo(wide + 8, y0 + len * 0.6, 1, y0 + len + 4); ctx.lineTo(-wide, y0 + len * 0.7); }
      else { ctx.lineTo(wide * 0.8, y0 + len); ctx.lineTo(0, y0 + len + 5); ctx.lineTo(-wide * 0.8, y0 + len); }
      ctx.closePath(); ctx.fill();
    };
  }
  if (a === 'smithing') return () => { rr(-1.5, 12, 3, 24, 1, '#7a4e2a'); rr(-7, 33, 14, 9, 2, '#5b5f68'); };
  if (a === 'thieving') return null;
  if (a === 'firemaking') return () => { rr(-4, 16, 8, 6, 1, '#7a6a5a'); };
  if (a === 'fletching') return () => { rr(-1.5, 14, 3, 8, 1, '#5a3a22'); poly([-2, 22, 2, 22, 0, 36], '#cfd4dc'); };
  if (a === 'runecrafting') return () => {
    const g = ctx.createRadialGradient(0, 24, 1, 0, 24, 14);
    g.addColorStop(0, 'rgba(210,160,255,0.9)'); g.addColorStop(1, 'rgba(210,160,255,0)');
    ctx.fillStyle = g; ctx.fillRect(-14, 10, 28, 28);
  };
  if (a === 'cooking') return () => {
    ctx.strokeStyle = '#7a4e2a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, 56); ctx.stroke();
  };
  const tc = TIER_COLORS[Math.min(4, S.tools[TOOL_OF[a]])];
  if (a === 'woodcutting') return () => { rr(-1.5, 12, 3, 30, 1, '#7a4e2a'); poly([1, 34, 12, 28, 13, 44, 1, 41], tc); };
  if (a === 'mining') return () => {
    rr(-1.5, 12, 3, 30, 1, '#7a4e2a');
    ctx.strokeStyle = tc; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 52, 16, -Math.PI * 0.85, -Math.PI * 0.15); ctx.stroke();
  };
  return () => { ctx.strokeStyle = '#7a4e2a'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(0, 80); ctx.stroke(); };
}

// bow drawn in arm space (the arm points along +y)
function drawBow(color, drawn) {
  ctx.strokeStyle = shade(color.length === 7 ? color : '#8a6a4a', -0.15); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 14, 18, Math.PI * 0.12, Math.PI * 0.88); ctx.stroke();
  const ex = Math.cos(Math.PI * 0.12) * 18, ey = 14 + Math.sin(Math.PI * 0.12) * 18;
  ctx.strokeStyle = 'rgba(240,240,240,0.8)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(0, drawn ? 10 : ey); ctx.lineTo(-ex, ey); ctx.stroke();

function heroArmAngle() {
  if (R.phase === 'walk') return Math.sin(time * 13) * 0.6;
  if (R.phase === 'dead') return 0.3;
  if (S.activity === 'fishing') return -2.05 - R.swing * 0.4;
  if (S.activity === 'cooking') return -1.35 + Math.sin(time * 2) * 0.08;
  if (S.activity === 'runecrafting') return -2.3 + Math.sin(time * 3) * 0.1 - R.swing * 0.3;
  if (S.activity === 'thieving') return R.ent && R.ent.stun > 0 ? 0.4 : -1.25 - R.swing * 0.35;
  if (S.activity === 'firemaking') return -0.9 - R.swing * 0.5;
  if (S.activity === 'combat' && wtype() !== 'melee') return -1.5 - R.swing * 0.25;
  return -0.6 - 1.9 * R.swing;
}

function drawHero() {
  const gear = sl => S.equip[sl] ? ITEMS[S.equip[sl]] : null;
  const bodyIt = gear('body'), helm = gear('helm'), legs = gear('legs'), shield = gear('shield');
  const body = bodyIt ? bodyIt.color || '#9aa0a8' : '#3f6fb5';
  const armor = helm;
  const walking = R.phase === 'walk';
  const bob = walking ? Math.abs(Math.sin(time * 13)) * -2 : 0;
  const dead = R.phase === 'dead';
  ellipse(HX, GY + 2, 18, 4, 'rgba(0,0,0,0.25)');
  drawHumanoid({
    x: (dead ? HX - 30 : HX) - R.heroHit * 5, y: GY + bob - (dead ? 6 : 0) - (R.phase === 'act' && R.ent && R.ent.kind === 'obstacle' ? R.heroLift || 0 : 0), s: 1, face: 1,
    rot: dead ? -Math.PI / 2 : 0,

    shield: shield && S.activity === 'combat' ? shield.color : null,
    headExtra: () => {
      if (armor) {
        const hc = shade(helm.color, -0.05);
        ctx.fillStyle = hc; ctx.beginPath(); ctx.arc(0, -61, 11, Math.PI, 0); ctx.fill(); ctx.fillRect(-11, -62, 22, 3);
        if (helm.kind === 'fullhelm') { ctx.fillRect(-11, -62, 6, 12); ctx.fillStyle = '#111'; ctx.fillRect(3, -61, 7, 2); }
      }
      else { ctx.fillStyle = '#6b3e1f'; ctx.beginPath(); ctx.arc(-1, -62, 10.5, Math.PI * 1.05, Math.PI * 1.95); ctx.fill(); }
    },
    tool: heroTool(),
  });
  drawHeroExtras();
  if (S.activity === 'fishing' && R.phase === 'act' && R.ent && R.ent.kind === 'pond') {
    const a = heroArmAngle();
    const sx = HX + 5, sy = GY - 46;
    const tx = sx - Math.sin(a) * 80, ty = sy + Math.cos(a) * 80;
    const bx = entScreenX(R.ent) - 12 + Math.sin(time * 2) * 3, by = GY + 6 + Math.sin(time * 4) * 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo((tx + bx) / 2, ty + 10, bx, by); ctx.stroke();
    circle(bx, by, 3, '#e84a4a'); ctx.fillStyle = '#fff'; ctx.fillRect(bx - 3, by - 1, 6, 1);
  }
}
function drawHeroExtras() {
  const walking = R.phase === 'walk', dead = R.phase === 'dead';
  if (S.pet && !dead) {

/* --- enemies --- */
function drawEnemy(e) {
  const d = e.d, s = d.size;
  let x = entScreenX(e) + e.lunge * (d.type === 'melee' ? -18 : -5);
  const dying = e.dying ? clamp(R.doneT / 0.6, 0, 1) : 1;
  ctx.save();
  ctx.globalAlpha = dying * (d.ghost ? 0.7 : 1);
  if (e.hit > 0.5) ctx.filter = 'brightness(2.2)';
  if (d.shape !== 'flyer') ellipse(x, GY + 2, 26 * s * (d.shape === 'dragon' ? 3 : 1), 5, 'rgba(0,0,0,0.25)');
  if (d.shape === 'blob') {
    const q = 1 + 0.08 * Math.sin(time * 5);
    const w = 26 * q, h = 22 / q;
    ctx.save(); ctx.translate(x, GY); ctx.scale(s, s);
    ellipse(0, -h, w, h, d.color);
    ellipse(-6, -h - 8, 8, 4, 'rgba(255,255,255,0.35)');
    circle(-9, -h - 2, 5, '#fff'); circle(4, -h - 2, 5, '#fff');
    circle(-11, -h - 1, 2.4, '#111'); circle(2, -h - 1, 2.4, '#111');
    if (d.boss) poly([-10, -2 * h + 3, -10, -2 * h - 9, -5, -2 * h - 3, 0, -2 * h - 12, 5, -2 * h - 3, 10, -2 * h - 9, 10, -2 * h + 3], '#f2c94c');
    ctx.restore();
  } else if (d.shape === 'quad') {
    const c = d.color, dk = shade(c, -0.15), br = Math.sin(time * 4) * 1;
    const low = e.id === 'lizard' ? 0.6 : 1;
    ctx.save(); ctx.translate(x, GY); ctx.scale(s, s);

    ctx.beginPath(); ctx.moveTo(26, -20 * low); ctx.quadraticCurveTo(48, -30 * low + Math.sin(time * 6) * 5, 60, -12); ctx.stroke();
    for (const lx of [-18, -8, 10, 20]) rr(lx - 3, -16 * low, 6, 16 * low, 2, lx < 0 ? c : dk);
    ellipse(0, -22 * low + br, 30, 13 * low, c);
    if (e.id === 'lizard') for (let k = 0; k < 5; k++) poly([-16 + k * 8, -32 * low, -12 + k * 8, -40 * low, -8 + k * 8, -32 * low], '#ffb04a');
    circle(-32, -28 * low + br, 11, c);
    ellipse(-42, -24 * low + br, 9, 6, c);
    if (e.id !== 'lizard') poly([-34, -36 * low, -28, -46 * low, -24, -34 * low], dk);
    circle(-36, -30 * low + br, 2.2, e.id === 'wolf' ? '#ffd24a' : '#111');
    circle(-50, -25 * low + br, 2, '#222');

  } else if (d.shape === 'flyer') {
    const cy = GY - 75 + Math.sin(time * 4) * 8, fl = Math.sin(time * 16);
    poly([x - 6, cy, x - 40, cy - 16 - fl * 14, x - 30, cy + 4, x - 20, cy - 2, x - 12, cy + 8], shade(d.color, -0.1));
    poly([x + 6, cy, x + 40, cy - 16 - fl * 14, x + 30, cy + 4, x + 20, cy - 2, x + 12, cy + 8], shade(d.color, -0.1));
    ellipse(x, cy, 12, 14, d.color);
    poly([x - 9, cy - 9, x - 6, cy - 22, x - 2, cy - 11], d.color);
    poly([x + 9, cy - 9, x + 6, cy - 22, x + 2, cy - 11], d.color);
    circle(x - 4, cy - 3, 2.2, '#ff3b3b'); circle(x + 4, cy - 3, 2.2, '#ff3b3b');
    if (d.orb) { const g = ctx.createRadialGradient(x, cy, 2, x, cy, 30); g.addColorStop(0, d.orb + '88'); g.addColorStop(1, d.orb + '00'); ctx.fillStyle = g; ctx.fillRect(x - 30, cy - 30, 60, 60); }
  } else if (d.shape === 'humanoid') {

    drawHumanoid({
      x, y: GY, s, face: -1, walk: 0, arm: d.type === 'melee' ? -0.5 - 1.6 * e.lunge : -1.5 - 0.25 * e.lunge,
      body: d.body, leg: sk ? '#d8d3c0' : shade(d.body, -0.2), skin: d.color, ribs: sk,
      eye: sk ? '#111' : e.id === 'orc' ? '#ffdd33' : '#331',
      headExtra: () => {
        if (d.boss) poly([-9, -67, -9, -77, -4, -71, 0, -79, 4, -71, 9, -77, 9, -67], '#f2c94c');
        if (gob) { poly([-8, -62, -18, -70, -6, -56], d.color); poly([6, -62, 16, -70, 4, -56], d.color); }
        if (e.id === 'orc') { ctx.fillStyle = '#fff'; ctx.fillRect(4, -53, 2, 4); }
        if (e.id === 'troll' || e.id === 'frosttroll') { ellipse(9, -57, 5, 4, shade(d.color, -0.1)); }
      },
      tool: () => {
        if (d.type === 'ranged') drawBow(e.id === 'sentry' ? '#9fe8f5' : '#8a6a4a', e.atkT > 0.4);

}

function fire(x, y, len, a) {

  g.addColorStop(0, `rgba(255,240,120,${a})`); g.addColorStop(0.5, `rgba(255,120,30,${a * 0.8})`); g.addColorStop(1, 'rgba(200,30,0,0)');

}

/* --- resource nodes --- */
function drawNode(e) {
  const x = entScreenX(e);
  const fade = e.dying ? clamp(R.doneT / 0.6, 0, 1) : 1;

  ctx.save();
  if (e.kind === 'tree') {
    ctx.translate(x + shake, GY);
    if (e.dying) ctx.rotate((1 - fade) * 1.45);
    ctx.globalAlpha = e.dying ? Math.min(1, fade * 2) : 1;
    rr(-9, -78, 18, 78, 3, '#6b4426');

    const c = CANOPY[e.tier];

    circle(-8, -112, 16, shade(c, 0.08));

    if (e.tier === 2) for (let k = 0; k < 6; k++) circle(-26 + hash(k) * 52, -120 + hash(k + 3) * 50, 4, '#f0a040');
  } else if (e.kind === 'rock') {

    ctx.globalAlpha = fade;
    ctx.scale(s, s);
    poly([-46, 0, -38, -32, -14, -52, 20, -46, 42, -24, 48, 0], '#6e6e78');
    poly([-14, -52, 20, -46, 8, -30, -20, -34], '#868692');
    const oc = e.ess ? '#b48cff' : ORES[e.tier].color;
    for (const [ox, oy, r] of [[-22, -18, 6], [6, -36, 5], [24, -14, 7], [-4, -12, 4], [-28, -36, 4]]) circle(ox, oy, r, oc);

    for (let k = 0; k < 2; k++) {
      const p = (time * 0.6 + k * 0.5) % 1;

}

function updateVisuals(dt) {
  R.swing = Math.max(0, R.swing - dt * 3.2);

  projs = projs.filter(p => p.t < 1);

  let arrived = false;
  for (const c of coins) { c.t += dt * 1.6; if (c.t >= 1) arrived = true; }
  coins = coins.filter(c => c.t < 1);
  if (arrived) pulseGold();
  if (R.ent) { R.ent.hit = Math.max(0, R.ent.hit - dt * 3); if (R.ent.lunge !== undefined) R.ent.lunge = Math.max(0, R.ent.lunge - dt * 3); }
  for (const f of floaters) { f.life -= dt; if (!f.splat) f.y -= 30 * dt; }
  for (const d of xpDrops) d.t += dt;
  xpDrops = xpDrops.filter(d => d.t < 1.6);
  floaters = floaters.filter(f => f.life > 0);
  for (const p of particles) { p.life -= dt; p.wx += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; if (p.y > GY + 4) { p.y = GY + 4; p.vy *= -0.3; p.vx *= 0.6; } }

}

      ctx.strokeText(txt, ex, top - 9 * FS); ctx.fillText(txt, ex, top - 9 * FS); ctx.textAlign = 'left';
    }
  }
  if (R.phase === 'dead') {
    ctx.fillStyle = 'rgba(80,0,0,0.35)'; ctx.fillRect(0, 0, W, H);
    font(700, 28); ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(`Defeated... ${Math.ceil(R.deadT)}`, W / 2, H / 2 - 30); ctx.textAlign = 'left';
  }
  for (const c of coins) {
    if (c.t < 0) continue;
    const t = c.t, u = 1 - t, tx = 24, ty = -10;
    const x = u * u * c.x0 + 2 * u * t * c.cx + t * t * tx, y = u * u * c.y0 + 2 * u * t * c.cy + t * t * ty;
    circle(x, y, 5, '#f2c94c'); circle(x - 1, y - 1, 2.5, '#fff1a8');
  }
}

function draw() {
  const z = ZONES[S.zone];
  const shx = R.shake > 0 ? rand(-1, 1) * R.shake : 0, shy = R.shake > 0 ? rand(-1, 1) * R.shake : 0;
  ctx.save();
  if (G3.on) { ctx.clearRect(0, 0, W, H); G3.render(shx, shy); }
  ctx.translate(shx, shy);
  if (G3.on) { drawWeather(z.th); drawEvents(true); drawHeroExtras(); }
  else {
    drawBackground(z);
    if (R.ent) {
      const k = R.ent.kind;
      if (k === 'enemy') drawEnemy(R.ent); else if (k === 'npc') drawNpc(R.ent); else if (k === 'patch') drawPatch2D(R.ent); else if (k === 'obstacle') { const ox = entScreenX(R.ent) - R.ent.stop; rr(ox, GY - 6, OBS[R.ent.ob].L, 8, 3, '#7a5a3a'); } else if (CRAFTING.has(R.ent.skill)) drawStation(R.ent); else drawNode(R.ent);
    }
    drawEvents();
    drawHero();
  }
  drawProjs();
  if (R.ring > 0) {
    ctx.strokeStyle = `rgba(242,201,76,${R.ring})`; ctx.lineWidth = 4 * R.ring;
    ctx.beginPath(); ctx.ellipse(HX, GY - 40, 30 + (1 - R.ring) * 90, 20 + (1 - R.ring) * 70, 0, 0, Math.PI * 2); ctx.stroke();
  }
  for (const p of particles) { ctx.globalAlpha = clamp(p.life * 2, 0, 1); ctx.fillStyle = p.color; ctx.fillRect(p.wx - R.worldX + HX - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.life / f.max * 1.5, 0, 1);
    const pop = 1 + 0.5 * clamp((f.life - f.max + 0.15) / 0.15, 0, 1);
    font(700, 15 * f.size * pop);
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    const x = f.screen ? f.sx : f.wx - R.worldX + HX;
    if (f.splat) drawSplat(x, f.y, f.text, f.splat, f.size * (1 + 0.3 * clamp((f.life - f.max + 0.1) / 0.1, 0, 1)));
    else outlined(f.text, x, f.y, f.color);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  ctx.restore();
  drawHud();
  drawXpDrops();
}

/* --- World boss: everybody hits the same boss; damage goes to the server every 15 s --- */
const WB = { st: null, pend: 0, t: 0, sendT: 0, loadT: -99, busy: false, msg: '', told: 0 };
function wbTick(dt) {
  if (SIM || !sb || !me) return;
  WB.t += dt;
  const here = S.zone === WBOSS && S.activity === 'combat';
  if (!WB.busy && WB.pend > 0 && WB.t - WB.sendT >= (here ? 15 : 1)) wbSend();
  else if (!WB.busy && WB.t - WB.loadT >= (here || mapSel === WBOSS ? 30 : 300)) wbLoad();
}
async function wbLoad() {
  WB.loadT = WB.t; WB.busy = true;
  try {
    const { data, error } = await sb.rpc('wb_state');
    if (!error) wbSet(data);
  } catch (e) { }
  WB.busy = false; uiDirty = true;
}
function wbSet(st) {
  const old = WB.st;
  WB.st = Object.assign({}, old || {}, st);
  if (st.unclaimed && WB.told !== st.id) { WB.told = st.id; log('👹 You have world boss rewards to claim (Map → World Boss Arena).', 'lg-gold'); }
  // a new boss rose: the arena shows it
  if (old && old.id !== WB.st.id && S.zone === WBOSS && R.ent && R.ent.d.world) resetEncounter();
}
async function wbSend() {
  const dmg = WB.pend; WB.pend = 0; WB.sendT = WB.t; WB.busy = true;
  try {
    const { data, error } = await sb.rpc('wb_hit', { p_dmg: dmg });
    if (error) { WB.msg = 'Could not reach the server'; WB.pend += dmg; }
    else if (!data.ok) WB.msg = data.reason;
    else {
      WB.msg = data.counted < dmg ? `The server counted ${fmt(data.counted)} of ${fmt(dmg)} damage.` : '';
      if (WB.st) { WB.st.hp = data.hp; WB.st.max_hp = data.max_hp; WB.st.mine = (WB.st.mine || 0) + data.counted; }
      if (data.dead) {
        showBanner('👹 The world boss has fallen!'); sfx('level');
        log('👹 The world boss has fallen! Claim your reward in the World Boss Arena.', 'lg-xp');
        if (R.ent && R.ent.d.world) { R.phase = 'done'; R.doneT = 1.5; R.ent.dying = true; }
        WB.loadT = -99;
      }
    }
  } catch (e) { WB.pend += dmg; }
  WB.busy = false; uiDirty = true;
}
async function wbClaim() {
  if (!me || WB.busy) return;
  WB.busy = true;
  for (let i = 0; i < 40 && NET.busy; i++) await new Promise(r => setTimeout(r, 250));
  try {
    const { data, error } = await sb.rpc('wb_claim');
    if (error || !data.ok) WB.msg = 'Could not claim – try again';
    else {
      S.gold += data.gold; if (data.clues) give('clue_hard', data.clues);
      S.stats.wboss = (S.stats.wboss || 0) + 1;
      const got = [`${fmt(data.gold)} gold`].concat(data.clues ? [`${data.clues}× Clue Scroll (hard)`] : []);
      log(`👹 World boss reward: ${got.join(', ')}`, 'lg-gold'); showBanner(`👹 +${fmt(data.gold)} gold`); sfx('coin');
      if (WB.st) WB.st.unclaimed = 0;
      WB.busy = false; await netSync();
    }

}
function htmlWorldBoss(i) {
  const z = ZONES[i];
  if (!sb) return '<p class="need">The world boss needs a connection to the server.</p>';
  if (!me) return '<p class="need">Log in to fight the world boss with everybody else.</p><button data-a="acct">👤 Log in</button>';
  if (combatLevel() < z.req) return `<p class="need">Reach combat level ${z.req} to fight the world boss (you are ${combatLevel()}).</p>`;
  const st = WB.st;
  if (!st) { if (!WB.busy) wbLoad(); return '<p class="muted">Looking for the world boss…</p>'; }
  const id = WB_BOSSES[st.kind || 0], d = ENEMIES[id], hp = Math.max(0, st.hp - WB.pend), on = S.zone === i && S.activity === 'combat';
  const left = Math.max(0, new Date(st.ends_at).getTime() - Date.now()) / 1000;
  return `<div class="info"><b>👹 ${d.name}</b> <span class="tag">${TYPE_ICON[d.type]} ${d.styles.map(t => TYPE_NAME[t]).join(' / ')}</span>
    <div class="bar"><i style="width:${(hp / st.max_hp * 100).toFixed(1)}%;background:#e85a5a"></i></div>

/* --- Clans: a group of up to 50 heroes with its own chat and a clan ranking --- */
const CL = { me: undefined, info: null, list: null, msgs: [], chan: null, at: 0, msg: '', unread: 0, busy: false };
async function clanLoad() {
  if (!sb || !me || CL.busy) return;
  CL.busy = true; CL.at = Date.now();
  try {
    const { data: m } = await sb.from('clan_members').select('clan_id').eq('user_id', me.id).maybeSingle();
    const cid = m ? m.clan_id : null;
    if (cid !== CL.me) { clanUnsub(); CL.msgs = []; }
    CL.me = cid;
    if (cid) {
      const [info, chat] = await Promise.all([sb.rpc('clan_info', { p_id: cid }),
        CL.chan ? null : sb.from('clan_chat').select('id,name,body,created_at').eq('clan_id', cid).order('created_at', { ascending: false }).limit(40)]);
      CL.info = info.error ? null : info.data;

    } else {
      CL.info = null;
      const { data, error } = await sb.rpc('clan_list');

  CL.busy = false; renderClan();
}
function clanSub(cid) {

    if (CL.msgs.some(m => m.id === pl.new.id)) return;

    if (CHAT.tab !== 'clan') CL.unread++;

}

/* --- PvP against other players' heroes: the server rolls the fight, the game plays it back --- */
const PVP = { targets: null, history: null, busy: false, msg: '' };
async function pvpFind() {

  PVP.busy = true; PVP.msg = ''; uiDirty = true;

      sb.rpc('pvp_targets'),

}
async function pvpFight(id) {
  if (!me || PVP.busy) return;
  if (R.ent && R.ent.replay) { PVP.msg = 'Finish this fight first'; uiDirty = true; return; }
  if (!zoneOpen(WILD)) { PVP.msg = `Reach combat level ${ZONES[WILD].req} to fight in the Wilderness`; uiDirty = true; return; }
  PVP.busy = true; PVP.msg = ''; uiDirty = true;
  await netSync();   // the server fights with your latest saved hero
  try {
    const { data, error } = await sb.rpc('pvp_attack', { p_target: id });
    if (error) PVP.msg = error.message;

}
function startReplay(r) {
  if (S.zone !== WILD || S.activity !== 'combat') travel(WILD, 'combat');
  const o = r.opp, eq = o.equip || {}, it = sl => eq[sl] && ITEMS[eq[sl]];
  const d = { name: o.name, pker: true, real: true, lvl: o.combat, type: o.type, hp: o.hp, maxHit: o.maxhit, atk: Math.round(o.atk), def: o.def,
    speed: o.speed, gold: [0, 0], shape: 'humanoid', size: 1, color: '#f1c27d', body: it('body') ? it('body').color : '#5a4a3a', orb: '#c58bff', drops: [] };
  R.ent = { kind: 'enemy', id: 'player', d, hp: o.hp, maxHp: o.hp, atk: d.atk, def: d.def, atkT: 99, x: R.worldX + Math.max(420, W - HX - 40),
    stop: o.type === 'melee' && wtype() === 'melee' ? 70 : 140, hit: 0, lunge: 0, pend: 0, style: o.type, swap: 99, food: 0,
    replay: r.log, rt: 0, ri: 0, result: r, hpBack: S.hp };
  R.phase = 'walk'; R.events = [];
  S.hp = r.me.hp;
  showBanner(`⚔️ PvP: ${o.name} (level ${o.combat})`); sfx('boss');
  log(`⚔️ You challenge ${o.name} (level ${o.combat}, rating ${o.rating || '?'}).`, 'lg-xp');
}
// play the server's fight log back at 1.5x speed
function replayTick(dt) {
  const e = R.ent, ev = e.replay, ex = entScreenX(e), ey = GY - entHeight(e) * 0.5;
  e.rt += dt * 1.5;
  while (e.ri < ev.length && ev[e.ri].t <= e.rt) {
    const v = ev[e.ri++];
    if (v.s === 'a') {
      R.swing = 1; e.hp = v.hp; if (v.d) e.hit = 1;
      if (wtype() !== 'melee') shoot(HX + 18, GY - 48, ex, ey, wtype() === 'ranged' ? 'arrow' : 'orb', '#fff', 0.25);
      hitsplat(ex, ey, v.d, v.d ? 'hit' : 'miss'); sfx(v.d ? 'hit' : 'miss');
    } else if (v.s === 'd') {
      e.lunge = 1; S.hp = Math.min(maxHp(), v.hp); if (v.d) R.heroHit = 1;
      if (e.d.type !== 'melee') shoot(ex - 10, ey, HX + 6, GY - 44, e.d.type === 'ranged' ? 'arrow' : 'orb', e.d.orb, 0.25);
      hitsplat(HX, GY - 42, v.d, v.d ? 'hit' : 'miss', true); if (v.d) sfx('hurt');
    } else if (v.s === 'ae') { S.hp = Math.min(maxHp(), v.hp); R.eatFlash = 1; floatText(HX + 18, GY - 120, '+' + v.h, '#6fd27a', 1, 1, true); }
    else if (v.s === 'be') { e.hp = v.hp; floatText(ex, GY - entHeight(e) - 40, `🍖 +${v.h}`, '#6fd27a', 1.2); }
  }
  if (e.ri >= ev.length) endReplay(e);
}
function endReplay(e) {
  const r = e.result, name = e.d.name;
  if (me) { me.rating = r.rating; if (r.win) me.wins++; else me.losses++; }
  if (r.win) {
    S.gold += r.gold; S.hp = Math.max(1, e.hpBack);
    R.phase = 'done'; R.doneT = 0.8; e.dying = true;
    showBanner(`🏆 You beat ${name}! +${r.rating_change} rating · +${fmt(r.gold)} gold`); sfx('level');
    log(`🏆 PvP: you beat ${name}. Rating ${r.rating} (+${r.rating_change}), +${fmt(r.gold)} gold.`, 'lg-gold');
  } else {
    S.hp = 0; R.phase = 'dead'; R.deadT = 4;
    showBanner(`💀 ${name} won the fight (${r.rating_change} rating)`);
    log(`💀 PvP: ${name} beat you. Rating ${r.rating} (${r.rating_change}). You keep your items – real PvP only costs rating.`, 'lg-bad');
  }
  PVP.history = null; PVP.targets = null; uiDirty = true;
}

/* --- Grand Exchange: the server holds offers in escrow and matches them --- */
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const GE = { offers: null, collect: null, trades: null, busy: false, msg: '', at: 0, told: false };

async function geLoad() {
  if (!me) return;
  try {
    const [o, c, t] = await Promise.all([
      sb.from('ge_offers').select('id,kind,item,price,qty,left_qty,status,created_at').eq('user_id', me.id).order('created_at', { ascending: false }).limit(16),
      sb.from('ge_collect').select('item,qty').eq('user_id', me.id),

    ]);
    GE.offers = o.data || []; GE.trades = t.data || [];
    GE.collect = {}; for (const r of c.data || []) GE.collect[r.item] = (GE.collect[r.item] || 0) + Number(r.qty);
    if (o.error) GE.msg = o.error.message;
  } catch (e) { GE.msg = 'Could not reach the server'; }
  GE.at = Date.now(); uiDirty = true;
}
// the browser sends the hero; the server checks it, changes it (escrow, collecting) and sends it back
async function geCall(fn, args, done) {
  if (GE.busy || !me) return;
  GE.busy = true; GE.msg = ''; uiDirty = true;
  try {
    S.last = Date.now();
    const { data, error } = await sb.rpc(fn, Object.assign({ p_data: S }, args));
    if (error) GE.msg = error.message;
    else if (!data.ok) {
      if (data.data) useCloud(data.data, data.reason === 'stale' ? '☁️ This device was behind – loaded your newer hero.' : '⛔ The server refused this device\'s progress and restored your last good save.');
      GE.msg = data.reason === 'stale' ? 'This device was behind – your newer hero is loaded, try again' : data.reason === 'rejected' ? 'The server refused this device\'s progress' : data.reason;
    } else {
      applySave(data.data); lastHero = ''; save();
      if (done) done(data);
    }
  } catch (e) { GE.msg = 'Could not reach the server'; }
  GE.busy = false;
  await geLoad();
}
function geOfferModal(kind) {
