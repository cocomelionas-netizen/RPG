    walk: walking ? Math.sin(time * 13) * 0.6 : 0,
    arm: heroArmAngle(), body: R.heroHit > 0.5 ? '#d84a4a' : body, leg: legs ? shade(legs.color, -0.08) : '#3b3550', skin: R.heroHit > 0.5 ? '#ff9a8a' : '#f1c27d',
    shield: shield && S.activity === 'combat' ? shield.color : null,
    headExtra: () => {
      if (armor) {
        const hc = shade(helm.color, -0.05);
        ctx.fillStyle = hc; ctx.beginPath(); ctx.arc(0, -61, 11, Math.PI, 0); ctx.fill(); ctx.fillRect(-11, -62, 22, 3);
        if (helm.kind === 'fullhelm') { ctx.fillRect(-11, -62, 6, 12); ctx.fillStyle = '#111'; ctx.fillRect(3, -61, 7, 2); }
      }
      else { ctx.fillStyle = '#6b3e1f'; ctx.beginPath(); ctx.arc(-1, -62, 10.5, Math.PI * 1.05, Math.PI * 1.95); ctx.fill(); }
    },
    tool: heroTool(),
  });
  drawHeroExtras();
  if (S.activity === 'fishing' && R.phase === 'act' && R.ent && R.ent.kind === 'pond') {
    const a = heroArmAngle();
    const sx = HX + 5, sy = GY - 46;
    const tx = sx - Math.sin(a) * 80, ty = sy + Math.cos(a) * 80;
    const bx = entScreenX(R.ent) - 12 + Math.sin(time * 2) * 3, by = GY + 6 + Math.sin(time * 4) * 1.5;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo((tx + bx) / 2, ty + 10, bx, by); ctx.stroke();
    circle(bx, by, 3, '#e84a4a'); ctx.fillStyle = '#fff'; ctx.fillRect(bx - 3, by - 1, 6, 1);
  }
}
function drawHeroExtras() {
  const walking = R.phase === 'walk', dead = R.phase === 'dead';
  if (S.pet && !dead) {
    const p = PETS.find(x => x.id === S.pet);
    const px = HX - 44, py = GY - 8 - (walking ? Math.abs(Math.sin(time * 13 + 1)) * 6 : Math.sin(time * 2) * 2);
    ellipse(px, GY + 2, 10, 3, 'rgba(0,0,0,0.25)');
    ctx.save(); ctx.translate(px, py); ctx.scale(-1, 1);   // emoji pets face the way the hero walks
    ctx.font = `${Math.round(24 * FS)}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(p.icon, 0, 4); ctx.restore(); ctx.textAlign = 'left';
  }
  if (R.ent && R.ent.kind === 'npc' && R.ent.stun > 0) {
    for (let k = 0; k < 3; k++) { const a = time * 5 + k * 2.1; circle(HX + Math.cos(a) * 14, GY - 76 + Math.sin(a) * 4, 2.5, '#ffe14a'); }
  }
}

/* --- enemies --- */
function drawEnemy(e) {
  const d = e.d, s = d.size;
  let x = entScreenX(e) + e.lunge * (d.type === 'melee' ? -18 : -5);
  const dying = e.dying ? clamp(R.doneT / 0.6, 0, 1) : 1;
  ctx.save();
  ctx.globalAlpha = dying;
  if (e.hit > 0.5) ctx.filter = 'brightness(2.2)';
  if (d.shape !== 'flyer') ellipse(x, GY + 2, 26 * s * (d.shape === 'dragon' ? 3 : 1), 5, 'rgba(0,0,0,0.25)');
  if (d.shape === 'blob') {
    const q = 1 + 0.08 * Math.sin(time * 5);
    const w = 26 * q, h = 22 / q;
    ctx.save(); ctx.translate(x, GY); ctx.scale(s, s);
    ellipse(0, -h, w, h, d.color);
    ellipse(-6, -h - 8, 8, 4, 'rgba(255,255,255,0.35)');
    circle(-9, -h - 2, 5, '#fff'); circle(4, -h - 2, 5, '#fff');
    circle(-11, -h - 1, 2.4, '#111'); circle(2, -h - 1, 2.4, '#111');
    if (d.boss) poly([-10, -2 * h + 3, -10, -2 * h - 9, -5, -2 * h - 3, 0, -2 * h - 12, 5, -2 * h - 3, 10, -2 * h - 9, 10, -2 * h + 3], '#f2c94c');
    ctx.restore();
  } else if (d.shape === 'quad') {
    const c = d.color, dk = shade(c, -0.15), br = Math.sin(time * 4) * 1;
    const low = e.id === 'lizard' ? 0.6 : 1;
    ctx.save(); ctx.translate(x, GY); ctx.scale(s, s);
    // tail
    ctx.strokeStyle = e.id === 'rat' ? '#d9a3a3' : dk; ctx.lineWidth = e.id === 'rat' ? 2 : e.id === 'wolf' ? 7 : 9;
    ctx.beginPath(); ctx.moveTo(26, -20 * low); ctx.quadraticCurveTo(48, -30 * low + Math.sin(time * 6) * 5, 60, -12); ctx.stroke();
    for (const lx of [-18, -8, 10, 20]) rr(lx - 3, -16 * low, 6, 16 * low, 2, lx < 0 ? c : dk);
    ellipse(0, -22 * low + br, 30, 13 * low, c);
    if (e.id === 'lizard') for (let k = 0; k < 5; k++) poly([-16 + k * 8, -32 * low, -12 + k * 8, -40 * low, -8 + k * 8, -32 * low], '#ffb04a');
    circle(-32, -28 * low + br, 11, c);
    ellipse(-42, -24 * low + br, 9, 6, c);
    if (e.id !== 'lizard') poly([-34, -36 * low, -28, -46 * low, -24, -34 * low], dk);
    circle(-36, -30 * low + br, 2.2, e.id === 'wolf' ? '#ffd24a' : '#111');
    circle(-50, -25 * low + br, 2, '#222');
    ctx.restore();
    if (e.id === 'lizard' && e.lunge > 0.4) fire(x - 50 * s, GY - 25 * s, 80, e.lunge);
  } else if (d.shape === 'flyer') {
    const cy = GY - 75 + Math.sin(time * 4) * 8, fl = Math.sin(time * 16);
    poly([x - 6, cy, x - 40, cy - 16 - fl * 14, x - 30, cy + 4, x - 20, cy - 2, x - 12, cy + 8], shade(d.color, -0.1));
    poly([x + 6, cy, x + 40, cy - 16 - fl * 14, x + 30, cy + 4, x + 20, cy - 2, x + 12, cy + 8], shade(d.color, -0.1));
    ellipse(x, cy, 12, 14, d.color);
    poly([x - 9, cy - 9, x - 6, cy - 22, x - 2, cy - 11], d.color);
    poly([x + 9, cy - 9, x + 6, cy - 22, x + 2, cy - 11], d.color);
    circle(x - 4, cy - 3, 2.2, '#ff3b3b'); circle(x + 4, cy - 3, 2.2, '#ff3b3b');
    if (d.orb) { const g = ctx.createRadialGradient(x, cy, 2, x, cy, 30); g.addColorStop(0, d.orb + '88'); g.addColorStop(1, d.orb + '00'); ctx.fillStyle = g; ctx.fillRect(x - 30, cy - 30, 60, 60); }
  } else if (d.shape === 'humanoid') {
    const sk = e.id === 'skeleton' || e.id === 'bonelord';
    const gob = e.id.startsWith('gob');
    drawHumanoid({
      x, y: GY, s, face: -1, walk: 0, arm: d.type === 'melee' ? -0.5 - 1.6 * e.lunge : -1.5 - 0.25 * e.lunge,
      body: d.body, leg: sk ? '#d8d3c0' : shade(d.body, -0.2), skin: d.color, ribs: sk,
      eye: sk ? '#111' : e.id === 'orc' ? '#ffdd33' : '#331',
      headExtra: () => {
        if (d.boss) poly([-9, -67, -9, -77, -4, -71, 0, -79, 4, -71, 9, -77, 9, -67], '#f2c94c');
        if (gob) { poly([-8, -62, -18, -70, -6, -56], d.color); poly([6, -62, 16, -70, 4, -56], d.color); }
        if (e.id === 'orc') { ctx.fillStyle = '#fff'; ctx.fillRect(4, -53, 2, 4); }
        if (e.id === 'troll' || e.id === 'frosttroll') { ellipse(9, -57, 5, 4, shade(d.color, -0.1)); }
      },
      tool: () => {
        if (d.type === 'ranged') drawBow(e.id === 'sentry' ? '#9fe8f5' : '#8a6a4a', e.atkT > 0.4);
        else if (d.type === 'magic') drawStaff(d.orb || '#c58bff');
        else if (sk) { rr(-1.5, 15, 3, 6, 1, '#5a3a22'); rr(-2, 21, 4, 26, 1, '#8b7d6b'); }
        else if (e.id === 'orc' || e.id === 'gobchief') { rr(-1.5, 12, 3, 30, 1, '#5a3a22'); poly([1, 32, 14, 24, 15, 46, 1, 42], '#888'); }
        else { ctx.fillStyle = '#6b4a2a'; ctx.beginPath(); ctx.moveTo(-2, 14); ctx.lineTo(2, 14); ctx.lineTo(5, 44); ctx.lineTo(-5, 44); ctx.closePath(); ctx.fill(); }
      },
    });
  } else if (d.shape === 'dragon') {
    const c = d.color, dk = shade(c, -0.15), fl = Math.sin(time * 3) * 18;
    const bx = x + 40;
    ctx.strokeStyle = c; ctx.lineWidth = 16; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(bx + 50, GY - 50); ctx.quadraticCurveTo(bx + 110, GY - 30, bx + 140, GY - 70 + Math.sin(time * 2) * 8); ctx.stroke();
    ctx.lineCap = 'butt';
    poly([bx + 10, GY - 80, bx - 20, GY - 190 + fl, bx + 50, GY - 165 + fl, bx + 100, GY - 150 + fl * 0.7, bx + 60, GY - 80], shade(c, -0.25));
    rr(bx - 30, GY - 42, 16, 42, 5, dk); rr(bx + 30, GY - 42, 16, 42, 5, dk);
    ellipse(bx + 10, GY - 62, 60, 30, c);
    ellipse(bx + 5, GY - 50, 40, 14, '#d9a35a');
    poly([bx - 40, GY - 70, bx - 30, GY - 85, bx - 70, GY - 130, bx - 85, GY - 115], c);
    ellipse(bx - 90, GY - 128, 26, 14, c);
    poly([bx - 80, GY - 140, bx - 70, GY - 165, bx - 66, GY - 138], '#e8d8b0');
    poly([bx - 95, GY - 140, bx - 90, GY - 162, bx - 82, GY - 140], '#e8d8b0');
    circle(bx - 96, GY - 131, 3, '#ffe04a');
    for (let k = 0; k < 6; k++) poly([bx - 20 + k * 14, GY - 90, bx - 13 + k * 14, GY - 104, bx - 6 + k * 14, GY - 90], dk);
    if (e.lunge > 0.3) fire(bx - 112, GY - 122, 150, e.lunge);
  }
  ctx.restore();
}

function fire(x, y, len, a) {
  const g = ctx.createLinearGradient(x, y, x - len, y);
  g.addColorStop(0, `rgba(255,240,120,${a})`); g.addColorStop(0.5, `rgba(255,120,30,${a * 0.8})`); g.addColorStop(1, 'rgba(200,30,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y - 3); ctx.lineTo(x - len, y - 30 + Math.sin(time * 30) * 6); ctx.lineTo(x - len, y + 40); ctx.closePath(); ctx.fill();
}

/* --- resource nodes --- */
function drawNode(e) {
  const x = entScreenX(e);
  const fade = e.dying ? clamp(R.doneT / 0.6, 0, 1) : 1;
  const shake = Math.sin(time * 70) * e.hit * 3;
  ctx.save();
  if (e.kind === 'tree') {
    ctx.translate(x + shake, GY);
    if (e.dying) ctx.rotate((1 - fade) * 1.45);
    ctx.globalAlpha = e.dying ? Math.min(1, fade * 2) : 1;
    rr(-9, -78, 18, 78, 3, '#6b4426');
    ctx.fillStyle = '#4e3019'; ctx.fillRect(-2, -60, 2, 30);
    const c = CANOPY[e.tier];
    circle(0, -100, 36, c); circle(-24, -80, 26, shade(c, -0.06)); circle(24, -82, 26, shade(c, -0.04));
    circle(-8, -112, 16, shade(c, 0.08));
    if (e.tier === 4) for (let k = 0; k < 5; k++) circle(Math.sin(time * 2 + k * 1.3) * 30, -95 + Math.cos(time * 1.7 + k) * 25, 2.5, '#f6e3ff');
    if (e.tier === 2) for (let k = 0; k < 6; k++) circle(-26 + hash(k) * 52, -120 + hash(k + 3) * 50, 4, '#f0a040');
  } else if (e.kind === 'rock') {
    const s = 0.55 + 0.45 * (e.yields / e.maxYields);
    ctx.translate(x + shake, GY);
    ctx.globalAlpha = fade;
    ctx.scale(s, s);
    poly([-46, 0, -38, -32, -14, -52, 20, -46, 42, -24, 48, 0], '#6e6e78');
    poly([-14, -52, 20, -46, 8, -30, -20, -34], '#868692');
    const oc = e.ess ? '#b48cff' : ORES[e.tier].color;
    for (const [ox, oy, r] of [[-22, -18, 6], [6, -36, 5], [24, -14, 7], [-4, -12, 4], [-28, -36, 4]]) circle(ox, oy, r, oc);
  } else if (e.kind === 'pond') {
    ctx.globalAlpha = fade;
    ellipse(x, GY + 10, 78, 13, '#245b91');
    ellipse(x, GY + 9, 70, 10, '#3d82c9');
    for (let k = 0; k < 2; k++) {
      const p = (time * 0.6 + k * 0.5) % 1;
      ctx.strokeStyle = `rgba(255,255,255,${0.5 * (1 - p)})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(x - 12, GY + 8, 6 + p * 30, 2 + p * 5, 0, 0, Math.PI * 2); ctx.stroke();
    }
    if (e.hit > 0.2) {
      const p = 1 - e.hit;
      ctx.save(); ctx.translate(x - 12 - p * 50, GY + 4 - Math.sin(p * Math.PI) * 50); ctx.rotate(-1 + p * 2);
      ellipse(0, 0, 10, 4, TIER_COLORS[e.tier]); poly([8, 0, 15, -5, 15, 5], TIER_COLORS[e.tier]);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawNpc(e) {
  const n = e.d, fade = e.dying ? clamp(R.doneT / 0.6, 0, 1) : 1;
  const x = entScreenX(e) + (1 - fade) * 70;   // wanders off after the last try
  ctx.save(); ctx.globalAlpha = fade;
  ellipse(x, GY + 2, 16, 4, 'rgba(0,0,0,0.25)');
  drawHumanoid({
    x, y: GY, s: 0.95, face: -1, walk: e.dying ? Math.sin(time * 13) * 0.6 : 0, arm: 0.15 + Math.sin(time * 2) * 0.05,
    body: n.body, leg: shade(n.body, -0.25), skin: n.skin,
    headExtra: () => {
      if (e.id === 'wizard') poly([-11, -66, 11, -66, 2, -92], '#3a3a9a');
      if (e.id === 'guard') { ctx.fillStyle = '#8a8f98'; ctx.beginPath(); ctx.arc(0, -61, 11, Math.PI, 0); ctx.fill(); }
      if (e.id === 'lord') poly([-8, -67, -8, -75, -3, -70, 0, -77, 3, -70, 8, -75, 8, -67], '#f2c94c');
      if (e.id === 'golbin') { poly([-8, -62, -18, -70, -6, -56], n.skin); poly([6, -62, 16, -70, 4, -56], n.skin); }
      if (e.id === 'farmer') { ctx.fillStyle = '#d9b45a'; ctx.fillRect(-14, -68, 28, 4); ctx.fillRect(-8, -76, 16, 9); }
    },
  });
  // coin pouch on the belt
  circle(x + 9, GY - 30, 4, '#b08a3a');
  ctx.restore();
}

function drawStation(e) {
  const x = entScreenX(e);
  const fade = e.dying ? clamp(R.doneT / 0.6, 0, 1) : 1;
  const working = R.phase === 'act' && R.ent === e && !e.blocked;
  ctx.save(); ctx.globalAlpha = fade; ctx.translate(x, GY);
  if (e.kind === 'pyre') {
    ctx.save(); ctx.rotate(0.3); rr(-22, -6, 44, 8, 3, '#6b4426'); ctx.restore();
    ctx.save(); ctx.rotate(-0.3); rr(-22, -6, 44, 8, 3, '#7a4e2a'); ctx.restore();
    rr(-18, -14, 36, 7, 3, '#5a3a22');
    if (working || e.hit > 0) {
      const big = 1 + e.hit * 0.4;
      const glow = ctx.createRadialGradient(0, -24, 4, 0, -24, 70);
      glow.addColorStop(0, 'rgba(255,170,60,0.55)'); glow.addColorStop(1, 'rgba(255,120,30,0)');
      ctx.fillStyle = glow; ctx.fillRect(-70, -94, 140, 100);
      for (let k = 0; k < 4; k++) {
        const fl = Math.sin(time * 11 + k * 1.7) * 5, hgt = (34 + k * 8 + fl) * big;
        poly([-16 + k * 8, -10, -8 + k * 8 + fl * 0.4, -10 - hgt, 0 + k * 8, -10], ['#ff5a1a', '#ff8a2a', '#ffb43a', '#ffe06a'][k]);
      }
      if (Math.random() < 0.4) particles.push({ wx: R.worldX + entScreenX(e) - HX + rand(-10, 10), y: GY - 50, vx: rand(-15, 15), vy: rand(-90, -50), life: 0.6, color: '#ffb347' });
    }
  } else if (e.kind === 'furnace') {
    ellipse(0, 2, 34, 5, 'rgba(0,0,0,0.25)');
    rr(-30, -58, 60, 58, 6, '#6e6a72');
    rr(-14, -96, 18, 40, 2, '#5c5860');
    for (let k = 0; k < 4; k++) rr(-30, -54 + k * 14, 60, 2, 1, '#5a565e');
    rr(-16, -34, 32, 24, 10, '#1c1214');
    const fl = working ? 0.7 + 0.3 * Math.sin(time * 9) : 0.35;
    const glow = ctx.createRadialGradient(0, -22, 2, 0, -22, 34);
    glow.addColorStop(0, `rgba(255,170,60,${fl})`); glow.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = glow; ctx.fillRect(-36, -58, 72, 72);
    rr(-12, -26, 24, 14, 6, `rgba(255,${130 + 70 * fl},40,${0.6 + 0.4 * fl})`);
    if (working && Math.random() < 0.3) particles.push({ wx: R.worldX + x - HX - 5, y: GY - 98, vx: rand(-8, 8), vy: rand(-40, -20), life: 0.8, color: 'rgba(120,120,120,0.6)' });
  } else if (e.kind === 'bench') {
    ellipse(0, 2, 34, 5, 'rgba(0,0,0,0.25)');
    rr(-30, -6, 5, 6, 1, '#5a3a22'); rr(25, -6, 5, 6, 1, '#5a3a22');
    rr(-28, -30, 6, 26, 2, '#6b4426'); rr(22, -30, 6, 26, 2, '#6b4426');
    rr(-34, -36, 68, 8, 2, '#8a5a32');
    ctx.strokeStyle = '#a06a3a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(-6, -30, 18, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    for (let k = 0; k < 3; k++) rr(10 + k * 5, -44, 2, 10, 1, '#d8c8a8');
    if (working && e.hit > 0.3) burst(0, GY - 40, '#d8b888', 1);
  } else if (e.kind === 'altar') {
    const glow = ctx.createRadialGradient(0, -40, 4, 0, -40, 60);
    glow.addColorStop(0, `rgba(190,130,255,${working ? 0.55 : 0.25})`); glow.addColorStop(1, 'rgba(190,130,255,0)');
    ctx.fillStyle = glow; ctx.fillRect(-60, -100, 120, 100);
    rr(-26, -8, 52, 8, 2, '#5e5a6e');
    rr(-20, -34, 40, 27, 3, '#7a768c');
    rr(-24, -40, 48, 7, 2, '#8f8aa3');
    ctx.save(); ctx.translate(0, -56); ctx.rotate(time * (working ? 2 : 0.5));
    poly([0, -10, 8, 0, 0, 10, -8, 0], '#d6b8ff'); ctx.restore();
    ctx.strokeStyle = `rgba(214,184,255,${0.4 + 0.3 * Math.sin(time * 4)})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, -22, 8, 0, Math.PI * 2); ctx.stroke();
  } else if (e.kind === 'anvil') {
    ellipse(0, 2, 30, 5, 'rgba(0,0,0,0.25)');
    rr(-15, -22, 30, 22, 3, '#6b4426');
    ellipse(0, -22, 15, 4, '#8a5a32');
    rr(-9, -34, 18, 13, 2, '#2d3036');
    poly([-28, -40, 20, -40, 30, -45, 30, -49, -20, -49, -28, -45], '#41454d');
    rr(-20, -52, 44, 4, 2, '#5b6069');
    if (working) {
      const glow = ctx.createRadialGradient(0, -54, 2, 0, -54, 30);
      glow.addColorStop(0, 'rgba(255,170,60,0.6)'); glow.addColorStop(1, 'rgba(255,170,60,0)');
      ctx.fillStyle = glow; ctx.fillRect(-32, -86, 64, 64);
      rr(-12, -56, 22, 4, 2, `rgb(255,${150 + 60 * Math.sin(time * 6)},40)`);
    }
  } else {
    const glow = ctx.createRadialGradient(0, -14, 4, 0, -14, 70);
    glow.addColorStop(0, 'rgba(255,160,60,0.45)'); glow.addColorStop(1, 'rgba(255,160,60,0)');
    ctx.fillStyle = glow; ctx.fillRect(-70, -84, 140, 90);
    ctx.save(); ctx.rotate(0.35); rr(-24, -6, 48, 8, 3, '#6b4426'); ctx.restore();
    ctx.save(); ctx.rotate(-0.35); rr(-24, -6, 48, 8, 3, '#7a4e2a'); ctx.restore();
    for (let k = 0; k < 3; k++) {
      const fl = Math.sin(time * 12 + k * 2) * 4, hgt = 26 + k * 6 + fl;
      poly([-12 + k * 6, -4, -4 + k * 6 + fl * 0.4, -hgt, 4 + k * 6, -4], ['#ff6a2a', '#ff9a3a', '#ffd25a'][k]);
    }
    ctx.strokeStyle = '#5a3a22'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(-22, -40); ctx.moveTo(26, 0); ctx.lineTo(22, -40); ctx.moveTo(-26, -38); ctx.lineTo(26, -38); ctx.stroke();
    if (working) { ellipse(0, -34, 11, 4, '#c9c3b0'); poly([10, -34, 16, -38, 16, -30], '#c9c3b0'); }
  }
  ctx.restore();
}

function drawEvents(overlayOnly) {
  for (const ev of R.events) {
    const { x, y } = evScreen(ev);
    if (x < -60 || x > W + 60) continue;
    ctx.save();
    ctx.globalAlpha = clamp((25 - ev.age) / 3, 0, 1);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 26 + Math.sin(time * 5) * 4, 0, Math.PI * 2); ctx.stroke();
    if (overlayOnly) { /* the 3D view draws the find itself */ }
    else if (ev.type === 'chest') {
      ctx.translate(x, GY - Math.abs(Math.sin(time * 4)) * 3);
      ellipse(0, 2, 20, 4, 'rgba(0,0,0,0.25)');
      rr(-17, -22, 34, 22, 3, '#8a5a2b');
      rr(-18, -32, 36, 11, 5, '#a56d35');
      rr(-18, -22, 36, 3, 1, '#f2c94c');
      rr(-3, -25, 6, 8, 1, '#f2c94c');

    sp.scale.set(s, s, 1); return sp;

  }

const $ = s => document.querySelector(s);
let tab = 'activity', lastHtml = '', lastHero = '';

function itemLabel(id) {
  const it = ITEMS[id];
  const c = it.color || (it.tier !== undefined ? TIER_COLORS[it.tier] : null);
  return `${c ? `<span class="tier" style="background:${c}"></span>` : ''}${it.name}`;
}

function zoneEnemies(z) {
  return [...new Set(z.enemies)].map(id => `${TYPE_ICON[ENEMIES[id].type]} ${ENEMIES[id].name}`).join(', ');
}
function htmlCombatPanel() {
  const wt = wtype(), mode = attackMode(), ct = combatType();
  let h = `<div class="row"><b>Weapon:</b> ${S.equip.weapon ? itemLabel(S.equip.weapon) : 'Fists'} <span class="tag">${TYPE_ICON[ct]} ${TYPE_NAME[ct]}</span></div>`;
  if (mode === 'unarmed' && wt !== 'melee') h += `<p class="need">${wt === 'ranged' ? 'No arrows' : 'No runes'} – your hero is punching. Fletch or buy ${wt === 'ranged' ? 'arrows' : 'runes (Craft → Runecrafting, or the Shop)'}.</p>`;
  h += `<h3>Style</h3><div class="chips">` + STYLES[ct].map(([id, n, xp]) =>
    `<button class="${S.styles[ct] === id ? 'sel' : ''}" data-a="style" data-id="${id}">${n}<small>${xp}</small></button>`).join('') + '</div>';
  if (wt === 'magic') {
    h += `<h3>Spell · 🔮 ${fmt(has('rune'))} runes</h3><div class="chips"><button class="${S.spell < 0 ? 'sel' : ''}" data-a="spell" data-id="-1">Best<small>auto</small></button>` +
      SPELLS.map((sp, i) => `<button class="${S.spell === i ? 'sel' : ''}" data-a="spell" data-id="${i}" ${LV.magic < sp.lvl ? 'disabled' : ''}>${LV.magic < sp.lvl ? '🔒 ' : ''}${sp.name}<small>Lv ${sp.lvl} · ${sp.runes} rune${sp.runes > 1 ? 's' : ''} · hit ${sp.max}</small></button>`).join('') + '</div>';
  }
  if (wt === 'ranged') { const a = bestArrow(); h += `<p class="muted">Ammo: ${a ? `${itemLabel(a)} ×${fmt(has(a))}` : '<span class="need">no arrows</span>'} – the best arrows are used first.</p>`; }
  h += `<div class="row muted" style="margin-top:10px">Max hit <b>${playerMaxHit()}</b> · Accuracy <b>${Math.round(accuracyLevel())}</b> · Speed <b>${playerSpeed()}s</b> · Armour <b>${armorValue()}</b> · Damage reduction <b>${Math.round(damageReduction() * 100)}%</b></div>`;
  const z = ZONES[S.zone];
  h += `<h3>Combat triangle</h3><p class="muted">⚔️ Melee beats 🏹 Ranged · 🏹 Ranged beats ✨ Magic · ✨ Magic beats ⚔️ Melee. Against an enemy you beat you deal +20% damage and take 15% less.</p>
    <div class="chips">` + [...new Set(z.enemies.concat(z.boss ? [z.boss] : []))].map(id => {
      const d = ENEMIES[id], t = BEATS[ct] === d.type ? 1 : BEATS[d.type] === ct ? -1 : 0;
      return `<span class="tag ${t > 0 ? 'good' : t < 0 ? 'bad' : ''}">${TYPE_ICON[d.type]} ${d.name}${t > 0 ? ' · strong' : t < 0 ? ' · weak' : ''}</span>`;
    }).join('') + '</div>';
  h += `<h3>🙏 Prayer · ${fmt(S.pp)} points</h3><div class="chips">` + PRAYERS.map(pr =>
    `<button class="${S.prayer === pr.id ? 'sel' : ''}" data-a="prayer" data-id="${pr.id}" ${LV.prayer < pr.lvl ? 'disabled' : ''}>${LV.prayer < pr.lvl ? '🔒' : pr.icon} ${pr.name}<small>Lv ${pr.lvl} · ${pr.desc} · ${pr.cost} pt/attack</small></button>`).join('') + '</div>';
  h += `<label class="check"><input type="checkbox" id="autobury" data-a="autobury" ${S.autoBury ? 'checked' : ''}> Bury bones automatically (Prayer XP + prayer points)</label>
    <p class="muted">When HP drops below 40%, the hero eats the best food available.</p>`;
  return h;
}

const ACT_ORDER = ['combat', 'thieving', 'woodcutting', 'mining', 'fishing', 'smithing', 'cooking', 'fletching', 'runecrafting', 'firemaking'];
const STATION_NAME = { smithing: '🔥 Furnace and 🔨 Anvil', cooking: '🔥 Campfire', fletching: '🪶 Fletching bench', runecrafting: '🔮 Rune altar', firemaking: '🔥 Campsite' };
let mapSel = null, mapAct = null;
function actIcon(a) { return a === 'combat' ? '⚔️' : SKILLS[a].icon; }
function enemyLevel(d) { return Math.round((d.atk + d.def) / 2); }
function dropIcons(d) { return [...new Set(d.drops.map(x => ITEMS[x[0]].icon))].join(''); }

function htmlActivity() {
  if (mapSel === null) mapSel = S.zone;
  const acts = ACT_ORDER.filter(a => locHas(mapSel, a));
  if (!acts.includes(mapAct)) mapAct = mapSel === S.zone && acts.includes(S.activity) ? S.activity : acts[0];
  let h = '<div class="map" id="worldmap"><canvas id="mapcv"></canvas>' + ZONES.map((z, i) => {
    const locked = !locOpen(i);
    const cls = ['loc', i === mapSel ? 'sel' : '', locked ? 'locked' : ''].join(' ');
    return `<button class="${cls}" style="left:${z.x * 100}%;top:${z.y * 100}%" data-a="loc" data-id="${i}" aria-label="${z.name}">
      <span class="pin">${locked ? '🔒' : z.icon}${i === S.zone ? '<i class="me">🧍</i>' : ''}</span><span class="nm">${z.name}</span></button>`;
  }).join('') + '</div>';
  const z = ZONES[mapSel];
  const kind = z.town ? 'Town' : z.slayer ? `💀 Slayer area · Slayer ${z.slayer}` : `Region ${mapSel + 1} · combat ${z.req}+`;
  h += `<div class="info locpanel"><div class="row" style="justify-content:space-between"><b class="locname">${z.icon} ${z.name}</b><span class="tag">${kind}</span></div>
    <p class="muted">${z.desc}${mapSel === S.zone ? ' <b>Your hero is here.</b>' : ''}</p>`;
  if (!locOpen(mapSel)) return h + `<p class="need">Reach Slayer level ${z.slayer} to enter (you are ${LV.slayer}).</p></div>`;
  h += '<div class="acticons">' + acts.map(a => `<button class="${a === mapAct ? 'sel' : ''} ${S.zone === mapSel && S.activity === a ? 'doing' : ''}" data-a="mapact" data-id="${a}">
    <span class="big">${actIcon(a)}</span>${a === 'combat' ? 'Combat' : SKILLS[a].name}<small>${a === 'combat' ? 'Combat ' + combatLevel() : 'Level ' + LV[a]}</small></button>`).join('') + '</div>';
  h += htmlLocAct(mapSel, mapAct) + '</div>';
  if (mapAct === 'combat' && S.activity === 'combat' && S.zone === mapSel) h += `<div class="info">${htmlCombatPanel()}</div>`;
  return h;
}

function htmlLocAct(i, a) {
  const z = ZONES[i], here = S.zone === i && S.activity === a;
  if (a === 'combat') {
    if (!zoneOpen(i)) {
      const prev = i > 0 && i < MAIN_ZONES && !S.bosses[i - 1] ? ENEMIES[ZONES[i - 1].boss].name : null;
      return `<p class="need">${prev ? `Defeat ${prev} and reach combat level ${z.req} to fight here.` : `Reach combat level ${z.req} to fight here (you are ${combatLevel()}).`}</p>`;
    }
    const ct = combatType();
    const mon = (id, boss) => {
      const d = ENEMIES[id], t = BEATS[ct] === d.type ? 1 : BEATS[d.type] === ct ? -1 : 0;
      const on = here && !boss && S.ctarget === id;
      return `<div class="item ${on ? 'on' : ''}"><div class="top"><span class="ic">${boss ? '👑' : TYPE_ICON[d.type]}</span>
        <span class="nm"><b>${d.name}</b> <span class="tag">Lv ${enemyLevel(d)}</span> <span class="tag ${t > 0 ? 'good' : t < 0 ? 'bad' : ''}">${TYPE_ICON[d.type]} ${TYPE_NAME[d.type]}${t > 0 ? ' · strong' : t < 0 ? ' · weak' : ''}</span>${onTask({ id }) ? ' <span class="tag good">💀 task</span>' : ''}<br>
        <small>❤️ ${fmt(d.hp)} · 💥 ${d.maxHit} max hit · 🛡️ ${d.def} defence · ${d.speed}s</small><br>
        <small>Drops: <span class="drops">🪙${dropIcons(d)}</span> · defeated ${fmt(S.kc[id] || 0)}</small></span></div>
        <div class="btns">${boss ? `<small>${S.bosses[i] ? '✔ Beaten · ' : ''}Appears after ${BOSS_EVERY} kills here (${S.zk[i]}/${BOSS_EVERY})</small>`
          : on ? '<button class="sel" disabled>⚔️ Fighting…</button>' : `<button data-a="fight" data-z="${i}" data-id="${id}">⚔️ Fight</button>`}</div></div>`;
    };
    const mixOn = here && !S.ctarget;
    return `<div class="grid">
      <div class="item ${mixOn ? 'on' : ''}"><div class="top"><span class="ic">🎲</span><span class="nm"><b>Fight everything</b><br><small>Meet whatever comes down the road here</small></span></div>
      <div class="btns">${mixOn ? '<button class="sel" disabled>⚔️ Fighting…</button>' : `<button data-a="fight" data-z="${i}" data-id="mix">⚔️ Fight</button>`}</div></div>`
      + [...new Set(z.enemies)].map(id => mon(id)).join('') + (z.boss ? mon(z.boss, true) : '') + '</div>';
  }
  if (GATHERING.includes(a)) {
    const names = locTiers(a, i).reduce((o, t) => (o[t] = tierName(a, t), o), {});
    const item = t => tierItem(a, t);
    const node = a === 'woodcutting' ? '🌳' : a === 'mining' ? '🪨' : '🐟';
    const cur = here ? (S.gsel.mining === -2 && a === 'mining' && z.ess ? 'ess' : chosenTier(a)) : null;
    let h = '<div class="grid">' + locTiers(a, i).map(t => {
      const locked = LV[a] < tierReq(a, t), on = cur === t;
      return `<div class="item ${on ? 'on' : ''}"><div class="top"><span class="ic">${node}</span>
        <span class="nm"><b><span class="tier" style="background:${tierColor(a, t)}"></span>${names[t]}</b><br>
        <small>${locked ? '🔒 ' : ''}${SKILLS[a].name} ${tierReq(a, t)} · ${gatherTime(a, t).toFixed(1)}s · ${tierXp(a, t)} XP · you have ${fmt(has(item(t)))}</small></span></div>
        <div class="btns">${on ? `<button class="sel" disabled>${SKILLS[a].icon} Working…</button>` : `<button data-a="gather" data-z="${i}" data-skill="${a}" data-id="${t}" ${locked ? 'disabled' : ''}>${SKILLS[a].icon} ${a === 'fishing' ? 'Fish' : a === 'mining' ? 'Mine' : 'Chop'}</button>`}</div></div>`;
    }).join('');
    if (a === 'mining' && z.ess) {
      const on = cur === 'ess';
      h += `<div class="item ${on ? 'on' : ''}"><div class="top"><span class="ic">🔹</span><span class="nm"><b>Rune Essence</b><br>
        <small>Mining 1 · ${(gatherTime('mining', 0) * ESSENCE_TIME / ORES[0].time).toFixed(1)}s · ${ESSENCE_XP} XP · for Runecrafting · you have ${fmt(has('essence'))}</small></span></div>
        <div class="btns">${on ? '<button class="sel" disabled>⛏️ Working…</button>' : `<button data-a="gather" data-z="${i}" data-skill="mining" data-id="-2">⛏️ Mine</button>`}</div></div>`;
    }
    return h + '</div>';
  }
  if (a === 'thieving') {
    const cur = here && R.ent && R.ent.kind === 'npc' ? R.ent.id : null;
    return '<div class="grid">' + z.npcs.map(id => {
      const n = NPCS[id], locked = LV.thieving < n.lvl, on = here && (S.tsel === id || (!S.tsel && cur === id));
      return `<div class="item ${on ? 'on' : ''}"><div class="top"><span class="ic">🥷</span>
        <span class="nm"><b>${n.name}</b> <span class="tag">Thieving ${n.lvl}</span><br>
        <small>${locked ? '🔒 ' : ''}${Math.round(stealChance(n) * 100)}% success · ${n.xp} XP · ${n.gold[0]}–${n.gold[1]} 🪙 · drops <span class="drops">${[...new Set(n.drops.map(d => ITEMS[d[0]].icon))].join('')}</span></small><br>
        <small>Getting caught stuns you for ${STUN_TIME}s and hits up to ${n.maxHit}</small></span></div>
        <div class="btns">${on ? '<button class="sel" disabled>🥷 Pickpocketing…</button>' : `<button data-a="thieve" data-z="${i}" data-id="${id}" ${locked ? 'disabled' : ''}>🥷 Pickpocket</button>`}</div></div>`;
    }).join('') + '</div>';
  }
  if (a === 'firemaking') {
    const t = fmTarget();
    return `<div class="item ${here ? 'on' : ''}"><div class="top"><span class="ic">🔥</span><span class="nm"><b>${STATION_NAME[a]}</b><br>
      <small>${t >= 0 ? `Burning ${S.fmSel < 0 ? 'your best logs' : LOG_N[S.fmSel]} · ${has('log' + t)} ${LOG_N[t]} left` : '<span class="need">No logs you can burn</span>'}</small></span></div>
      <div class="btns">${here ? '<button class="sel" disabled>🔥 Burning…</button>' : `<button data-a="station" data-z="${i}" data-id="firemaking">🔥 Burn logs here</button>`}
      <button data-tab="firemaking">Choose logs / bonfire</button></div></div>`;
  }
  // crafting station
  const detail = a === 'cooking'
    ? (cookTarget() >= 0 ? `Cooking ${S.cookSel < 0 ? 'your best fish' : FISH_N[S.cookSel]} · ${has('fish' + cookTarget())} raw fish` : '<span class="need">No raw fish to cook</span>')
    : (() => { const r = CRAFT[a].recipes[S.csel[a]]; return `Recipe: ${recipeCount(r) > 1 ? recipeCount(r) + '× ' : ''}${itemLabel(r.out)} · ${matsHtml(r.mats)}`; })();
  return `<div class="item ${here ? 'on' : ''}"><div class="top"><span class="ic">${actIcon(a)}</span><span class="nm"><b>${STATION_NAME[a]}</b><br><small>${detail}</small></span></div>
    <div class="btns">${here ? `<button class="sel" disabled>${actIcon(a)} Working…</button>` : `<button data-a="station" data-z="${i}" data-id="${a}">${actIcon(a)} Work here</button>`}
    <button data-tab="${a}">${a === 'cooking' ? 'Choose fish' : 'Choose recipe'}</button></div></div>`;
}

function htmlSkills() {
  return '<div class="grid">' + Object.entries(SKILLS).map(([k, sk]) => {
    const l = LV[k], xp = S.skills[k];
    const cur = XP_TABLE[l], nxt = l < 99 ? XP_TABLE[l + 1] : xp;
    const frac = l < 99 ? (xp - cur) / (nxt - cur) : 1;
    return `<div class="skill"><div class="top"><span>${sk.icon} ${sk.name}</span><span class="lv">${l} / 99</span></div>
      <div class="bar"><i style="width:${(frac * 100).toFixed(1)}%"></i></div>
      <small>${fmt(xp)} / ${fmt(nxt)} XP</small></div>`;
  }).join('') + '</div>';
}

let bagSub = 'items', craftSub = 'smithing', smithMetal = null;
function subNav(action, current, list) {
  return `<div class="chips sub">` + list.map(([id, label]) => `<button class="${current === id ? 'sel' : ''}" data-a="${action}" data-id="${id}">${label}</button>`).join('') + '</div>';
}
function itemStats(it) {
  return [it.heal && 'heals ' + it.heal, it.power && (it.slot ? `${TYPE_ICON[it.wtype]} power +${it.power}` : 'arrow power +' + it.power),
    it.armor && `${it.slot} armour +${it.armor}`, it.speed && it.slot && `${it.speed}s`, it.twoHanded && 'two-handed', it.note, it.req && 'Lv ' + it.req, it.bury && `bury: ${it.bury} Prayer XP`].filter(Boolean).join(' · ');
}
function htmlBag() {
  const nav = subNav('bagsub', bagSub, [['items', '🎒 Items'], ['shop', '🏪 Shop']]);
  if (bagSub === 'shop') return nav + htmlShop();
  const ids = Object.keys(S.inv);
  if (!ids.length) return nav + '<p class="muted">Your bag is empty. Go gather resources or fight!</p>';
  const groups = {};
  for (const id of ids) (groups[ITEMS[id].type] = groups[ITEMS[id].type] || []).push(id);
  const total = ids.reduce((a, id) => a + ITEMS[id].value * S.inv[id], 0);
  let h = nav + `<span class="muted">Total value: <b class="lg-gold">${fmt(total)}</b> gold</span>`;
  for (const g of ['Equipment', 'Ammo', 'Food', 'Bars', 'Ores', 'Resources', 'Misc']) {
    if (!groups[g]) continue;
    h += `<h3>${g}</h3><div class="grid">` + groups[g].sort().map(id => {
      const it = ITEMS[id];
      return `<div class="item"><div class="top"><span class="ic">${it.icon}</span><span class="nm">${itemLabel(id)}<br>
        <small>${it.value} 🪙${itemStats(it) ? ' · ' + itemStats(it) : ''}</small></span>
        <span class="ct">${fmt(S.inv[id])}</span></div>
        <div class="btns">${it.slot ? `<button data-a="equip" data-id="${id}" ${canEquip(id) ? '' : 'disabled'}>Equip</button>` : ''}
        ${it.bury ? `<button data-a="bury" data-id="${id}">Bury all</button>` : ''}
        <button data-a="sell" data-id="${id}" data-n="1">Sell 1</button>
        <button data-a="sell" data-id="${id}" data-n="999999">Sell all</button></div></div>`;
    }).join('') + '</div>';
  }
  return h;
}

function matsHtml(mats) {
  return Object.entries(mats).map(([id, n]) => `<span class="${has(id) >= n ? 'have' : 'need'}">${n}× ${ITEMS[id].name} (${has(id)})</span>`).join(', ');
}

function htmlCraft() {
  let h = subNav('craftsub', craftSub, [['smithing', '🔨 Smithing'], ['cooking', '🍳 Cooking'], ['fletching', '🪶 Fletching'], ['runecrafting', '🔮 Runecrafting'], ['firemaking', '🔥 Firemaking']]);
  if (craftSub === 'cooking') return h + htmlCooking();
  if (craftSub === 'firemaking') return h + htmlFiremaking();
  const sk = craftSub, c = CRAFT[sk];
  let list = c.recipes.map((r, i) => [r, i]);
  if (sk === 'smithing') {
    const cur = craftRecipe('smithing');
    if (smithMetal === null) smithMetal = cur.station === 'furnace' ? -1 : cur.metal;
    h += `<p class="muted">Smelt ores into bars at a 🔥 furnace, then hammer bars into gear at an 🔨 anvil – from Bronze all the way to Rune, like OSRS. Smithing level: <b>${LV.smithing}</b></p>`;
    h += subNav('metal', smithMetal, [[-1, '🔥 Smelt bars'], ...METALS.map((mn, m) => [m, `<span class="tier" style="background:${METAL_COLORS[m]}"></span>${mn}`])]);
    list = list.filter(([r]) => smithMetal === -1 ? r.station === 'furnace' : r.station === 'anvil' && r.metal === smithMetal);
    h += '<div class="grid">';
  } else h += `<p class="muted">Pick a recipe and your hero works at ${c.place} along the road (${c.time}s each), also while you are away. Better gear of the same kind is equipped automatically. ${SKILLS[sk].name} level: <b>${LV[sk]}</b></p><div class="grid">`;
  return h + list.map(([r, i]) => {
    const it = ITEMS[r.out], locked = LV[sk] < r.req, mx = maxCraft(r.mats), n = recipeCount(r);
    const active = S.activity === sk && S.csel[sk] === i;
    return `<div class="item"><div class="top"><span class="ic">${it.icon}</span><span class="nm">${n > 1 ? n + '× ' : ''}${itemLabel(r.out)}<br>
      <small>${itemStats(it) ? itemStats(it) + ' · ' : ''}${r.xp} XP · ${locked ? '🔒 ' : ''}${SKILLS[sk].name} ${r.req}${r.station ? ' · ' + (r.station === 'furnace' ? '🔥 furnace' : '🔨 anvil') : ''}</small></span></div>
      <small>${matsHtml(r.mats)}</small>
      <div class="btns">${active ? `<button class="sel" disabled>${SKILLS[sk].icon} Working…</button>`
        : `<button data-a="craft" data-skill="${sk}" data-id="${i}" ${locked ? 'disabled' : ''}>${c.verb}${mx ? ` (${mx})` : ''}</button>`}</div></div>`;
  }).join('') + '</div>';
}

function htmlFiremaking() {
  const auto = S.activity === 'firemaking' && S.fmSel < 0;
  let h = `<p class="muted">Burn logs at any campsite for Firemaking XP – sometimes the ashes leave Coal. A bonfire uses ${BONFIRE_LOGS} logs and gives every skill bonus XP for ${BONFIRE_TIME / 60} minutes.${S.bonfire ? ` <b>Bonfire burning: +${S.bonfire.pct}% XP, ${Math.ceil(S.bonfire.left / 60)} min left.</b>` : ''} Firemaking level: <b>${LV.firemaking}</b></p><div class="grid">
    <div class="item"><div class="top"><span class="ic">🔥</span><span class="nm">Best logs available<br><small>Always burns your best logs first</small></span></div>
    <div class="btns">${auto ? '<button class="sel" disabled>🔥 Burning…</button>' : '<button data-a="burn" data-id="-1">Burn</button>'}</div></div>`;
  for (let t = 0; t < 5; t++) {
    const locked = LV.firemaking < GATHER_REQ[t], n = has('log' + t), active = S.activity === 'firemaking' && S.fmSel === t;
    h += `<div class="item"><div class="top"><span class="ic">🪵</span><span class="nm">${itemLabel('log' + t)}<br>
      <small>${FM_XP[t]} XP · ${locked ? '🔒 ' : ''}Firemaking ${GATHER_REQ[t]} · bonfire +${BONFIRE_PCT[t]}% XP · you have ${fmt(n)}</small></span></div>
      <div class="btns">${active ? '<button class="sel" disabled>🔥 Burning…</button>' : `<button data-a="burn" data-id="${t}" ${locked ? 'disabled' : ''}>Burn</button>`}
      <button data-a="bonfire" data-id="${t}" ${locked || n < BONFIRE_LOGS || S.bonfire ? 'disabled' : ''}>🔥 Bonfire (${BONFIRE_LOGS})</button></div></div>`;
  }
  return h + '</div>';
}

function htmlCooking() {
  const auto = S.activity === 'cooking' && S.cookSel < 0;
  let h = `<p class="muted">Your hero cooks at campfires along the road (${COOK_TIME}s per fish), also while you are away. Cooked food heals you in combat. Cooking level: <b>${LV.cooking}</b></p><div class="grid">
    <div class="item"><div class="top"><span class="ic">🔥</span><span class="nm">Best fish available<br><small>Always cooks your best fish first</small></span></div>
    <div class="btns">${auto ? '<button class="sel" disabled>🍳 Cooking…</button>' : '<button data-a="cook" data-id="-1">Cook</button>'}</div></div>`;
  for (let t = 0; t < 5; t++) {
    const locked = LV.cooking < GATHER_REQ[t], n = has('fish' + t);
    const burn = burnChance(t), active = S.activity === 'cooking' && S.cookSel === t;
    h += `<div class="item"><div class="top"><span class="ic">🍽️</span><span class="nm">${itemLabel('cooked' + t)}<br>
      <small>Heals ${ITEMS['cooked' + t].heal} · ${GATHER_XP[t]} XP · ${locked ? '🔒 ' : ''}Cooking ${GATHER_REQ[t]}${locked ? '' : ' · burn chance ' + Math.round(burn * 100) + '%'}</small></span></div>
      <small><span class="${n ? 'have' : 'need'}">Raw ${FISH_N[t]}: ${n}</span></small>
      <div class="btns">${active ? '<button class="sel" disabled>🍳 Cooking…</button>' : `<button data-a="cook" data-id="${t}" ${locked ? 'disabled' : ''}>Cook</button>`}</div></div>`;
  }

function htmlQuests() {
  const by = st => QUESTS.filter(q => questState(q) === st);
  const card = q => {
    const st = questState(q), ready = questReady(q);
    let h = `<div class="item quest ${ready ? 'ready' : ''}"><div class="top"><span class="ic">${st === 'done' ? '✅' : ready ? '🎁' : '📜'}</span>
      <span class="nm"><b>${q.name}</b><br><small>${q.desc}</small></span></div>`;
    if (st !== 'done') h += q.obj.map((o, k) => {
      const need = objNeed(o), have = st === 'active' ? Math.max(0, objProgress(q, k)) : 0;
      return `<small>${objText(o)}: ${have} / ${need}</small><div class="bar"><i style="width:${(have / need * 100).toFixed(1)}%"></i></div>`;
    }).join('');
    h += `<small class="lg-gold">Reward: ${rewardText(q.rew)}</small>`;
    if (st === 'open') h += `<div class="btns"><button data-a="qstart" data-id="${q.id}">Start quest</button></div>`;
    if (ready) h += `<div class="btns"><button data-a="qclaim" data-id="${q.id}">🎁 Claim reward</button></div>`;
    return h + '</div>';
  };
  let h = `<p class="muted">Quests give gold, items and XP. Progress counts from the moment you start a quest. Completed: <b>${questsDone()} / ${QUESTS.length}</b></p>`;
  const active = by('active'), open = by('open'), done = by('done');
  if (active.length) h += '<h3>Active</h3><div class="grid">' + active.map(card).join('') + '</div>';
  if (open.length) h += '<h3>Available</h3><div class="grid">' + open.map(card).join('') + '</div>';

  const locked = by('locked').length;
  if (locked) h += `<p class="muted">${locked} more quest${locked > 1 ? 's' : ''} unlock as you finish these.</p>`;
  return h;
}

  }).join('') + '</div>';
  h += `<h3>Statistics</h3><div class="info stats">
    <span>Distance walked <b>${fmt(S.dist)} m</b></span><span>Enemies defeated <b>${fmt(S.kills)}</b></span>
    <span>Deaths <b>${fmt(S.deaths)}</b></span><span>Bosses beaten <b>${S.bosses.filter(Boolean).length} / 5</b></span>
    <span>Road finds <b>${fmt(S.stats.events)}</b></span><span>Items smithed <b>${fmt(S.stats.smithed)}</b></span>
    <span>Fish cooked <b>${fmt(S.stats.cooked)}</b></span><span>Total level <b>${totalLevel()}</b></span>
    <span>Fletched <b>${fmt(S.stats.fletched)}</b></span><span>Runes crafted <b>${fmt(S.stats.rc)}</b></span>
    <span>Bones buried <b>${fmt(S.stats.buried)}</b></span><span>Slayer tasks <b>${fmt(S.stats.tasks)}</b></span>
    <span>Pickpockets <b>${fmt(S.stats.stolen)}</b></span><span>Logs burned <b>${fmt(S.stats.burned)}</b></span>
    <span>Quests <b>${questsDone()} / ${QUESTS.length}</b></span><span>Journeys <b>${S.journeys}</b></span></div>`;
  const done = ACH.filter(a => S.ach[a.id]).length;
  h += `<h3>Achievements · ${done} / ${ACH.length}</h3><div class="grid">` + ACH.map(a => `
    <div class="item ach ${S.ach[a.id] ? 'done' : ''}"><div class="top"><span class="ic">${S.ach[a.id] ? '🏆' : '🔒'}</span>

function nextGoal() {
  const ownsAny = pre => Object.keys(S.inv).some(id => id.startsWith(pre));
  if (!S.equip.weapon) {
    const w = Object.keys(S.inv).find(id => ITEMS[id].slot === 'weapon' && canEquip(id));
    if (w) return { t: `Equip your ${ITEMS[w].name}`, tab: 'inventory' };
    if (has('bar0')) return { t: S.activity === 'smithing' ? 'Your hero is smithing…' : 'Smith a Bronze Dagger at the 🔨 anvil', tab: 'smithing' };
    if (!has('ore_copper')) return { t: 'Mine Copper Ore in the Green Meadow (Map → ⛏️ Mining)', tab: 'activity' };
    if (!has('ore_tin')) return { t: 'Mine Tin Ore too – bronze needs both', tab: 'activity' };
    return { t: S.activity === 'smithing' ? 'Your hero is smelting a Bronze Bar…' : 'Smelt a Bronze Bar at the 🔥 furnace', tab: 'smithing' };
  }
  if (R.ent && R.ent.blocked) {
    if (S.activity === 'firemaking') return { t: 'No logs to burn – go 🪓 Woodcutting', tab: 'activity' };
    return S.activity === 'cooking' ? { t: 'No fish to cook – go 🎣 Fishing', tab: 'activity' }
      : { t: `Out of materials for ${ITEMS[CRAFT[S.activity].recipes[S.csel[S.activity]].out].name} – gather more or pick another recipe`, tab: S.activity };
  }
  if (S.activity === 'combat' && attackMode() === 'unarmed' && wtype() !== 'melee')
    return { t: wtype() === 'ranged' ? 'Out of arrows – fletch or buy more' : 'Out of runes – craft or buy more', tab: wtype() === 'ranged' ? 'fletching' : 'runecrafting' };
  const ready = QUESTS.find(q => questReady(q));
  if (ready) return { t: `Quest "${ready.name}" is complete – claim your reward`, tab: 'quests' };
  const upg = Object.keys(S.inv).find(id => ITEMS[id].slot && isUpgrade(id));
  if (upg) return { t: `Equip your ${ITEMS[upg].name}`, tab: 'inventory' };
  if (foodCount() < 5) {
    const raw = [0, 1, 2, 3, 4].some(t => has('fish' + t) && LV.cooking >= GATHER_REQ[t]);
    return raw ? { t: 'Low on food – cook your fish', tab: 'cooking' } : { t: 'Low on food – go 🎣 Fishing, or buy Bread', tab: 'activity' };
  }
  const best = bestZone();
  if (S.activity === 'combat' && S.zone < best) return { t: `${ZONES[best].name} is open – travel there`, tab: 'activity' };
  if (!questsDone() && !Object.keys(S.quests).length) return { t: 'Open 📜 Quests and start "First Steps"', tab: 'quests' };
  if (!S.bosses[best]) return { t: `Defeat ${ENEMIES[ZONES[best].boss].name} in ${ZONES[best].name} (appears after ${BOSS_EVERY} kills: ${S.zk[best]}/${BOSS_EVERY})`, tab: 'activity' };
  const nz = best + 1;
  if (nz < MAIN_ZONES) return { t: `Reach combat level ${ZONES[nz].req} to enter ${ZONES[nz].name} (now ${combatLevel()})`, tab: 'skills' };
  if (!S.task) return { t: 'Get a 💀 Slayer task for Slayer XP and coins', tab: 'slayer' };
  return { t: `You beat the Dragon! Start a 🌟 New Journey for ${renownGain()} Renown`, tab: 'progress' };
}
let lastGoal = '';
function renderGoal() {
  checkAch();
  const g = nextGoal();
  const html = `<b>🎯 Goal</b><span>${g.t}</span>`;
  const el = document.getElementById('goal');
  if (html !== lastGoal) { el.innerHTML = html; lastGoal = html; }
  el.dataset.goto = g.tab;
  const alerts = {
    craft: !CRAFTING.has(S.activity) && (Object.keys(CRAFT).some(sk => CRAFT[sk].recipes.some((r, i) => canCraft(sk, i) && ITEMS[r.out].slot && isUpgrade(r.out)))
      || [0, 1, 2, 3, 4].some(t => has('fish' + t) >= 10 && LV.cooking >= GATHER_REQ[t])),
    inventory: Object.keys(S.inv).some(id => (ITEMS[id].slot && isUpgrade(id)) || (ITEMS[id].bury && has(id) >= 10))
      || ['axe', 'pick', 'rod'].some(t => S.tools[t] < 4 && S.gold >= TOOL_COST[S.tools[t]]),
    slayer: !S.task && combatLevel() >= 5,
    quests: QUESTS.some(q => questReady(q) || questState(q) === 'open'),
    progress: S.bosses[4] || Object.keys(RUP).some(k => S.rup[k] < RUP[k].max && S.renown >= rupCost(k)),
  };
  document.querySelectorAll('nav.tabs [data-tab]').forEach(b => b.classList.toggle('alert', !!alerts[b.dataset.tab] && b.dataset.tab !== tab));
}
// old tab names (used by goals and buttons) map to a tab plus its sub-view
const TAB_ALIAS = { firemaking: ['craft', 'firemaking'], smithing: ['craft', 'smithing'], cooking: ['craft', 'cooking'], fletching: ['craft', 'fletching'], runecrafting: ['craft', 'runecrafting'], shop: ['inventory', 'shop'] };
function openTab(name, scroll) {
  const al = TAB_ALIAS[name];
  if (al) { name = al[0]; if (name === 'craft') craftSub = al[1]; else bagSub = al[1]; }
  else if (name === 'craft' && CRAFTING.has(S.activity)) craftSub = S.activity;
  if (name === 'activity' && tab !== 'activity') { mapSel = null; mapAct = null; }
  tab = name;
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('sel', b.dataset.tab === name));
  renderTab(true);
  if (scroll && window.innerWidth < 700) {
    // bring the tab's content up just under the sticky game view
    const top = $('#tab-content').getBoundingClientRect().top + window.scrollY - $('#stage').offsetHeight - 6;
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
}

function renderLog() {

document.addEventListener('click', ev => {
  const tb = ev.target.closest('[data-tab]');
  if (tb) { openTab(tb.dataset.tab, true); return; }
  const goal = ev.target.closest('#goal');
  if (goal) { openTab(goal.dataset.goto, true); return; }
  const b = ev.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const id = b.dataset.id, n = +b.dataset.n || 1;
  switch (b.dataset.a) {
    case 'activity': setActivity(id); break;
    case 'zone': setZone(+id); break;
    case 'style': S.styles[combatType()] = id; break;
    case 'spell': S.spell = +id; break;
    case 'prayer': togglePrayer(id); break;
    case 'autobury': S.autoBury = b.checked; break;
    case 'bury': bury(id, has(id)); break;
    case 'bagsub': bagSub = id; break;
    case 'craftsub': craftSub = id; break;
    case 'craft': S.csel[b.dataset.skill] = +id; if (S.activity === b.dataset.skill) resetEncounter(); else setActivity(b.dataset.skill); break;
    case 'metal': smithMetal = +id; break;
    case 'buy': buy(+id, n); break;
    case 'newtask': newTask(); break;
    case 'taskskip': skipTask(); break;
    case 'tasktravel': if (S.task && zoneOpen(S.task.zone)) { S.ctarget = S.task.id; travel(S.task.zone, 'combat'); resetEncounter(); openTab('activity', true); } break;
    case 'autoslayer': S.autoSlayer = b.checked; break;
    case 'slayerbuy': buySlayer(+id); break;
    case 'qstart': startQuest(id); break;
    case 'qclaim': claimQuest(id); break;
    case 'thieve': S.tsel = id; travel(+b.dataset.z, 'thieving'); resetEncounter(); break;
    case 'burn': S.fmSel = +id; if (S.activity === 'firemaking') resetEncounter(); else setActivity('firemaking'); break;
    case 'bonfire': lightBonfire(+id); break;
    case 'pet': if (S.pets[id]) S.pet = id; break;
    case 'loc': mapSel = +id; mapAct = null; break;
    case 'mapact': mapAct = id; break;
    case 'fight': S.ctarget = id === 'mix' ? null : id; travel(+b.dataset.z, 'combat'); resetEncounter(); break;
    case 'gather': S.gsel[b.dataset.skill] = +id; travel(+b.dataset.z, b.dataset.skill); resetEncounter(); break;
    case 'station': travel(+b.dataset.z, id); break;
    case 'sell': sell(id, n); break;
    case 'equip': equip(id); break;
    case 'unequip': unequip(id); break;
    case 'cook': S.cookSel = +id; setActivity('cooking'); break;
    case 'tool': buyTool(id); break;
    case 'rup': buyRup(id); break;
    case 'gtier': S.gsel[S.activity] = +id; resetEncounter(); break;
    case 'mute': S.muted = !S.muted; b.textContent = S.muted ? '🔇' : '🔊'; break;
    case 'gfx': S.gfx = G3.on ? '2d' : '3d'; applyGfx(); save(); break;
    case 'export': {
      const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
      openModal(`<h2>📤 Export save</h2><p class="muted">Copy this code and keep it somewhere safe, or paste it into the game on another device.</p>
        <textarea id="save-code" readonly>${code}</textarea>
        <div class="row" style="margin-top:10px"><button data-a="copy">Copy code</button><button data-a="close">Close</button></div>`);
      break;
    }
    case 'copy': {
      const ta = document.getElementById('save-code');
      const fallback = () => { ta.select(); b.textContent = 'Selected – copy it'; };
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => { b.textContent = 'Copied ✓'; }, fallback); else fallback();
      break;
    }
    case 'import':
      openModal(`<h2>📥 Import save</h2><p class="muted">Paste a save code. This replaces your current progress.</p>
        <textarea id="import-code" placeholder="Paste your code here"></textarea>
        <p class="need" id="import-err" hidden>That code doesn't look like an Endless Road save. Check that you copied all of it.</p>
        <div class="row" style="margin-top:10px"><button data-a="import-yes">Load save</button><button data-a="close">Cancel</button></div>`);
      break;
    case 'import-yes': {
      let data = null;
      try { data = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('import-code').value.trim())))); } catch (e) { data = null; }
      if (!data || data.v !== 1 || !data.skills) { document.getElementById('import-err').hidden = false; return; }
      applySave(data); R.phase = 'walk'; R.ent = null; R.events = [];
      save(); closeModal(); log('📥 Save imported.', 'lg-good'); openTab('activity');
      break;
    }
    case 'journey':
      openModal(`<h2>🌟 Start a New Journey?</h2>
        <p>Your skills, items, gold and zones reset to the start. You earn <b>${renownGain()} Renown</b> and keep achievements, Renown and upgrades.</p>
        <div class="row"><button data-a="journey-yes">Begin the journey</button><button data-a="close">Not yet</button></div>`);
      break;
    case 'journey-yes': newJourney(); closeModal(); openTab('activity'); break;
    case 'save': save(); log('💾 Game saved.'); break;
    case 'close': closeModal(); break;
    case 'reset':
      openModal(`<h2>Start over?</h2><p>All progress will be permanently deleted.</p>
        <div class="row"><button data-a="reset-yes">Yes, delete</button><button data-a="close">Cancel</button></div>`);
      break;
    case 'reset-yes':
      S = newState(); recalcLevels(); recalcBonuses(); R.phase = 'walk'; R.ent = null; R.worldX = 0; R.rested = 0;
      logLines = []; renderLog(); save(); closeModal(); log('A new journey begins!');
      break;
  }
  uiDirty = true;
  renderTab(); renderHero();
});

function canvasPoint(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
}
function eventAt(p, slop) {
  return R.events.find(ev => { const q = evScreen(ev); return Math.hypot(q.x - p.x, q.y - p.y) < slop; });
}
canvas.addEventListener('pointerdown', ev => {
  const hit = eventAt(canvasPoint(ev), ev.pointerType === 'mouse' ? 36 : 54);
  if (hit) { collectEvent(hit); ev.preventDefault(); }
});
canvas.addEventListener('pointermove', ev => {
  if (ev.pointerType === 'mouse') canvas.style.cursor = eventAt(canvasPoint(ev), 36) ? 'pointer' : '';
});

/* ================= LOOP ================= */

let lastFrame = performance.now(), lastWall = Date.now(), uiTimer = 0, saveTimer = 0;
// fast-forward time the page was not running; the wall clock keeps counting while a phone sleeps
function catchUp(sec) {
  const before = snapshot();
  const done = simulate(sec);
  if (done > 600) R.rested = Math.min(1800, done * 0.1);
  if (done > 60) showOfflineSummary(done, before);
  uiDirty = true;
}
function frame(now) {
  let dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  const wall = Date.now(), gap = (wall - lastWall) / 1000;
  lastWall = wall;
  if (gap > 2) catchUp(gap);
  else if (R.freeze > 0) R.freeze -= dt;   // hit-stop
  else tick(dt);
  draw();
  uiTimer += dt; saveTimer += dt;
  if (uiTimer > 0.25) { uiTimer = 0; renderHero(); renderGoal(); if (uiDirty) { uiDirty = false; renderTab(); } }
  if (saveTimer > 10) { saveTimer = 0; save(); }
  requestAnimationFrame(frame);
}

function init() {
  resizeCanvas();
  window.addEventListener('resize', () => { resizeCanvas(); drawMap(); });
  load();
  const away = (Date.now() - (S.last || Date.now())) / 1000;
  if (away > 60) catchUp(away);
  log('Welcome! Your hero sets off on the endless road.');
  $('#mute').textContent = S.muted ? '🔇' : '🔊';
  applyGfx();
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && !navigator.standalone && !S.tipA2HS && location.protocol === 'https:' && !/claude/.test(location.hostname)) {
    S.tipA2HS = true;
    log('📱 Tip: tap Share → Add to Home Screen to play full screen and keep your save safe.', 'lg-xp');
  }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* not supported */ }
  // the installed app stays upright where the browser allows it (Android); iOS uses the manifest and the rotate notice
  try { if (screen.orientation && screen.orientation.lock && navigator.standalone !== false) screen.orientation.lock('portrait').catch(() => {}); } catch (e) { /* not supported */ }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  // browsers only allow sound after the first tap
  window.addEventListener('pointerdown', unlockAudio, { passive: true });
  renderTab(true); renderHero(); renderGoal();
  window.addEventListener('pagehide', save);   // iOS Safari does not fire beforeunload
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  requestAnimationFrame(t => { lastFrame = t; lastWall = Date.now(); requestAnimationFrame(frame); });
}
init();
</script>
</body>
