/* --- chat: live through Supabase Realtime --- */
const CHAT = { open: false, tab: 'log', loaded: false, msgs: [], unread: 0, chan: null };
async function chatStart() {
  if (!sb || CHAT.loaded) return;
  CHAT.loaded = true;
  try {
    const { data } = await sb.from('chat_messages').select('id,name,body,created_at').order('created_at', { ascending: false }).limit(40);
    CHAT.msgs = (data || []).reverse();
    CHAT.chan = sb.channel('chat-global').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, pl => {
      if (CHAT.msgs.some(m => m.id === pl.new.id)) return;
      CHAT.msgs.push(pl.new); if (CHAT.msgs.length > 80) CHAT.msgs.shift();
      if (!CHAT.open) CHAT.unread++;
      renderChat();
    }).subscribe();
  } catch (e) { CHAT.loaded = false; }
  renderChat();
}
function renderChat() {
  const el = document.getElementById('chatlist'), badge = document.getElementById('chat-new');
  if (badge) { badge.hidden = !CHAT.unread; badge.textContent = CHAT.unread; }
  if (!el) return;
  if (!sb) { el.innerHTML = '<div class="muted">Chat needs a connection to the server.</div>'; return; }
  el.innerHTML = CHAT.msgs.map(m => `<div><span class="muted">${new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span> <b class="${me && m.name === me.name ? 'lg-gold' : ''}">${esc(m.name)}:</b> ${esc(m.body)}</div>`).join('')
    || '<div class="muted">No messages yet – say hello!</div>';
  el.scrollTop = el.scrollHeight;
  const inp = document.getElementById('chat-input');
  if (inp) { inp.disabled = !me; inp.placeholder = me ? 'Say something…' : 'Log in to chat'; }
}
async function chatSend() {
  const inp = document.getElementById('chat-input'), body = inp.value.trim();
  if (!body || !me) return;
  inp.value = '';
  try {
    const { data, error } = await sb.rpc('chat_send', { p_body: body });
    if (error || !data.ok) { inp.value = body; log(`💬 ${error ? 'Could not send' : data.reason}`, 'lg-bad'); }
  } catch (e) { inp.value = body; }
}
function logTab(which) {
  CHAT.tab = which; CHAT.open = which === 'chat';
  for (const id of ['log', 'chat', 'friends', 'clan']) document.getElementById(id).hidden = id !== which;
  document.querySelectorAll('.logtabs button').forEach(b => b.classList.toggle('sel', b.dataset.id === which));
  if (CHAT.open) { CHAT.unread = 0; chatStart(); }
  renderChat(); renderFriends(); renderClan();
}

/* ================= 3D VIEW (OSRS look) ================= */
// The game still plays on the 2D road: world x in pixels, the ground line at GY. The 3D camera looks
// straight down -z, so every point on the road plane (z = 0) lands exactly where the 2D overlay

const U3 = 40;   // pixels per 3D unit on the road plane

  const chunks = new Map();

      return `<small>${objText(o)}: ${have} / ${need}</small><div class="bar"><i style="width:${(have / need * 100).toFixed(1)}%"></i></div>`;
    }).join('');

    if (st === 'open') h += `<div class="btns"><button data-a="qstart" data-id="${q.id}">Start quest</button></div>`;
    if (ready) h += `<div class="btns"><button data-a="qclaim" data-id="${q.id}">🎁 Claim reward</button></div>`;
    return h + '</div>';
  };
  let h = nav + `<p class="muted">Quests give gold, items and XP, and open the boss lairs. Kills count from the moment you start a quest; items you bring are handed over when you claim it. Completed: <b>${questsDone()} / ${QUESTS.length}</b></p>`;
  const active = by('active'), open = by('open'), done = by('done');
  if (active.length) h += '<h3>Active</h3><div class="grid">' + active.map(card).join('') + '</div>';
  if (open.length) h += '<h3>Available</h3><div class="grid">' + open.map(card).join('') + '</div>';
  if (done.length) h += '<h3>Completed</h3><div class="grid">' + done.map(card).join('') + '</div>';
  const locked = by('locked').length;
  if (locked) h += `<p class="muted">${locked} more quest${locked > 1 ? 's' : ''} unlock as you finish these.</p>`;
  return h;
}

function nextGoal() {
  const ownsAny = pre => Object.keys(S.inv).some(id => id.startsWith(pre));
  if (!S.equip.weapon) {
    const w = Object.keys(S.inv).find(id => ITEMS[id].slot === 'weapon' && canEquip(id));
    if (w) return { t: `Equip your ${ITEMS[w].name}`, tab: 'inventory' };
    if (has('bar0')) return { t: S.activity === 'smithing' ? 'Your hero is smithing…' : 'Smith a Bronze Dagger at the 🔨 anvil', tab: 'smithing' };
    if (!has('ore_copper')) return { t: 'Mine Copper Ore in the Green Meadow (Map → ⛏️ Mining)', tab: 'activity' };
    if (!has('ore_tin')) return { t: 'Mine Tin Ore too – bronze needs both', tab: 'activity' };
    return { t: S.activity === 'smithing' ? 'Your hero is smelting a Bronze Bar…' : 'Smelt a Bronze Bar at the 🔥 furnace', tab: 'smithing' };
  }
  if (R.ent && R.ent.blocked) {
    if (S.activity === 'firemaking') return { t: 'No logs to burn – go 🪓 Woodcutting', tab: 'activity' };
    if (S.activity === 'farming') return { t: 'Build a 🌱 Garden at home and get seeds', tab: 'activity' };
    return S.activity === 'cooking' ? { t: 'No fish to cook – go 🎣 Fishing', tab: 'activity' }
      : { t: `Out of materials for ${ITEMS[CRAFT[S.activity].recipes[S.csel[S.activity]].out].name} – gather more or pick another recipe`, tab: S.activity };
  }
  if (S.activity === 'combat' && attackMode() === 'unarmed' && wtype() !== 'melee')
    return { t: wtype() === 'ranged' ? 'Out of arrows – fletch or buy more' : 'Out of runes – craft or buy more', tab: wtype() === 'ranged' ? 'fletching' : 'runecrafting' };
  const ready = QUESTS.find(q => questReady(q));
  if (ready) return { t: `Quest "${ready.name}" is complete – claim your reward`, tab: 'quests' };
  const upg = Object.keys(S.inv).find(id => ITEMS[id].slot && isUpgrade(id));
  if (upg) return { t: `Equip your ${ITEMS[upg].name}`, tab: 'inventory' };
  if (foodCount() < 5) {
    const raw = [0, 1, 2, 3, 4].some(t => has('fish' + t) && LV.cooking >= GATHER_REQ[t]);
    return raw ? { t: 'Low on food – cook your fish', tab: 'cooking' } : { t: 'Low on food – go 🎣 Fishing, or buy Bread', tab: 'activity' };
  }
  const best = bestZone();
  if (S.activity === 'combat' && S.zone < best) return { t: `${ZONES[best].name} is open – travel there`, tab: 'activity' };
  if (!questsDone() && !Object.keys(S.quests).length) return { t: 'Open 📜 Quests and start "First Steps"', tab: 'quests' };
  if (!S.bosses[best]) {
    const b = bossOf(ZONES[best].boss), q = QUESTS.find(x => x.id === b.quest), st = questState(q), bn = ENEMIES[b.id].name;
    if (bossOpen(b)) return { t: S.ctarget === b.id ? `Defeat ${bn} in its lair` : `Enter ${bn}'s lair (Map → ${ZONES[best].name} → ⚔️ Combat)`, tab: 'activity' };
    if (st === 'active') return { t: `Finish the quest "${q.name}" to open ${bn}'s lair`, tab: 'quests' };
    if (st === 'open') return { t: `Start the quest "${q.name}" – it opens ${bn}'s lair`, tab: 'quests' };
    return { t: `Finish your quests to unlock "${q.name}"`, tab: 'quests' };
  }
  const nz = best + 1;
  if (nz < MAIN_ZONES) return { t: `Reach combat level ${ZONES[nz].req} to enter ${ZONES[nz].name} (now ${combatLevel()})`, tab: 'skills' };
  if (!S.task) return { t: 'Get a 💀 Slayer task for Slayer XP and coins', tab: 'slayer' };
  return { t: `You beat the Dragon! Start a 🌟 New Journey for ${renownGain()} Renown`, tab: 'progress' };
}

// old tab names (used by goals and buttons) map to a tab plus its sub-view
const TAB_ALIAS = { firemaking: ['craft', 'firemaking'], smithing: ['craft', 'smithing'], cooking: ['craft', 'cooking'], fletching: ['craft', 'fletching'], runecrafting: ['craft', 'runecrafting'], herblore: ['craft', 'herblore'], construction: ['craft', 'construction'], summoning: ['craft', 'summoning'], shop: ['inventory', 'shop'] };
function openTab(name, scroll) {
  const al = TAB_ALIAS[name];
  const lk = al ? lockFor(al[0], al[1]) || lockFor(al[0]) : lockFor(name);
  if (lk) { lockedMsg(lk); return; }
  freshTabs.delete(al ? al[0] : name);
  if (al) { name = al[0]; if (name === 'craft') craftSub = al[1]; else bagSub = al[1]; }
  else if (name === 'craft' && CRAFTING.has(S.activity) && !lockFor('craft', S.activity)) craftSub = S.activity;
  if (name === 'activity' && tab !== 'activity') { mapSel = null; mapAct = null; }
  tab = name;
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('sel', b.dataset.tab === name));
  renderTab(true);
  if (scroll && window.innerWidth < 700) {
    // bring the tab's content up just under the sticky game view
    const top = $('#tab-content').getBoundingClientRect().top + window.scrollY - $('#stage').offsetHeight - 6;
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
}

    }
    case 'import':
      openModal(`<h2>📥 Import save</h2><p class="muted">Paste a save code. This replaces your current progress.</p>
        <textarea id="import-code" placeholder="Paste your code here"></textarea>
        <p class="need" id="import-err" hidden>That code doesn't look like an Endless Road save. Check that you copied all of it.</p>
        <div class="row" style="margin-top:10px"><button data-a="import-yes">Load save</button><button data-a="close">Cancel</button></div>`);
      break;
    case 'import-yes': {
      let data = null;
      try { data = JSON.parse(decodeURIComponent(escape(atob(document.getElementById('import-code').value.trim())))); } catch (e) { data = null; }
      if (!data || data.v !== 1 || !data.skills) { document.getElementById('import-err').hidden = false; return; }
      applySave(data); R.phase = 'walk'; R.ent = null; R.events = [];
      save(); closeModal(); log('📥 Save imported.', 'lg-good'); openTab('activity');
      break;
    }
    case 'journey':
      openModal(`<h2>🌟 Start a New Journey?</h2>
        <p>Your skills, items, gold and zones reset to the start. You earn <b>${renownGain()} Renown</b> and keep achievements, Renown and upgrades.</p>
        <div class="row"><button data-a="journey-yes">Begin the journey</button><button data-a="close">Not yet</button></div>`);
      break;
    case 'journey-yes': newJourney(); closeModal(); openTab('activity'); break;
    case 'save': save(); log('💾 Game saved.'); break;
    case 'close': closeModal(); break;
    case 'reset':
      openModal(`<h2>Start over?</h2><p>All progress will be permanently deleted.</p>
        <div class="row"><button data-a="reset-yes">Yes, delete</button><button data-a="close">Cancel</button></div>`);
      break;
    case 'reset-yes':
      S = newState(); recalcLevels(); recalcBonuses(); R.phase = 'walk'; R.ent = null; R.worldX = 0; R.rested = 0;
      logLines = []; renderLog(); save(); closeModal(); log('A new journey begins!');
      break;
  }
  uiDirty = true;
  renderTab(); renderHero();
});

function canvasPoint(ev) {
  const r = canvas.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
}
function eventAt(p, slop) {
  return R.events.find(ev => { const q = evScreen(ev); return Math.hypot(q.x - p.x, q.y - p.y) < slop; });
}
canvas.addEventListener('pointerdown', ev => {
  const hit = eventAt(canvasPoint(ev), ev.pointerType === 'mouse' ? 36 : 54);
  if (hit) { collectEvent(hit); ev.preventDefault(); }
});
canvas.addEventListener('pointermove', ev => {
  if (ev.pointerType === 'mouse') canvas.style.cursor = eventAt(canvasPoint(ev), 36) ? 'pointer' : '';
});

/* ================= LOOP ================= */

let lastFrame = performance.now(), lastWall = Date.now(), uiTimer = 0, saveTimer = 0;
// fast-forward time the page was not running; the wall clock keeps counting while a phone sleeps
function catchUp(sec) {
  if (S.wild.in) leaveWild('You logged out');
  const before = snapshot();
  const done = simulate(sec);
  if (done > 600) R.rested = Math.min(1800, done * 0.1);
  if (done > 60) showOfflineSummary(done, before);
  uiDirty = true;
}
function frame(now) {
  let dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  const wall = Date.now(), gap = (wall - lastWall) / 1000;
  lastWall = wall;
  if (gap > 2) catchUp(gap);
  else if (R.freeze > 0) R.freeze -= dt;   // hit-stop
  else tick(dt);
  draw();
  uiTimer += dt; saveTimer += dt;
  if (uiTimer > 0.25) { uiTimer = 0; renderHero(); renderGoal(); if (uiDirty) { uiDirty = false; renderTab(); } }
  if (saveTimer > 10) { saveTimer = 0; save(); }
  if (me && (NET.timer += dt) > 60) { NET.timer = 0; netSync(); }
  requestAnimationFrame(frame);
}

function init() {
  resizeCanvas();
  window.addEventListener('resize', () => { resizeCanvas(); drawMap(); });
  load();
  const away = (Date.now() - (S.last || Date.now())) / 1000;
  if (away > 60) catchUp(away);
  log('Welcome! Your hero sets off on the endless road.');
  $('#mute').textContent = S.muted ? '🔇' : '🔊';
  applyGfx();
  const ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && !navigator.standalone && !S.tipA2HS && location.protocol === 'https:' && !/claude/.test(location.hostname)) {
    S.tipA2HS = true;
    log('📱 Tip: tap Share → Add to Home Screen to play full screen and keep your save safe.', 'lg-xp');
  }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { /* not supported */ }
  // the installed app stays upright where the browser allows it (Android); iOS uses the manifest and the rotate notice
  try { if (screen.orientation && screen.orientation.lock && navigator.standalone !== false) screen.orientation.lock('portrait').catch(() => {}); } catch (e) { /* not supported */ }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  // browsers only allow sound after the first tap
  window.addEventListener('pointerdown', unlockAudio, { passive: true });
  renderTab(true); renderHero(); renderGoal();
  window.addEventListener('pagehide', save);   // iOS Safari does not fire beforeunload
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); netSync(); } });
  netInit();
  document.addEventListener('change', ev => { if (ev.target.id === 'ge-item') geHint(document.querySelector('#modal [data-a="geplace"]').dataset.id); });
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter') return;
    if (ev.target.id === 'chat-input') { ev.preventDefault(); chatSend(); }
    else if (ev.target.id === 'pm-input') { ev.preventDefault(); pmSend(); }
    else if (ev.target.id === 'fr-name') { ev.preventDefault(); friendAdd(); }
    else if (ev.target.id === 'cl-input') { ev.preventDefault(); clanSay(); }
  });
  requestAnimationFrame(t => { lastFrame = t; lastWall = Date.now(); requestAnimationFrame(frame); });
}
init();
</script>
