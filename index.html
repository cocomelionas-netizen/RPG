<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Endless Road">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Endless Road</title>
<style>
  :root {
    --bg: #14121c;
    --panel: #1f1c2b;
    --panel2: #2a2639;
    --line: #3a3550;
    --text: #e9e6f2;
    --muted: #9d97b3;
    --accent: #f2c94c;
    --good: #6fd27a;
    --bad: #e86a6a;
    --xp: #6aa8ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  html, body { overscroll-behavior: none; }
  #view, button, nav, #goal, header { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body.modal-open { overflow: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
    padding-top: max(10px, env(safe-area-inset-top));
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
  #mute, #gfx { padding: 2px 8px; min-height: 0; font-size: 16px; line-height: 1.2; }
  #gfx { font-size: 12px; font-weight: 700; margin-left: 6px; }
  header .stat { color: var(--muted); display: inline-block; }
  header .stat b { color: var(--text); }
  #gold b { color: var(--accent); }
  #renown b { color: #d9c0ff; }
  .ach { border: 1px solid transparent; }
  .ach.done { border-color: #6b5a24; background: #2e2a1c; }
  .ach:not(.done) { opacity: .62; }
  .ach .bonus { color: var(--good); font-size: 12px; }
  .bonuses { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 12px 16px; }
  #view {
    position: relative; width: 100%; aspect-ratio: 3 / 1; overflow: hidden;
    border-radius: 10px; border: 1px solid var(--line); background: #000;
  }
  #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #scene3d { display: none; }
  #view.g3 #scene3d { display: block; }
  #stage { position: relative; }
  #goal {
    margin-top: 8px; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    background: #2b2540; border: 1px solid #4a3f6e; display: flex; gap: 8px; align-items: center;
  }
  #goal b { color: var(--accent); white-space: nowrap; }
  #ticker { display: none; }
  #toast {
    position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); z-index: 3; pointer-events: none;
    padding: 8px 16px; border-radius: 12px; background: rgba(20, 16, 32, 0.88); border: 1px solid #6b5a24;
    color: var(--accent); font-weight: 800; font-size: 18px; text-align: center; max-width: 92%;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5); animation: toastIn 0.25s ease-out;
  }
  @keyframes toastIn { from { transform: translate(-50%, -50%) scale(1.25); opacity: 0; } }
  @media (max-width: 700px) { #toast { font-size: 15px; top: 30%; } }
  nav.tabs button.alert { position: relative; }
  nav.tabs button.alert::after {
    content: ''; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent);
  }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 12px; margin-top: 12px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  nav.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
  nav.tabs button { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 6px; }
  #tab-content { padding: 12px; min-height: 260px; }
  button {
    font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #5a5378; background: #332e46; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.sel { border-color: var(--accent); background: #3a3320; }
  h3 { margin: 14px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  h3:first-child { margin-top: 0; }
  .acts, .zones { display: grid; gap: 8px; }
  .acts { grid-template-columns: repeat(3, 1fr); }
  .zones { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .act, .zone { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 10px; }
  .act .big { font-size: 22px; }
  .zone .boss { color: var(--accent); }
  #scene { touch-action: manipulation; }
  small, .muted { color: var(--muted); font-size: 12px; }
  .info { background: var(--panel2); border-radius: 8px; padding: 10px; margin-top: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .item { background: var(--panel2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .item .top { display: flex; align-items: center; gap: 8px; }
  .item .ic { font-size: 20px; width: 26px; text-align: center; }
  .item .nm { flex: 1; }
  .item .ct { font-weight: 700; }
  .item .btns { display: flex; gap: 4px; flex-wrap: wrap; }
  .item .btns button { padding: 3px 8px; font-size: 12px; }
  .tier { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .bar { height: 8px; background: #0e0c14; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--xp); }
  .bar.hp > i { background: var(--good); }
  .skill { background: var(--panel2); border-radius: 8px; padding: 10px; }
  .skill .top { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .skill .lv { font-weight: 700; color: var(--accent); }
  aside .card { padding: 12px; margin-bottom: 12px; }
  .eq { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  .eq button { padding: 2px 8px; font-size: 12px; }
  #log { max-height: 260px; overflow-y: auto; overscroll-behavior: contain; font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
  #log div { padding: 2px 0; border-bottom: 1px dashed #2c283b; }
  .lg-good { color: var(--good); }
  .lg-bad { color: var(--bad); }
  .lg-gold { color: var(--accent); }
  .lg-xp { color: var(--xp); }
  .have { color: var(--good); } .need { color: var(--bad); }
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  #modal[hidden] { display: none; }
  #modal .card { max-width: 440px; width: 100%; padding: 18px; max-height: 80vh; max-height: 80dvh; overflow-y: auto; overscroll-behavior: contain; }
  #modal textarea { width: 100%; min-height: 110px; font: 12px/1.4 ui-monospace, monospace; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px 16px; }
  .stats span { display: flex; justify-content: space-between; gap: 8px; }
  .stats b { font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chips.sub { margin: 0 0 12px; }
  .chips button small { display: block; font-size: 11px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: #2f2a44; color: var(--muted); }
  .tag.good { background: #1f3a24; color: var(--good); } .tag.bad { background: #3f2024; color: var(--bad); }
  .quest { border: 1px solid transparent; }
  .quest.ready { border-color: #6b5a24; }
  .quest .bar { margin-top: 3px; }
  .check { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  /* world map */
  .map { position: relative; width: 100%; aspect-ratio: 3 / 2; border-radius: 10px; overflow: hidden; background: #0b2a3d; border: 1px solid var(--line); }
  .map canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .loc {
    position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: 0; padding: 0; min-height: 0; z-index: 1;
  }
  .loc:hover:not(:disabled), button.loc.sel { background: none; border: 0; }
  .loc .pin {
    position: relative; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 21px;
    background: rgba(20, 18, 28, 0.82); border: 2px solid #c9b27a; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.55);
  }
  .loc .nm {
    font-size: 11.5px; font-weight: 700; color: #fff; white-space: nowrap; padding: 1px 6px; border-radius: 6px;
    background: rgba(10, 14, 22, 0.6); text-shadow: 0 1px 2px #000;
  }
  .loc.sel .pin { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(242, 201, 76, 0.35), 0 3px 8px rgba(0, 0, 0, 0.55); }
  .loc.locked .pin { filter: grayscale(1); opacity: 0.75; }
  .loc .me { position: absolute; right: -10px; top: -10px; font-size: 15px; font-style: normal; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .loc .me { animation: none; } }
  .locpanel { margin-top: 10px; }
  .locpanel .locname { font-size: 16px; }
  .acticons { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin: 10px 0; }
  .acticons button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; }
  .acticons .big { font-size: 24px; }
  .acticons button.doing { border-color: var(--good); }
  .item.on { border: 1px solid var(--good); }
  .drops { letter-spacing: 2px; }
  .check input { width: 18px; height: 18px; }
  #modal h2 { margin: 0 0 10px; font-size: 18px; }
  #modal ul { padding-left: 18px; margin: 6px 0 14px; }
  /* phone + touch rules last so they override the base styles */
  /* the game is played in portrait on phones: ask to rotate back when a phone is turned sideways */
  #rotate { display: none; }
  @media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
    #rotate {
      display: flex; position: fixed; inset: 0; z-index: 20; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; background: var(--bg); color: var(--text); text-align: center; padding: 24px;
    }
    #rotate .big { font-size: 54px; animation: tilt 1.6s ease-in-out infinite; }
    @keyframes tilt { 50% { transform: rotate(-90deg); } }
    body { overflow: hidden; }
  }
  @media (max-width: 700px) {
    .map { aspect-ratio: 1 / 1; }
    .acticons { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .acticons button { padding: 6px 2px; font-size: 11px; min-height: 0; }
    .acticons .big { font-size: 20px; }
    .acticons small { font-size: 10px; }
    .loc .pin { width: 36px; height: 36px; font-size: 18px; }
    .loc .nm { font-size: 10.5px; }
    header { padding-block: max(8px, env(safe-area-inset-top)) 8px; gap: 4px 12px; font-size: 13px; }
    header h1 { font-size: 16px; width: 100%; }
    #mute { margin-left: auto; }
    .wrap { padding: 0 0 calc(76px + env(safe-area-inset-bottom)); }
    #stage {
      position: sticky; top: 0; z-index: 5; background: var(--bg);
      padding: 8px max(16px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left));
      padding-top: max(8px, env(safe-area-inset-top));
    }
    #view { border-radius: 8px; }
    #goal { margin-top: 6px; font-size: 13px; padding: 6px 10px; }
    #ticker {
      display: block; margin-top: 4px; font-size: 12.5px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 18px;
    }
    /* thumb-reachable tab bar */
    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; flex-wrap: nowrap; gap: 2px;
      padding: 4px max(6px, env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
      background: var(--panel); border-top: 1px solid var(--line); border-bottom: 0;
    }
    nav.tabs button {
      flex: 1 1 0; min-width: 0; flex-direction: column; gap: 1px; padding: 5px 0; min-height: 50px;
      background: transparent; border-color: transparent;
    }
    nav.tabs button.sel { background: #2e2a1c; border-color: #6b5a24; }
    nav.tabs .ti { font-size: 19px; line-height: 1.1; }
    nav.tabs .tl { font-size: 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    small, .muted { font-size: 13px; }
    main { padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); margin-top: 6px; }
    #tab-content { padding: 10px; }
    .acts { grid-template-columns: 1fr 1fr; }
    .zones { grid-template-columns: 1fr 1fr; }
    #log { max-height: 160px; }
  }
  @media (pointer: coarse) {
    button { min-height: 40px; padding: 8px 12px; }
    .item .btns button { padding: 6px 10px; font-size: 13px; }
    .eq button { padding: 4px 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>🗺️ Endless Road <button id="mute" data-a="mute" aria-label="Toggle sound">🔊</button><button id="gfx" data-a="gfx" aria-label="Switch between 3D and 2D graphics" hidden>3D</button></h1>
  <span class="stat" id="gold">Gold: <b>0</b></span>
  <span class="stat" id="cmb">Combat level: <b>1</b></span>
  <span class="stat" id="dist">Distance: <b>0 m</b></span>
  <span class="stat" id="renown" hidden>Renown: <b>0</b></span>
</header>
<div class="wrap">
  <div id="stage">
    <div id="view"><canvas id="scene3d"></canvas><canvas id="scene"></canvas></div>
    <div id="goal"></div>
    <div id="ticker"></div>
    <div id="toast" hidden></div>
  </div>
  <main>
    <section class="card">
      <nav class="tabs">
        <button data-tab="activity" class="sel"><span class="ti">🗺️</span><span class="tl">Map</span></button>
        <button data-tab="skills"><span class="ti">📈</span><span class="tl">Skills</span></button>
        <button data-tab="inventory"><span class="ti">🎒</span><span class="tl">Bag</span></button>
        <button data-tab="craft"><span class="ti">🔨</span><span class="tl">Craft</span></button>
        <button data-tab="slayer"><span class="ti">💀</span><span class="tl">Slayer</span></button>
        <button data-tab="quests"><span class="ti">📜</span><span class="tl">Quests</span></button>
        <button data-tab="progress"><span class="ti">🏆</span><span class="tl">Progress</span></button>
      </nav>
      <div id="tab-content"></div>
    </section>
    <aside>
      <div class="card" id="hero"></div>
      <div class="card">
        <h3>Log</h3>
        <div id="log"></div>
      </div>
      <div class="card row">
        <button data-a="save">💾 Save</button>
        <button data-a="export">📤 Export</button>
        <button data-a="import">📥 Import</button>
        <button data-a="reset">🗑️ Reset</button>
      </div>
    </aside>
  </main>
</div>
<div id="modal" hidden><div class="card" id="modal-body"></div></div>
<div id="rotate" aria-live="polite"><span class="big">📱</span><b>Turn your phone upright</b><span class="muted">Endless Road is played in portrait.</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

/* ================= DUOMENYS ================= */

const SKILLS = {
  attack:       { name: 'Attack',       icon: '⚔️' },
  strength:     { name: 'Strength',     icon: '💪' },
  defence:      { name: 'Defence',      icon: '🛡️' },
  hitpoints:    { name: 'Hitpoints',    icon: '❤️' },
  ranged:       { name: 'Ranged',       icon: '🏹' },
  magic:        { name: 'Magic',        icon: '✨' },
  prayer:       { name: 'Prayer',       icon: '🙏' },
  slayer:       { name: 'Slayer',       icon: '💀' },
  woodcutting:  { name: 'Woodcutting',  icon: '🪓' },
  mining:       { name: 'Mining',       icon: '⛏️' },
  fishing:      { name: 'Fishing',      icon: '🎣' },
  smithing:     { name: 'Smithing',     icon: '🔨' },
  cooking:      { name: 'Cooking',      icon: '🍳' },
  fletching:    { name: 'Fletching',    icon: '🪶' },
  runecrafting: { name: 'Runecrafting', icon: '🔮' },
  thieving:     { name: 'Thieving',     icon: '🥷' },
  firemaking:   { name: 'Firemaking',   icon: '🔥' },
};

// RuneScape/Melvor style XP curve
const XP_TABLE = [0, 0];
{ let pts = 0; for (let l = 1; l < 99; l++) { pts += Math.floor(l + 300 * Math.pow(2, l / 7)); XP_TABLE[l + 1] = Math.floor(pts / 4); } }
function levelFromXp(xp) { let l = 1; while (l < 99 && xp >= XP_TABLE[l + 1]) l++; return l; }

const TIER_COLORS = ['#c87533', '#9aa0a8', '#dfe3ee', '#f2c94c', '#4fd6e8', '#e0453a', '#b46bff'];
const CANOPY = ['#8ccf6b', '#3f8f3a', '#d0702f', '#2f6b45', '#b06be0'];
// OSRS metals: bronze -> rune, plus Dragon from drops
const METALS = ['Bronze', 'Iron', 'Steel', 'Mithril', 'Adamant', 'Rune', 'Dragon'];
const METAL_COLORS = ['#b07a45', '#8a8f98', '#b8bec8', '#5a6ad8', '#4a9a5a', '#3fc6e0', '#c0392b'];
const METAL_LVL = [1, 15, 30, 50, 70, 85];          // Smithing level each metal starts at
const METAL_EQUIP = [1, 1, 5, 20, 30, 40, 60];       // Attack/Defence needed to wear it, as in OSRS
const METAL_POWER = [3, 6, 10, 15, 21, 28, 34];      // base weapon power
const METAL_ARMOUR = [2, 4, 7, 10, 14, 19, 26];      // base armour for a full set
const BAR_XP = [12, 25, 37, 50, 62, 75];              // Smithing XP per bar used at the anvil
// mining: two bronze ores at level 1, then OSRS levels
const ORES = [
  { id: 'copper',     name: 'Copper Ore',     lvl: 1,  xp: 10, time: 3.0, color: '#c87533', value: 3 },
  { id: 'tin',        name: 'Tin Ore',        lvl: 1,  xp: 10, time: 3.0, color: '#c9ccd2', value: 3 },
  { id: 'iron',       name: 'Iron Ore',       lvl: 15, xp: 20, time: 3.5, color: '#9a5f4a', value: 7 },
  { id: 'coal',       name: 'Coal',           lvl: 30, xp: 30, time: 3.8, color: '#26262b', value: 10 },
  { id: 'mithril',    name: 'Mithril Ore',    lvl: 55, xp: 50, time: 4.4, color: '#5a6ad8', value: 30 },
  { id: 'adamantite', name: 'Adamantite Ore', lvl: 70, xp: 65, time: 4.9, color: '#4a9a5a', value: 55 },
  { id: 'runite',     name: 'Runite Ore',     lvl: 85, xp: 85, time: 5.6, color: '#3fc6e0', value: 110 },
];
const BARS = [
  { lvl: 1,  xp: 6,  mats: { ore_copper: 1, ore_tin: 1 } },
  { lvl: 15, xp: 12, mats: { ore_iron: 1 } },
  { lvl: 30, xp: 17, mats: { ore_iron: 1, ore_coal: 2 } },
  { lvl: 50, xp: 30, mats: { ore_mithril: 1, ore_coal: 4 } },
  { lvl: 70, xp: 37, mats: { ore_adamantite: 1, ore_coal: 6 } },
  { lvl: 85, xp: 50, mats: { ore_runite: 1, ore_coal: 8 } },
];
// what can be smithed from each metal; off = levels above the metal's start, like OSRS
const SMITH_ITEMS = [
  { key: 'dagger',     name: 'Dagger',     off: 0,  bars: 1, slot: 'weapon', pw: 0.7,  speed: 1.5, icon: '🗡️' },
  { key: 'medhelm',    name: 'Med Helm',   off: 3,  bars: 1, slot: 'helm',   arm: 0.15, icon: '⛑️' },
  { key: 'sword',      name: 'Sword',      off: 4,  bars: 1, slot: 'weapon', pw: 1,    speed: 1.8, icon: '🗡️' },
  { key: 'scimitar',   name: 'Scimitar',   off: 5,  bars: 2, slot: 'weapon', pw: 1.15, speed: 1.8, icon: '🗡️' },
  { key: 'tips',       name: 'Arrowtips',  off: 5,  bars: 1, n: 15, icon: '🔺' },
  { key: 'fullhelm',   name: 'Full Helm',  off: 7,  bars: 2, slot: 'helm',   arm: 0.25, icon: '⛑️' },

// saves from before OSRS smithing: old ores become the new ones, the single armour slot becomes the body slot
const OLD_ORE = { ore0: 'ore_copper', ore1: 'ore_iron', ore2: 'ore_coal', ore3: 'ore_mithril', ore4: 'ore_adamantite' };
function migrateMetals(data) {
  if (S.equip.armor) { S.equip.body = S.equip.armor === 'armor5' ? 'armor6' : S.equip.armor; }
  delete S.equip.armor;
  if (S.equip.weapon === 'sword5') S.equip.weapon = 'sword6';
  const inv = {};
  let refund = 0;
  for (const [id, n] of Object.entries(S.inv)) {
    const nid = OLD_ORE[id] || { sword5: 'sword6', armor5: 'armor6' }[id] || id;
    if (ITEMS[nid]) inv[nid] = (inv[nid] || 0) + n; else refund += n * 5;
  }
  S.inv = inv; S.gold += refund;
  for (const sl in S.equip) if (S.equip[sl] && !ITEMS[S.equip[sl]]) S.equip[sl] = null;
  // recipe and ore picks pointed at the old lists
  if (data.csel) data.csel.smithing = 0;
  if (data.gsel) data.gsel.mining = -1;
  if (data.smithSel !== undefined) data.smithSel = 0;
  S.smithV = 2;
}
function applySave(data) {
  const base = newState();
  if (data && data.v === 1) {
    S = Object.assign(base, data);
    S.skills = Object.assign(base.skills, data.skills);
    // older saves had no Strength: start it where Attack was so combat level doesn't drop
    if (data.skills && data.skills.strength === undefined) S.skills.strength = data.skills.attack || 0;
    S.tools = Object.assign({ axe: 0, pick: 0, rod: 0 }, data.tools);
    S.equip = Object.assign(base.equip, data.equip);
    if (!data.smithV) migrateMetals(data);
    S.stats = Object.assign(base.stats, data.stats);
    S.stats.g = Object.assign({}, data.stats && data.stats.g);
    S.rup = Object.assign(base.rup, data.rup);
    S.gsel = Object.assign(base.gsel, data.gsel);
    S.styles = Object.assign(base.styles, data.styles);
    if (!data.styles && data.style) S.styles.melee = data.style === 'defence' ? 'defence' : 'attack';
    S.csel = Object.assign(base.csel, data.csel);
    if (!data.csel && data.smithSel !== undefined) S.csel.smithing = data.smithSel;
  } else S = base;
  recalcLevels(); recalcBonuses();
  if (!S.zone || S.zone >= ZONES.length) S.zone = 0;
  fitZone();
}

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.floor(n).toLocaleString('en-US');

function log(msg, cls = '') {
  if (SIM) return;
  logLines.unshift({ msg, cls });
  const tk = document.getElementById('ticker');
  if (tk) tk.innerHTML = `<span class="${cls}">${msg}</span>`;
  if (logLines.length > 60) logLines.pop();
  renderLog();
}
function give(id, n = 1) { if (!ITEMS[id]) return; S.inv[id] = (S.inv[id] || 0) + n; uiDirty = true; }
function take(id, n = 1) {
  if ((S.inv[id] || 0) < n) return false;
  S.inv[id] -= n; if (S.inv[id] <= 0) delete S.inv[id];
  uiDirty = true; return true;
}
function has(id) { return S.inv[id] || 0; }

function addXp(skill, amt) {
  amt *= xpMult() * (R.buff > 0 ? 1.5 : 1) * (R.rested > 0 ? 1.5 : 1) * (S.bonfire ? 1 + S.bonfire.pct / 100 : 1) * (petFor(skill) ? 1.05 : 1);
  const before = LV[skill];
  S.skills[skill] += amt;
  LV[skill] = levelFromXp(S.skills[skill]);
  if (LV[skill] > before) {
    if (skill === 'hitpoints') S.hp += (LV[skill] - before) * 10;
    log(`${SKILLS[skill].icon} ${SKILLS[skill].name} reached level ${LV[skill]}!`, 'lg-xp');
    showBanner(`${SKILLS[skill].icon} ${SKILLS[skill].name} level ${LV[skill]}!`);
    if (!SIM) R.ring = 1;
    sfx('level');
  }
  if (!SIM && amt > 0) xpDrop(skill, amt);
  uiDirty = true;
}

// story zones open once the previous boss is beaten and combat level is high enough; Slayer areas need Slayer level
function zoneOpen(i) {
  const z = ZONES[i];
  if (z.slayer) return LV.slayer >= z.slayer;
  return i === 0 || (S.bosses[i - 1] && combatLevel() >= z.req);
}
// Slayer areas need Slayer level for everything; other places can always be visited to gather and craft
function locOpen(i) { const z = ZONES[i]; return !z.slayer || LV.slayer >= z.slayer; }
function locTiers(skill, z = S.zone) { return (ZONES[z].res && ZONES[z].res[skill]) || []; }
function locHas(i, act) {
  const z = ZONES[i];
  if (act === 'combat') return z.enemies.length > 0;
  if (act === 'thieving') return !!(z.npcs && z.npcs.length);
  if (act === 'firemaking') return true;
  if (CRAFTING.has(act)) return (z.stations || []).includes(act);
  return locTiers(act, i).length > 0 || (act === 'mining' && !!z.ess);
}
// the open place where the hero can gather the highest tier of a resource
function bestLocFor(skill) {
  let best = 0, bestT = -1;
  ZONES.forEach((z, i) => {
    if (!locOpen(i)) return;
    const t = Math.max(-1, ...locTiers(skill, i).filter(t => LV[skill] >= tierReq(skill, t)));
    if (t > bestT || (t === bestT && i === S.zone)) { best = i; bestT = t; }
  });
  return best;
}
function bestZone() { let b = 0; for (let i = 1; i < MAIN_ZONES; i++) if (zoneOpen(i)) b = i; return b; }
function combatLevel() { return Math.floor((Math.max((LV.attack + LV.strength) / 2, LV.ranged, LV.magic) + LV.defence + LV.hitpoints) / 3); }
function maxHp() { return 40 + LV.hitpoints * 10; }
function wtype() { return S.equip.weapon ? ITEMS[S.equip.weapon].wtype : 'melee'; }
function bestArrow() { for (let t = 5; t >= 0; t--) if (has('arrow' + t)) return 'arrow' + t; return null; }
function curSpell() {
  const ok = sp => LV.magic >= sp.lvl && has('rune') >= sp.runes;
  if (S.spell >= 0) return ok(SPELLS[S.spell]) ? SPELLS[S.spell] : null;
  for (let i = SPELLS.length - 1; i >= 0; i--) if (ok(SPELLS[i])) return SPELLS[i];
  return null;
}
// a bow without arrows or a staff without runes leaves the hero punching
function attackMode() {
  const t = wtype();
  if (t === 'ranged' && !bestArrow()) return 'unarmed';
  if (t === 'magic' && !curSpell()) return 'unarmed';
  return t;
}
function combatType() { const m = attackMode(); return m === 'unarmed' ? 'melee' : m; }
function styleOf() { return S.styles[combatType()]; }
function amu(k) { return S.equip.amulet ? (ITEMS[S.equip.amulet][k] || 0) : 0; }
function activePrayer() { return S.prayer ? PRAYERS.find(p => p.id === S.prayer) : null; }
function pray(k) { const p = activePrayer(); return (p && p[k]) || 0; }
function weaponPower() { return S.equip.weapon && attackMode() !== 'unarmed' ? ITEMS[S.equip.weapon].power : 0; }
function armorValue() { return ARMOUR_SLOTS.reduce((a, sl) => a + (S.equip[sl] ? ITEMS[S.equip[sl]].armor : 0), 0); }
function playerMaxHit() {
  const m = attackMode(), p = weaponPower();
  const base = m === 'ranged' ? 4 + LV.ranged * 0.7 + p * 0.8 + ITEMS[bestArrow()].power
    : m === 'magic' ? curSpell().max + LV.magic * 0.35 + p
    : 4 + LV.strength * 0.7 + p;
  return Math.floor(base * (1 + amu('dmg') + pray('dmg') + (S.pets.drake ? 0.05 : 0)));
}
function accuracyLevel() {
  const m = attackMode();
  return (m === 'ranged' ? LV.ranged : m === 'magic' ? LV.magic : LV.attack) + weaponPower() * 0.5;
}
function playerSpeed() {
  const m = attackMode();
  const w = S.equip.weapon && ITEMS[S.equip.weapon];
  return m === 'ranged' ? (S.styles.ranged === 'rapid' ? 1.3 : 1.6) : m === 'magic' ? 2.2 : m === 'melee' && w && w.speed ? w.speed : 1.8;
}
// +1: the hero's style beats the enemy's, -1: the enemy's beats the hero's
function triangle(e) { const p = combatType(); return BEATS[p] === e.d.type ? 1 : BEATS[e.d.type] === p ? -1 : 0; }
function onTask(e) { return !!(S.task && e.id === S.task.id); }
function playerHitChance(e) { return clamp(0.6 + (accuracyLevel() - e.def) * 0.03 + amu('acc') + pray('acc'), 0.1, 0.97); }
function enemyHitChance(e) { return clamp(0.6 + (e.atk - LV.defence - armorValue()) * 0.02, 0.15, 0.95); }
function damageReduction() { return Math.min(0.6, armorValue() * 0.012 + LV.defence * 0.002 + amu('dr') + pray('dr')); }

function tierReq(skill, t) { return skill === 'mining' ? ORES[t].lvl : GATHER_REQ[t]; }
function tierXp(skill, t) { return skill === 'mining' ? ORES[t].xp : GATHER_XP[t]; }
function tierItem(skill, t) { return skill === 'mining' ? 'ore_' + ORES[t].id : (skill === 'woodcutting' ? 'log' : 'fish') + t; }
function tierName(skill, t) { return skill === 'mining' ? ORES[t].name : skill === 'woodcutting' ? TREE_N[t] : FISH_N[t]; }
function tierColor(skill, t) { return skill === 'mining' ? ORES[t].color : TIER_COLORS[t]; }
function tierCount(skill) { return skill === 'mining' ? ORES.length : 5; }
function gatherTier(skill) {
  let t = 0;
  for (let i = 0; i < tierCount(skill); i++) if (LV[skill] >= tierReq(skill, i)) t = i;
  return t;
}
// the tier the hero actually gathers: the player's pick, or the best unlocked one here
function chosenTier(skill) {
  const ok = locTiers(skill).filter(t => LV[skill] >= tierReq(skill, t));
  const sel = S.gsel[skill];
  if (sel >= 0 && ok.includes(sel)) return sel;
  return ok.length ? ok[ok.length - 1] : -1;
}
function gatherTime(skill, tier) {
  const base = skill === 'mining' ? ORES[tier].time : GATHER_TIME[tier];
  return base * (1 - 0.12 * S.tools[TOOL_OF[skill]]) / (1 + BON.gather / 100);
}
function nodeTime(e) { return e.ess ? gatherTime('mining', 0) * ESSENCE_TIME / ORES[0].time : gatherTime(e.skill, e.tier); }
function craftRecipe(skill) { return CRAFT[skill].recipes[S.csel[skill]]; }
function stationTime(e) { return e.skill === 'firemaking' ? BURN_TIME : e.skill === 'cooking' ? COOK_TIME : craftRecipe(e.skill).time || CRAFT[e.skill].time; }

/* ===== Achievements, Renown and permanent bonuses ===== */
const BON = { xp: 0, gold: 0, gather: 0 };
function recalcBonuses() {
  BON.xp = BON.gold = BON.gather = 0;
  for (const a of ACH) if (S.ach[a.id]) BON[a.bonus[0]] += a.bonus[1];
}
function xpMult() { return 1 + BON.xp / 100 + 0.15 * S.rup.wisdom; }
function goldMult() { return 1 + BON.gold / 100 + 0.1 * S.rup.fortune + (S.pets.slimey ? 0.05 : 0); }
function petFor(skill) { return PETS.some(p => p.skill === skill && S.pets[p.id]); }
function rollPet(id, chance) {
  if (S.pets[id] || Math.random() >= chance) return;
  const p = PETS.find(x => x.id === id);
  S.pets[id] = true;
  if (!S.pet) S.pet = id;
  log(`🐾 A pet found you: ${p.icon} ${p.name}! (${p.desc})`, 'lg-xp');
  showBanner(`🐾 New pet: ${p.icon} ${p.name}!`); sfx('level');
  uiDirty = true;
}
function rollSkillPet(skill) { const p = PETS.find(x => x.skill === skill); if (p) rollPet(p.id, PET_CHANCE); }
function walkSpeed() { return WALK * (1 + 0.05 * S.rup.boots); }
function offlineCap() { return (12 + 2 * S.rup.patience) * 3600; }
function totalLevel() { return Object.values(LV).reduce((a, l) => a + l, 0); }
function achDesc(a) { return typeof a.desc === 'function' ? a.desc() : a.desc; }
function bonusText(b) { return `+${b[1]}% ${{ xp: 'XP', gold: 'gold', gather: 'gathering speed' }[b[0]]}`; }
function checkAch() {
  for (const a of ACH) {
    if (S.ach[a.id] || !a.test()) continue;
    S.ach[a.id] = true;
    recalcBonuses();
    log(`🏆 Achievement: ${a.name} (${bonusText(a.bonus)})`, 'lg-xp');
    showBanner(`🏆 ${a.name}`); sfx('level');
    uiDirty = true;
  }
}
// grows faster than linearly so pushing a journey further pays off
function renownGain() { return 10 + Math.floor((totalLevel() / 40) ** 1.5) + 5 * S.bosses.filter(Boolean).length; }
function rupCost(k) { return RUP[k].cost * (S.rup[k] + 1); }
function buyRup(k) {
  if (S.rup[k] >= RUP[k].max || S.renown < rupCost(k)) return;
  S.renown -= rupCost(k); S.rup[k]++;
  log(`🌟 ${RUP[k].name} upgraded to level ${S.rup[k]}`, 'lg-good');
}
function newJourney() {
  if (!S.bosses[4]) return;
  const gain = renownGain();
  // keep achievements, lifetime stats and Renown; everything else starts over
  const keep = { ach: S.ach, stats: S.stats, kills: S.kills, deaths: S.deaths, dist: S.dist, rup: S.rup, kc: S.kc, muted: S.muted, pets: S.pets, pet: S.pet,
    renown: S.renown + gain, journeys: S.journeys + 1, tipEvent: true };
  S = Object.assign(newState(), keep);
  const hs = S.rup.headstart;
  S.tools = { axe: hs, pick: hs, rod: hs };
  recalcLevels(); recalcBonuses();
  S.hp = maxHp();
  R.phase = 'walk'; R.ent = null; R.events = []; R.buff = 0; R.worldX = 0;
  log(`🌟 A New Journey begins! +${gain} Renown`, 'lg-xp');
  showBanner(`🌟 New Journey · +${gain} Renown`);
  uiDirty = true;
}

/* ================= GAME LOGIC ================= */

let W = 960, HX = 230, FS = 1;   // view width, hero x and font scale change on phones
const H = 320, GY = 262, WALK = 230;

function spawnEntity() {
  // fixed distance so pacing (and offline progress) is the same on every screen size
  const x = R.worldX + Math.max(790, W - HX + 60) + Math.random() * 140;
  const act = S.activity;
  if (act === 'combat') {
    // Auto Slayer walks to the task's area and only fights the task monster
    const auto = S.autoSlayer && S.task && zoneOpen(S.task.zone);
    if (auto && S.zone !== S.task.zone) S.zone = S.task.zone;
    const z = ZONES[S.zone];
    const id = z.boss && S.zk[S.zone] >= BOSS_EVERY ? z.boss
      : auto ? S.task.id : S.ctarget && z.enemies.includes(S.ctarget) ? S.ctarget : z.enemies[Math.floor(Math.random() * z.enemies.length)];
    const d = ENEMIES[id];
    // archers and mages keep their distance
    const stop = (d.shape === 'dragon' ? 130 : d.shape === 'flyer' ? 70 : 55 + 25 * d.size) + (wtype() !== 'melee' ? 60 : 0);
    R.ent = { kind: 'enemy', id, d, hp: d.hp, maxHp: d.hp, atk: d.atk, def: d.def, atkT: d.speed * 0.7, x, stop, hit: 0, lunge: 0, pend: 0 };
  } else if (act === 'thieving') {
    const list = (ZONES[S.zone].npcs || []).filter(id => LV.thieving >= NPCS[id].lvl);
    const id = S.tsel && list.includes(S.tsel) ? S.tsel : list[Math.floor(Math.random() * list.length)] || 'man';
    R.ent = { kind: 'npc', skill: 'thieving', id, d: NPCS[id], tries: randi(4, 7), t: 0, stun: 0, x, stop: 48, hit: 0 };
  } else if (CRAFTING.has(act)) {
    const kind = act === 'smithing' ? craftRecipe('smithing').station : { cooking: 'fire', fletching: 'bench', runecrafting: 'altar', firemaking: 'pyre' }[act];
    R.ent = { kind, skill: act, crafts: STATION_CRAFTS, t: 0, x, stop: 62, hit: 0, swung: false, blocked: false };
  } else {
    const ess = act === 'mining' && S.gsel.mining === -2 && !!ZONES[S.zone].ess;
    if (!ess && chosenTier(act) < 0) S.zone = bestLocFor(act);   // nothing here the hero can gather yet
    const tier = ess ? 0 : Math.max(0, chosenTier(act));
    const yields = randi(3, 6);
    const kind = act === 'woodcutting' ? 'tree' : act === 'mining' ? 'rock' : 'pond';
    const stop = kind === 'pond' ? 135 : kind === 'tree' ? 58 : 62;
    R.ent = { kind, skill: act, tier, ess, yields, maxYields: yields, t: 0, x, stop, hit: 0, swung: false };
  }
  if (!SIM && Math.random() < 0.3) spawnEvent(R.ent);
}

/* ===== Road events: tap them before they scroll away ===== */
// put the find just past whatever the hero will stop at, but never further than the right edge of the screen
function spawnEvent(ent) {
  const r = Math.random() * 10;
  const limit = ent.x - ent.stop + (W - HX) - 50;
  R.events.push({ type: r < 5 ? 'chest' : r < 8 ? 'shrine' : 'star', x: Math.min(ent.x + rand(70, 150), limit), age: 0 });
}
function evScreen(ev) {
  return { x: ev.x - R.worldX + HX, y: ev.type === 'star' ? GY - 72 + Math.sin(time * 3 + ev.x) * 6 : GY - 22 };
}
function collectEvent(ev) {
  R.events.splice(R.events.indexOf(ev), 1);
  const { x, y } = evScreen(ev);
  S.tipEvent = true; S.stats.events++;
  if (ev.type === 'chest') {
    const g = Math.round(rand(15, 30) * (1 + ZONES[S.zone].tier) ** 2 * goldMult());
    S.gold += g;
    coinsFly(x, y, 8); burst(x, y, '#f2c94c', 14);
    floatText(x, y - 30, `+${g} 🪙`, '#f2c94c', 1.4, 1.2);
    log(`🎁 Opened a chest: ${fmt(g)} gold`, 'lg-gold'); sfx('chest');
  } else if (ev.type === 'shrine') {
    R.buff = 60; sfx('magic');
    burst(x, y - 30, '#c9a0ff', 18);
    showBanner('✨ Blessing: +50% XP for 60s');
    log('✨ Shrine blessing: +50% XP for 60 seconds', 'lg-xp');
  } else {
    burst(x, y, '#fff1a8', 16); sfx('magic');
    if (Math.random() < 0.35) { give('gem'); showBanner('💎 Lucky find: a Gem!'); log('💎 Lucky find: a Gem!', 'lg-xp'); }
    else {
      const kind = ['log', 'ore', 'fish'][randi(0, 2)];
      const skill = { log: 'woodcutting', ore: 'mining', fish: 'fishing' }[kind];
      const id = tierItem(skill, gatherTier(skill)), n = randi(3, 6);
      give(id, n);
      floatText(x, y - 30, `+${n} ${ITEMS[id].icon}`, '#ffffff', 1.4, 1.2);
      log(`⭐ Lucky find: ${n}× ${ITEMS[id].name}`, 'lg-good');
    }
  }
  uiDirty = true;
}

function startAct() {
  R.atkT = playerSpeed() * 0.35; R.pendingHit = 0;
}

function tick(dt) {
  time += dt;
  if (R.phase === 'walk') {
    const w = walkSpeed();
    R.worldX += w * dt;
    S.dist += w * dt / 40;
    S.hp = Math.min(maxHp(), S.hp + maxHp() * 0.005 * dt);
    if (!R.ent) spawnEntity();
    if (R.ent.x - R.worldX <= R.ent.stop) {
      R.phase = 'act'; startAct();
      if (R.ent.d && R.ent.d.boss) { showBanner(`👑 BOSS: ${R.ent.d.name}`); sfx('boss'); }
    }
  } else if (R.phase === 'act') {
    const k = R.ent.kind;
    if (k === 'enemy') combatTick(dt); else if (k === 'npc') thieveTick(dt); else if (CRAFTING.has(R.ent.skill)) craftTick(dt); else gatherTick(dt);
  } else if (R.phase === 'dead') {
    R.deadT -= dt;
    if (R.deadT <= 0) {
      S.hp = maxHp(); R.phase = 'walk'; R.ent = null;
      // don't let an idle hero die over and over (and bleed gold) in a zone that is too hard
      if (S.activity === 'combat' && S.zone > 0 && (foodCount() === 0 || R.deathStreak >= 3)) {
        S.zone = ZONES[S.zone].slayer ? bestZone() : S.zone - 1;
        R.deathStreak = 0; S.autoSlayer = false;
        log(`🏃 You retreat to ${ZONES[S.zone].name} to recover.`, 'lg-bad');
      } else log('You get back up and continue on.');
    }
  } else if (R.phase === 'done') {
    R.doneT -= dt;
    if (R.doneT <= 0) { R.ent = null; R.phase = 'walk'; }
  }
  if (R.buff > 0) R.buff -= dt;
  if (R.rested > 0) R.rested -= dt;
  if (S.bonfire && (S.bonfire.left -= dt) <= 0) { S.bonfire = null; log('🔥 Your bonfire has burned out.'); }
  for (const ev of R.events) ev.age += dt;
  R.events = R.events.filter(ev => ev.age < 25 && ev.x - R.worldX + HX > -60);
  if (!SIM) updateVisuals(dt);
}

function combatTick(dt) {
  const e = R.ent;
  R.atkT -= dt; e.atkT -= dt;
  if (R.atkT <= 0) {
    R.atkT += playerSpeed();
    const mode = attackMode();
    // work the hit out before using up ammo, so the last arrow still counts
    const spell = mode === 'magic' ? curSpell() : null;
    R.shot = { mode, maxHit: playerMaxHit(), chance: playerHitChance(e), color: spell ? spell.color : null };
    if (mode === 'ranged') take(bestArrow());
    if (mode === 'magic') take('rune', spell.runes);
    if (mode === 'unarmed' && !R.ammoWarn) { R.ammoWarn = true; log(`⚠️ Out of ${wtype() === 'ranged' ? 'arrows' : 'runes'} – fighting with fists!`, 'lg-bad'); }
    if (mode !== 'unarmed') R.ammoWarn = false;
    const p = activePrayer();
    if (p) {
      if (S.pp >= p.cost) S.pp -= p.cost;
      else { S.prayer = null; log('🙏 Out of prayer points – prayer stopped. Bury bones to restore them.', 'lg-bad'); }
    }
    R.swing = 1;
    R.pendingHit = mode === 'ranged' ? 0.28 : mode === 'magic' ? 0.34 : 0.12;
    if (mode === 'ranged' || mode === 'magic') {
      shoot(HX + 18, GY - 48, entScreenX(e), GY - entHeight(e) * 0.55, mode === 'ranged' ? 'arrow' : 'orb', R.shot.color || '#fff', R.pendingHit);
      sfx(mode === 'ranged' ? 'bow' : 'zap');
    }
  }
  // damage lands when the swing or projectile connects, not when it starts
  if (R.pendingHit > 0) { R.pendingHit -= dt; if (R.pendingHit <= 0) playerHit(e, R.shot); }
  if (e.hp <= 0) { killEnemy(e); return; }
  if (e.atkT <= 0) {
    e.atkT += e.d.speed;
    e.lunge = 1;
    const ranged = e.d.type !== 'melee' && !e.d.breath;
    e.pend = ranged ? 0.3 : 0.1;
    if (ranged) {
      const ex = entScreenX(e), ey = GY - entHeight(e) * 0.6;
      shoot(ex - 10, ey, HX + 6, GY - 44, e.d.type === 'ranged' ? 'arrow' : 'orb', e.d.orb || '#c58bff', e.pend);
    }
  }
  if (e.pend > 0) { e.pend -= dt; if (e.pend <= 0) enemyHit(e); }
  autoEat();
  if (S.hp <= 0) die();
}

function enemyHit(e) {
  if (Math.random() >= enemyHitChance(e)) { hitsplat(HX, GY - 42, 0, 'miss', true); return; }
  const tri = triangle(e);
  const raw = 1 + Math.floor(Math.random() * e.d.maxHit);
  const mult = (1 - damageReduction()) * (tri > 0 ? 0.85 : tri < 0 ? 1.15 : 1) * (pray('protect') === e.d.type ? 0.5 : 1);
  const dmg = Math.max(1, Math.round(raw * mult));
  S.hp -= dmg;
  addXp('defence', dmg * 0.5);
  hitsplat(HX, GY - 42, dmg, 'hit', true);
  burst(HX + 4, GY - 40, '#c22', 5);
  R.heroHit = 1; sfx('hurt');
  R.shake = Math.max(R.shake, e.d.boss ? 8 : 3);
}

function combatXp(dmg) {
  const xp = dmg * 4;
  switch (styleOf()) {
    case 'strength': addXp('strength', xp); break;
    case 'defence': addXp('defence', xp); break;
    case 'accurate': case 'rapid': addXp('ranged', xp); break;
    case 'longrange': addXp('ranged', xp / 2); addXp('defence', xp / 2); break;
    case 'standard': addXp('magic', xp); break;
    case 'defensive': addXp('magic', xp / 2); addXp('defence', xp / 2); break;
    default: addXp('attack', xp);
  }
  addXp('hitpoints', dmg * 1.33);
}

function playerHit(e, shot) {
  const ex = entScreenX(e), ey = GY - entHeight(e) * (e.d.shape === 'flyer' ? 0.7 : 0.5);
  if (Math.random() >= shot.chance) { hitsplat(ex, ey, 0, 'miss'); return; }
  const roll = 1 + Math.floor(Math.random() * shot.maxHit);
  const crit = roll >= Math.max(3, shot.maxHit * 0.9);
  const tri = triangle(e);
  const mult = (tri > 0 ? 1.2 : tri < 0 ? 0.85 : 1) * (onTask(e) ? 1 + amu('slay') : 1);
  const dmg = Math.min(e.hp, Math.max(1, Math.round(roll * mult)));
  e.hp -= dmg; e.hit = 1;
  combatXp(dmg);
  if (pray('heal')) S.hp = Math.min(maxHp(), S.hp + maxHp() * pray('heal'));
  sfx(crit ? 'crit' : 'hit');
  hitsplat(ex, ey, dmg, crit ? 'max' : 'hit');
  burst(ex, GY - entHeight(e) * 0.55, crit ? '#ffe14a' : shot.color || '#ff5a5a', crit ? 12 : 6);
  if (crit && !SIM) { R.shake = Math.max(R.shake, 5); R.freeze = 0.06; }
}

function foodCount() { return FOOD_ORDER.reduce((a, id) => a + has(id), 0); }

function autoEat() {
  let guard = 10;
  while (S.hp < maxHp() * 0.4 && guard-- > 0) {
    const food = FOOD_ORDER.find(id => has(id));
    if (!food) return;
    take(food);
    S.hp = Math.min(maxHp(), S.hp + ITEMS[food].heal);
    R.eatFlash = 1;
    floatText(HX + 18, GY - 120, '+' + ITEMS[food].heal, '#6fd27a', 1, 1, true);
    const left = foodCount();
    if (left === 5) log('⚠️ Only 5 food left!', 'lg-bad');
    if (left === 0) log('⚠️ Out of food! Fish and cook, or buy bread.', 'lg-bad');
  }
}

function die() {
  const lost = Math.floor(S.gold * 0.1);
  S.gold -= lost; S.deaths++; R.deathStreak++;
  S.hp = 0; R.phase = 'dead'; R.deadT = 20;
  if (R.ent.d.boss) {
    // let the player farm the zone again before the boss comes back
    S.zk[S.zone] = Math.floor(BOSS_EVERY / 2);
    log(`👑 ${R.ent.d.name} will return after ${BOSS_EVERY - S.zk[S.zone]} more kills.`, 'lg-bad');
  }
  log(`💀 You were defeated by ${R.ent.d.name} and dropped ${fmt(lost)} gold. Recovering...`, 'lg-bad');
  uiDirty = true;
}

function killEnemy(e) {
  const g = Math.round(randi(e.d.gold[0], e.d.gold[1]) * goldMult());
  S.gold += g; S.kills++; R.deathStreak = 0;
  S.kc[e.id] = (S.kc[e.id] || 0) + 1;
  const got = [`${g} gold`];
  const ex = entScreenX(e), ey = GY - entHeight(e) * 0.5;
  for (const [id, ch, mn, mx] of e.d.drops) {
    if (Math.random() >= ch) continue;
    const n = randi(mn, mx);
    if (ITEMS[id].bury && S.autoBury) bury(id, n, true); else give(id, n);
    got.push(`${n}× ${ITEMS[id].name}`);
    if (ITEMS[id].unique) S.stats.uniques++;
    if (ITEMS[id].value >= 150) { log(`✨ Rare drop: ${ITEMS[id].icon} ${ITEMS[id].name}!`, 'lg-xp'); showBanner(`✨ Rare drop: ${ITEMS[id].name}!`); }
  }
  log(`⚔️ Defeated ${e.d.name} (${got.join(', ')})`, 'lg-gold');
  floatText(ex, GY - entHeight(e) - 30, '+' + g + ' 🪙', '#f2c94c', 1.4);
  burst(ex, ey, e.d.color, 18);
  coinsFly(ex, ey, Math.min(12, 3 + Math.floor(g / 10)));
  sfx('coin');
  if (!SIM) { R.shake = Math.max(R.shake, e.d.boss ? 12 : 4); R.freeze = e.d.boss ? 0.2 : 0.08; }
  if (onTask(e)) slayerKill(e);
  const z = S.zone;
  if (e.id === 'kingslime') rollPet('slimey', 1 / 30);
  if (e.id === 'dragon') rollPet('drake', 1 / 40);
  if (e.d.boss) {
    S.zk[z] = 0;
    if (!S.bosses[z]) {
      S.bosses[z] = true;
      const nxt = z + 1 < MAIN_ZONES ? ZONES[z + 1] : null;
      log(`👑 ${e.d.name} defeated for the first time!` + (nxt ? ` ${nxt.name} opens at combat level ${nxt.req}.` : ''), 'lg-xp');
      showBanner(nxt ? `👑 ${nxt.name} unlocked!` : '🏆 The Dragon is slain!');
      if (!nxt && !SIM) victory();
    } else showBanner(`👑 ${e.d.name} defeated!`);
  } else if (ZONES[z].boss) S.zk[z] = Math.min(BOSS_EVERY, S.zk[z] + 1);
  R.phase = 'done'; R.doneT = 0.6; e.dying = true;
  uiDirty = true;
}

function gatherTick(dt) {
  const e = R.ent;
  const need = nodeTime(e);
  e.t += dt;
  if (!e.swung && e.t >= need / 2) { e.swung = true; R.swing = 1; e.hit = 0.6; chips(e); }
  if (e.t >= need) {
    e.t -= need; e.swung = false; R.swing = 1; e.hit = 1; chips(e);
    const item = e.ess ? 'essence' : tierItem(e.skill, e.tier);
    give(item);
    addXp(e.skill, e.ess ? ESSENCE_XP : tierXp(e.skill, e.tier));
    const key = e.ess ? 'essence' : e.skill;
    S.stats.g[key] = (S.stats.g[key] || 0) + 1;
    floatText(entScreenX(e), GY - 120, `+1 ${ITEMS[item].icon}`, '#ffffff');
    sfx('gather');
    rollSkillPet(e.skill);
    e.yields--;
    if (e.yields <= 0) { R.phase = 'done'; R.doneT = 0.6; e.dying = true; }
  }
}

function setActivity(a) {
  if (S.activity === a) return;
  if (CRAFTING.has(a) && !CRAFTING.has(S.activity)) { S.prevAct = S.activity; S.prevZone = S.zone; }
  S.activity = a;
  fitZone();
  resetEncounter();
}
// move the hero somewhere the current activity can actually be done
function fitZone() {
  const a = S.activity;
  if (a === 'combat') { if (!locHas(S.zone, 'combat') || !zoneOpen(S.zone)) S.zone = bestZone(); }
  else if (CRAFTING.has(a)) { if (!locHas(S.zone, a) || !locOpen(S.zone)) S.zone = TOWN; }
  else if (!locOpen(S.zone) || !locHas(S.zone, a)) S.zone = bestLocFor(a);
}
// used by the world map: go to a place and start an activity there
function travel(z, a) {
  if (!locOpen(z) || !locHas(z, a) || (a === 'combat' && !zoneOpen(z))) return;
  if (S.zone !== z && S.autoSlayer && a === 'combat' && S.task && z !== S.task.zone) { S.autoSlayer = false; log('🧭 Auto Slayer paused while you pick your own area.'); }
  if (S.zone !== z) log(`🗺️ Travelling to ${ZONES[z].name}`);
  S.zone = z;
  if (S.activity === a) resetEncounter(); else setActivity(a);
}
function setZone(i) {
  if (S.activity === 'combat' && !zoneOpen(i)) return;
  if (S.activity === 'combat' && S.autoSlayer && S.task && i !== S.task.zone) { S.autoSlayer = false; log('🧭 Auto Slayer paused while you pick your own area.'); }
  S.zone = i; resetEncounter();
}
function resetEncounter() {
  if (R.phase !== 'dead') { R.phase = 'walk'; R.ent = null; }
  uiDirty = true;
}

/* ===== Crafting, shop, inventory ===== */

function maxCraft(mats) { return Math.min(...Object.entries(mats).map(([id, n]) => Math.floor(has(id) / n))); }
function recipeCount(r) { return typeof r.n === 'function' ? r.n() : (r.n || 1); }
function canCraft(skill, i) { const r = CRAFT[skill].recipes[i]; return !!r && LV[skill] >= r.req && maxCraft(r.mats) > 0; }
function craftOnce(skill, i) {
  const r = CRAFT[skill].recipes[i], n = recipeCount(r);
  for (const [id, c] of Object.entries(r.mats)) take(id, c);
  give(r.out, n);
  addXp(skill, r.xp);
  S.stats[CRAFT[skill].stat]++;
  if (ITEMS[r.out].dragon) S.stats.dragonGear++;
  if (ITEMS[r.out].slot && isUpgrade(r.out)) { equip(r.out); showBanner(`⬆️ Equipped ${ITEMS[r.out].name}`); }
  return [r.out, n];
}
function burnChance(t) { return Math.max(0, 0.35 - (LV.cooking - GATHER_REQ[t]) * 0.02); }
function cookTarget() {
  const ok = t => has('fish' + t) && LV.cooking >= GATHER_REQ[t];
  if (S.cookSel >= 0) return ok(S.cookSel) ? S.cookSel : -1;
  for (let t = 4; t >= 0; t--) if (ok(t)) return t;
  return -1;
}
function cookOnce(t) {
  take('fish' + t);
  if (Math.random() < burnChance(t)) { give('burnt'); return 'burnt'; }
  give('cooked' + t); addXp('cooking', GATHER_XP[t]); S.stats.cooked++;
  return 'cooked' + t;
}

function stealChance(n) { return clamp((100 + 40 + LV.thieving * 1.5) / (100 + n.perception), 0.1, 0.95); }
function thieveTick(dt) {
  const e = R.ent, n = e.d, ex = entScreenX(e);
  if (e.stun > 0) { e.stun -= dt; return; }
  e.t += dt;
  if (e.t < PICKPOCKET_TIME) return;
  e.t = 0; R.swing = 1;
  if (Math.random() < stealChance(n)) {
    const g = Math.round(randi(n.gold[0], n.gold[1]) * goldMult());
    S.gold += g; S.stats.stolen++;
    addXp('thieving', n.xp);
    for (const [id, ch, mn, mx] of n.drops) if (Math.random() < ch) { const k = randi(mn, mx); give(id, k); floatText(ex, GY - 125, `+${k} ${ITEMS[id].icon}`, '#ffffff'); }
    floatText(ex, GY - 105, `+${g} 🪙`, '#f2c94c'); coinsFly(ex, GY - 50, 3); sfx('coin');
    rollSkillPet('thieving');
  } else {
    // caught: stunned and slapped, but never knocked out by it
    const dmg = Math.min(Math.max(0, Math.ceil(S.hp) - 1), randi(1, n.maxHit));
    S.hp -= dmg; e.stun = STUN_TIME; e.hit = 1; R.heroHit = 1;
    floatText(HX, GY - 108, dmg ? `Stunned! -${dmg}` : 'Stunned!', '#ffb0a0', 1.4, 1, true); sfx('hurt');
  }
  if (--e.tries <= 0) { R.phase = 'done'; R.doneT = 0.6; e.dying = true; }
}
function fmTarget() {
  const ok = t => has('log' + t) && LV.firemaking >= GATHER_REQ[t];
  if (S.fmSel >= 0) return ok(S.fmSel) ? S.fmSel : -1;
  for (let t = 4; t >= 0; t--) if (ok(t)) return t;
  return -1;
}
function burnOnce(t) {
  take('log' + t);
  addXp('firemaking', FM_XP[t]); S.stats.burned++;
  if (Math.random() < 0.1) give('ore_coal');   // like Melvor, burning now and then leaves coal
  rollSkillPet('firemaking');
}
function lightBonfire(t) {
  if (LV.firemaking < GATHER_REQ[t] || has('log' + t) < BONFIRE_LOGS) return;
  take('log' + t, BONFIRE_LOGS);
  addXp('firemaking', FM_XP[t] * BONFIRE_LOGS);
  S.bonfire = { pct: BONFIRE_PCT[t], left: BONFIRE_TIME };
  log(`🔥 Bonfire lit: +${BONFIRE_PCT[t]}% XP for all skills for ${BONFIRE_TIME / 60} minutes`, 'lg-xp');
  showBanner(`🔥 Bonfire: +${BONFIRE_PCT[t]}% XP`); sfx('magic');
}

function craftTick(dt) {
  const e = R.ent, skill = e.skill, cooking = skill === 'cooking', fm = skill === 'firemaking';
  const r = cooking || fm ? null : CRAFT[skill].recipes[S.csel[skill]];
  const can = cooking ? cookTarget() >= 0 : fm ? fmTarget() >= 0 : canCraft(skill, S.csel[skill]);
  e.reason = r && LV[skill] < r.req ? `Needs ${SKILLS[skill].name} ${r.req}` : fm ? 'No logs' : 'No materials';
  if (!can && !e.blocked) log(cooking ? '⚠️ No fish left to cook.' : fm ? '⚠️ No logs left to burn.' : `⚠️ Out of materials for ${SKILLS[skill].name}.`, 'lg-bad');
  e.blocked = !can;
  if (!can) {
    // don't idle at an empty station all night: go back to what the hero was doing before
    e.blockT = (e.blockT || 0) + dt;
    if (e.blockT > 3) {
      const back = S.prevAct || 'combat';
      log(`↩️ Nothing left for ${SKILLS[skill].name} – back to ${back}.`);
      if (S.prevZone !== undefined && locOpen(S.prevZone)) S.zone = S.prevZone;
      setActivity(back);
    }
    return;
  }
  const need = stationTime(e), ex = entScreenX(e);
  e.t += dt;
  if (!cooking && !fm && !e.swung && e.t >= need / 2) { e.swung = true; R.swing = 1; e.hit = 0.6; burst(ex - 6, GY - 46, CRAFT[skill].spark, 4); }
  if (e.t >= need) {
    e.t -= need; e.swung = false; e.hit = 1;
    if (fm) {
      const t = fmTarget(); burnOnce(t);
      burst(ex, GY - 30, '#ffb347', 10);
      floatText(ex, GY - 100, `🔥 ${LOG_N[t]}`, '#ffd27a');
    } else if (cooking) {
      const res = cookOnce(cookTarget()); rollSkillPet('cooking');
      burst(ex, GY - 40, res === 'burnt' ? '#444444' : '#ffb347', 6);
      floatText(ex, GY - 100, res === 'burnt' ? 'Burnt!' : '+1 🍽️', res === 'burnt' ? '#ff8a5a' : '#ffffff');
    } else {
      R.swing = 1;
      const [out, n] = craftOnce(skill, S.csel[skill]); rollSkillPet(skill);
      burst(ex - 6, GY - 46, CRAFT[skill].spark, 8); sfx(skill === 'runecrafting' ? 'magic' : 'clink');
      floatText(ex, GY - 100, `+${n} ${ITEMS[out].icon}`, '#ffffff');
    }
    if (--e.crafts <= 0) { R.phase = 'done'; R.doneT = 0.6; e.dying = true; }
  }
}

function victory() {
  openModal(`<h2>🏆 Victory!</h2><p>You slew the Dragon at the end of the Endless Road.</p>
    <ul><li>Distance travelled: ${fmt(S.dist)} m</li><li>Enemies defeated: ${fmt(S.kills)}</li><li>Deaths: ${S.deaths}</li></ul>
    <p class="muted">The road goes on – train every skill to 99. The Dragon returns every ${BOSS_EVERY} kills.</p>
    <button data-a="close">Keep playing</button>`);
}

function sell(id, n) {
  n = Math.min(n, has(id));
  if (n <= 0) return;
  take(id, n);
  const g = ITEMS[id].value * n;
  S.gold += g;
  log(`💰 Sold ${n}× ${ITEMS[id].name} for ${fmt(g)} gold`, 'lg-gold');
}

function reqSkill(it) {
  if (ARMOUR_SLOTS.includes(it.slot)) return 'defence';
  if (it.slot === 'weapon') return { melee: 'attack', ranged: 'ranged', magic: 'magic' }[it.wtype];
  return null;
}
function canEquip(id) {
  const it = ITEMS[id], sk = reqSkill(it);
  return !!it.slot && (!sk || LV[sk] >= (it.req || 0));
}
function equip(id) {
  const it = ITEMS[id];
  if (!it.slot) return;
  if (!canEquip(id)) { const sk = reqSkill(it); log(`Requires ${SKILLS[sk].name} level ${it.req}.`, 'lg-bad'); return; }
  if (!take(id)) return;
  if (S.equip[it.slot]) give(S.equip[it.slot]);
  S.equip[it.slot] = id;
  // a 2h sword needs both hands, and a shield pushes the 2h out
  if (it.twoHanded && S.equip.shield) unequip('shield');
  if (it.slot === 'shield' && S.equip.weapon && ITEMS[S.equip.weapon].twoHanded) unequip('weapon');
  log(`Equipped ${it.name}`);
  if (R.ent && R.ent.kind === 'enemy' && R.phase === 'act') R.atkT = Math.min(R.atkT, playerSpeed());
}
function weaponDps(it) { return it.power / (it.speed || 1.8); }
// only a stronger item of the same kind counts, so a new bow never replaces a sword on its own
function isUpgrade(id) {
  const it = ITEMS[id], cur = S.equip[it.slot];
  if (!canEquip(id)) return false;
  if (it.twoHanded && S.equip.shield) return false;
  if (it.slot === 'shield' && S.equip.weapon && ITEMS[S.equip.weapon].twoHanded) return false;
  if (!cur) return it.slot !== 'amulet' && (it.slot !== 'weapon' || it.wtype === 'melee');
  const c = ITEMS[cur];
  if (it.slot === 'weapon') return c.wtype === it.wtype && weaponDps(c) < weaponDps(it);
  if (ARMOUR_SLOTS.includes(it.slot)) return c.armor < it.armor;
  return false;
}
function unequip(slot) {
  if (!S.equip[slot]) return;
  give(S.equip[slot]); S.equip[slot] = null; uiDirty = true;
}

function buyTool(tool) {
  const lvl = S.tools[tool];
  if (lvl >= 4 || S.gold < TOOL_COST[lvl]) return;
  S.gold -= TOOL_COST[lvl]; S.tools[tool]++;
  log(`🏪 Upgraded ${TOOL_NAMES[tool]} to level ${S.tools[tool]}`, 'lg-good');
  uiDirty = true;
}
function buy(i, times) {
  const it = SHOP[i];
  times = Math.min(times, Math.floor(S.gold / it.cost));
  if (times <= 0) return;
  S.gold -= it.cost * times; give(it.id, it.n * times);
  log(`🏪 Bought ${fmt(it.n * times)}× ${ITEMS[it.id].name}`);
}

/* ===== Prayer ===== */
function bury(id, n, quiet) {
  n = quiet ? n : Math.min(n, has(id));
  if (n <= 0) return;
  if (!quiet) take(id, n);
  addXp('prayer', ITEMS[id].bury * n);
  S.pp = Math.min(9999, S.pp + ITEMS[id].pp * n);
  S.stats.buried += n;
  if (!quiet) log(`🙏 Buried ${n}× ${ITEMS[id].name}`, 'lg-good');
}
function togglePrayer(id) {
  const p = PRAYERS.find(x => x.id === id);
  if (!p || LV.prayer < p.lvl) return;
  S.prayer = S.prayer === id ? null : id;
}

/* ===== Slayer ===== */
function taskOptions() {
  const out = [];
  ZONES.forEach((z, i) => { if (zoneOpen(i)) for (const id of new Set(z.enemies)) out.push({ id, zone: i }); });
  return out;
}
function newTask() {
  const opts = taskOptions();
  const o = opts[Math.floor(Math.random() * opts.length)];
  const n = randi(15, 35);
  S.task = { id: o.id, zone: o.zone, n, left: n };
  log(`💀 Slayer task: defeat ${n}× ${ENEMIES[o.id].name} in ${ZONES[o.zone].name}`, 'lg-xp');
  uiDirty = true;
}
function skipTask() { if (S.scoins < 25 || !S.task) return; S.scoins -= 25; newTask(); }
function slayerKill(e) {
  addXp('slayer', e.d.hp * 0.25 * (1 + amu('slay')));
  S.scoins += Math.max(1, Math.round(e.d.hp / 60));
  if (--S.task.left > 0) return;
  const bonus = 10 + S.task.n * 2;
  S.scoins += bonus; S.stats.tasks++;
  rollPet('wolf', 1 / 25);
  log(`💀 Slayer task complete! +${bonus} Slayer coins`, 'lg-xp');
  showBanner('💀 Slayer task complete!'); sfx('level');
  S.task = null;
  // keep the idle loop going: Auto Slayer asks for the next task by itself
  if (S.autoSlayer) newTask();
}
function buySlayer(i) {
  const it = SLAYER_SHOP[i];
  if (S.scoins < it.cost) return;
  if (it.id === 'autoslayer') { if (S.ownsAutoSlayer) return; S.ownsAutoSlayer = true; S.autoSlayer = true; }
  else give(it.id);
  S.scoins -= it.cost;
  log(`💀 Bought ${it.name || ITEMS[it.id].name}`, 'lg-good');
}

/* ===== Quests ===== */
function objVal(o) {
  switch (o.t) {
    case 'kill': return S.kc[o.id] || 0;
    case 'smith': return S.stats.smithed;
    case 'cook': return S.stats.cooked;
    case 'fletch': return S.stats.fletched;
    case 'rc': return S.stats.rc;
    case 'gather': return S.stats.g[o.skill] || 0;
    case 'bury': return S.stats.buried;
    case 'tasks': return S.stats.tasks;
    case 'steal': return S.stats.stolen;
    case 'burn': return S.stats.burned;
    case 'boss': return S.bosses[o.z] ? 1 : 0;
    case 'level': return LV[o.skill];
  }
  return 0;
}
const ABSOLUTE_OBJ = new Set(['boss', 'level']);
function objNeed(o) { return o.t === 'boss' ? 1 : o.n; }
function objProgress(q, k) {
  const o = q.obj[k], v = objVal(o);
  return Math.min(objNeed(o), ABSOLUTE_OBJ.has(o.t) ? v : v - S.quests[q.id].base[k]);
}
function objText(o) {
  switch (o.t) {
    case 'kill': return `Defeat ${ENEMIES[o.id].name}`;
    case 'smith': return 'Smith items';
    case 'cook': return 'Cook fish';
    case 'fletch': return 'Fletch items';
    case 'rc': return 'Craft runes';
    case 'gather': return o.skill === 'essence' ? 'Mine Rune Essence' : `Gather (${SKILLS[o.skill].name})`;
    case 'bury': return 'Bury bones';
    case 'tasks': return 'Complete Slayer tasks';
    case 'steal': return 'Pickpocket successfully';
    case 'burn': return 'Burn logs';
    case 'boss': return `Defeat ${ENEMIES[ZONES[o.z].boss].name}`;
    case 'level': return `Reach ${SKILLS[o.skill].name} level`;
  }
}
function questState(q) { return S.quests[q.id] ? S.quests[q.id].s : (!q.req || (S.quests[q.req] && S.quests[q.req].s === 'done')) ? 'open' : 'locked'; }
function questReady(q) { return questState(q) === 'active' && q.obj.every((o, k) => objProgress(q, k) >= objNeed(o)); }
function questsDone() { return QUESTS.filter(q => questState(q) === 'done').length; }
function startQuest(id) {
  const q = QUESTS.find(x => x.id === id);
  if (!q || questState(q) !== 'open') return;
  S.quests[id] = { s: 'active', base: q.obj.map(objVal) };
  log(`📜 Quest started: ${q.name}`, 'lg-xp');
}
function claimQuest(id) {
  const q = QUESTS.find(x => x.id === id);
  if (!q || !questReady(q)) return;
  S.quests[id] = { s: 'done' };
  const w = q.rew;
  if (w.gold) S.gold += w.gold;
  if (w.scoins) S.scoins += w.scoins;
  for (const [it, n] of Object.entries(w.items || {})) give(it, n);
  for (const [sk, xp] of Object.entries(w.xp || {})) addXp(sk, xp);
  log(`📜 Quest complete: ${q.name}! ${rewardText(w)}`, 'lg-gold');
  showBanner(`📜 Quest complete: ${q.name}`); sfx('chest');
}
function rewardText(w) {
  const parts = [];
  if (w.gold) parts.push(`${fmt(w.gold)} gold`);
  if (w.scoins) parts.push(`${w.scoins} Slayer coins`);
  for (const [it, n] of Object.entries(w.items || {})) parts.push(`${n}× ${ITEMS[it].name}`);
  for (const [sk, xp] of Object.entries(w.xp || {})) parts.push(`${fmt(xp)} ${SKILLS[sk].name} XP`);
  return parts.join(', ');
}

/* ================= OFFLINE ================= */

function snapshot() {
  return { skills: { ...S.skills }, lv: { ...LV }, inv: { ...S.inv }, gold: S.gold, kills: S.kills, deaths: S.deaths, bosses: [...S.bosses], ach: { ...S.ach } };
}
function simulate(sec) {
  sec = Math.min(sec, offlineCap());
  SIM = true;
  const step = 0.2;
  for (let t = 0; t < sec; t += step) tick(step);
  SIM = false;

let actx = null;
const sfxLast = {};

  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
}
function tone(freq, dur, type = 'square', vol = 0.12, slide = 0, delay = 0) {
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfx(kind) {
  if (SIM || S.muted || !actx || actx.state !== 'running') return;
  const now = performance.now();
  if (now - (sfxLast[kind] || 0) < 60) return;
  sfxLast[kind] = now;
  switch (kind) {
    case 'hit': tone(190, 0.08, 'square', 0.07, 0.4); break;
    case 'crit': tone(420, 0.12, 'sawtooth', 0.08, 0.3); tone(160, 0.12, 'square', 0.06, 0.5, 0.02); break;
    case 'hurt': tone(130, 0.14, 'sawtooth', 0.07, 0.5); break;
    case 'coin': tone(988, 0.07, 'square', 0.05); tone(1319, 0.1, 'square', 0.05, 0, 0.07); break;
    case 'gather': tone(330, 0.05, 'triangle', 0.08, 0.6); break;
    case 'clink': tone(1400, 0.08, 'triangle', 0.07); tone(2100, 0.06, 'triangle', 0.04, 0, 0.02); break;
    case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'triangle', 0.09, 0, i * 0.08)); break;
    case 'chest': [784, 988, 1319].forEach((f, i) => tone(f, 0.1, 'square', 0.05, 0, i * 0.06)); break;
    case 'magic': [660, 880, 1175, 1568].forEach((f, i) => tone(f, 0.2, 'sine', 0.07, 0, i * 0.05)); break;
    case 'boss': tone(98, 0.6, 'sawtooth', 0.09, 0.7); tone(147, 0.6, 'sawtooth', 0.05, 0.7, 0.05); break;
    case 'bow': tone(520, 0.07, 'triangle', 0.06, 0.4); break;
    case 'zap': tone(880, 0.18, 'sine', 0.06, 0.3); tone(1320, 0.12, 'sine', 0.03, 0.5, 0.03); break;
  }
}

function entScreenX(e) { return e.x - R.worldX + HX; }
function entHeight(e) {

function ridge(f, color, base, amp, freq, seed, peaky) {

function drawBackground(z) {

    ctx.fillStyle = sg; ctx.fillRect(sx - 100, 0, 200, 170);

    else if (th.decor === 'house') {

      rr(x - 5 * s, by - 16 * s, 10 * s, 16 * s, 1, shade(c, -0.15));

function heroTool() {
  const a = S.activity;
  if (a === 'combat') {
    const w = S.equip.weapon ? ITEMS[S.equip.weapon] : null;
    const blade = w ? w.color || TIER_COLORS[w.tier] || '#c0c4cc' : '#8a6a4a';
    if (wtype() === 'ranged') return () => drawBow(w && w.tier !== undefined ? TIER_COLORS[w.tier] : '#8a6a4a', R.swing < 0.5);
    if (wtype() === 'magic') { const sp = curSpell(); return () => drawStaff(sp ? sp.color : '#888'); }
    if (!w) return null;
    const kind = w.kind || 'sword';
    // blade length and shape follow the weapon type
    const len = { dagger: 16, sword: 28, scimitar: 28, '2h': 44 }[kind] || 30, wide = kind === '2h' ? 3.6 : 2.5;
    return () => {
      rr(-1.5, 15, 3, kind === '2h' ? 12 : 8, 1, '#5a3a22');
      rr(-6, 22 + (kind === '2h' ? 4 : 0), 12, 3, 1, '#c9a43a');

  if (a === 'thieving') return null;
  if (a === 'firemaking') return () => { rr(-4, 16, 8, 6, 1, '#7a6a5a'); };
  if (a === 'fletching') return () => { rr(-1.5, 14, 3, 8, 1, '#5a3a22'); poly([-2, 22, 2, 22, 0, 36], '#cfd4dc'); };
  if (a === 'runecrafting') return () => {

function heroArmAngle() {
  if (R.phase === 'walk') return Math.sin(time * 13) * 0.6;
  if (R.phase === 'dead') return 0.3;
  if (S.activity === 'fishing') return -2.05 - R.swing * 0.4;
  if (S.activity === 'cooking') return -1.35 + Math.sin(time * 2) * 0.08;
  if (S.activity === 'runecrafting') return -2.3 + Math.sin(time * 3) * 0.1 - R.swing * 0.3;
  if (S.activity === 'thieving') return R.ent && R.ent.stun > 0 ? 0.4 : -1.25 - R.swing * 0.35;

function drawHero() {
